 bukan seorang warga lokal atau yang mereka sebut non-pribumi. Ada orang tua yang mendukung digugurkannya calon ketua OSIS non- pribumi tersebut dan ada yang menolak. Salah satu orang tua melontarkan kata-kata yang mengandung ujaran kebencian saat rapat berlangsung. Rapat virtual pun berlanjut dengan perdebatan sengit antar orang tua. Maka sikap anda...", "choices": {"A": "Menyampaikan pendapat Anda bahwa kritik terhadap diskriminasi itu bisa saja diterima tanpa memperpanjang masalah dengan makian yang mengandung ujaran kebencian pada kelompok tertentu.", "B": "Menegur pihak yang melontarkan makian yang mengandung ujaran kebencian pada kelompok tertentu dan melanjutkan pembahasan masalah diskriminasi pemilihan tersebut.", "C": "Menengahi kedua belah pihak agar tidak terus berseteru apalagi sampai melontarkan makian yang mengandung ujaran kebencian pada kelompok tertentu dan mengajak para orang tua untuk kembali fokus menyelesaikan masalah diskriminasi tersebut.", "D": "Langsung keluar dari rapat virtual tersebut karena tidak ingin terlibat dalam perdebatan itu.", "E": "Tidak ikut-ikutan berdebat karena takut dianggap berpihak ke salah satu pihak dan ikut menyudutkan pihak lain."}, "correct": "C", "pembahasan": "Menengahi kedua belah pihak agar tidak terus berseteru apalagi sampai melontarkan makian yang mengandung ujaran kebencian pada kelompok tertentu dan mengajak para orang tua untuk kembali fokus menyelesaikan masalah diskriminasi tersebut. Urutan Skor Tertinggi - Rendah = CBAED Soal tersebut menguji kemampuan Anda dalam merespons dan menanggapi situasi yang berkaitan dengan radikalisme, dengan fokus pada aspek anti-radikalisme. Tujuan dari soal ini adalah untuk menilai pengetahuan Anda tentang anti-radikalisme, sikap Anda dalam menghadapi situasi yang menantang, dan kemampuan Anda untuk bertindak secara bijaksana dalam merespons stimulus yang mungkin memicu kecenderungan radikalisme. Dalam situasi tersebut, poin tertinggi diberikan pada pilihan jawaban yang menunjukkan bahwa Anda mengambil peran sebagai mediator dalam perdebatan dan menegur pihak yang menggunakan makian atau ujaran   kebencian. Tindakan ini mencerminkan sikap anti-radikalisme yang proaktif dan bertanggung jawab, serta upaya untuk mencegah penyebaran sentimen negatif yang dapat memperburuk kondisi. Di sisi lain, poin terendah diberikan pada jawaban yang menunjukkan sikap intoleransi dengan tidak peduli terhadap masalah di sekitar Anda. Sikap ini mencerminkan ketidakpedulian yang berpotensi memperburuk situasi dan tidak mendukung upaya pencegahan radikalisme dalam masyarakat. Dengan demikian, penting untuk merespons situasi yang berkaitan dengan radikalisme dengan bijaksana dan bertanggung jawab, serta menunjukkan sikap yang proaktif dalam memerangi penyebaran ideologi radikal. Hal ini merupakan bagian dari upaya bersama untuk menjaga keamanan dan stabilitas dalam masyarakat."}, {"id": 5, "question": "Kemajuan perkembangan teknologi informasi dan komunikasi saat ini memungkinkan semakin cepatnya arus persebaran informasi. Namun kemajuan ini tidak hanya membawa dampak positif, melainkan juga dampak negatif. Contoh dampak negatif yang ditimbulkan adalah semakin maraknya penyebaran berita hoaks, salah satunya berita provokatif yang berisi menjelek-jelekkan pemerintah dan kebijakannya. Apabila Anda menemui artikel/berita yang berisi menjelek-jelekkan kebijakan pemerintah, sikap Anda adalah ..", "choices": {"A": "Memastikan kebenaran informasi tersebut dan tidak akan ikut menyebarkan informasi tersebut apabila tidak sesuai dengan fakta.", "B": "Melaporkan peredaran berita tersebut kepada pihak berwajib agar pihak yang menyebarkan dapat segera ditindak, serta menjadi pelajaran bagi orang lain untuk berhati-hati dalam membuat artikel.", "C": "Artikel seperti itu merupakan bentuk kebebasan berpendapat dan memiliki peran penting dalam mengontrol pelaksanaan pemerintahan, sehingga harus bijak dalam menyikapinya.", "D": "Memastikan kebenaran informasi tersebut, bila informasi tersebut tidak sesuai dengan fakta maka akan menginformasikan kepada orang lain agar berhati-hati dan tidak mudah percaya", "E": "Masalah kebijakan pemerintah adalah tanggung jawab para pemangku kepentingan, khususnya bagi dewan legislatif dan eksekutif dengan masing-masing perannya."}, "correct": "D", "pembahasan": "Memastikan kebenaran informasi tersebut, bila informasi tersebut tidak sesuai dengan fakta maka akan menginformasikan kepada orang lain agar berhati-hati dan tidak mudah percaya Urutan Skor Tertinggi - Rendah = DABCE Soal ini menguji kemampuan Anda dalam menanggapi situasi yang berkaitan dengan radikalisme, khususnya dalam konteks informasi provokatif atau hoaks. Tujuannya adalah untuk menilai pengetahuan Anda tentang anti-radikalisme, sikap Anda dalam menghadapi situasi tersebut, dan kemampuan Anda untuk bertindak secara bijaksana dalam menanggapi stimulus yang mungkin memicu kecenderungan radikalisme. Dalam menghadapi berita yang bersifat provokatif atau hoaks, penting untuk bersikap bijaksana dan kritis. Langkah pertama adalah memeriksa kebenaran berita tersebut sebelum menyebarkannya lebih lanjut. Jika ternyata berita tersebut tidak benar, Anda memiliki tanggung jawab untuk   menghentikan penyebarannya dengan cara tidak ikut menyebarkan berita tersebut dan menghimbau orang lain agar waspada serta berhati-hati terhadap berita palsu. Tindakan ini penting untuk mencegah penyebaran informasi yang salah atau memicu ketegangan dan konflik dalam masyarakat. Dengan demikian, Anda dapat berperan sebagai agen perubahan yang mendukung perdamaian dan keamanan, serta melawan radikalisme dengan cara yang efektif dan bertanggung jawab."}, {"id": 6, "question": "Seorang kerabat membagikan video yang terekam pada peristiwa persekusi terhadap seorang remaja melalui pesan ke grup obrolan keluarga. Orang yang membagikan video tersebut menjelaskan bahwa korban persekusi adalah orang yang telah melecehkan agamanya dan layak diperlakukan demikian (dipersekusi) agar tidak mengulangi perbuatanya. Bagaimana tanggapan Anda terhadap hal tersebut?", "choices": {"A": "Segera menegur orang yang membagikan video tersebut dan menyampaikan pendapat anda serta melaporkan aksi tersebut ke polisi agar segera ditindak.", "B": "Meminta kerabat untuk berhenti mengirimi video semacam itu.", "C": "Menentang aksi persekusi tersebut dan memberikan pendapat anda di grup obrolan agar anggota grup tidak sembarangan melakukan dan membagikan hal yang melanggar UU tersebut.", "D": "Ikut serta dalam membantu menyebarkan video tersebut agar tidak ada lagi orang yang berani melecehkan agama.", "E": "Membantah kebenaran informasi tentang video tersebut karena persekusi adalah perbuatan yang tidak dibenarkan secara hukum maupun kemanusiaan."}, "correct": "C", "pembahasan": "Menentang aksi persekusi tersebut dan memberikan pendapat anda di grup obrolan agar anggota grup tidak sembarangan melakukan dan membagikan hal yang melanggar UU tersebut. Urutan Skor Tertinggi - Rendah = CAEBD Soal tersebut bertujuan untuk menguji kemampuan Anda dalam menghadapi situasi yang berkaitan dengan anti-radikalisme. Tujuannya adalah untuk menilai seberapa baik Anda dalam menggali informasi tentang pengetahuan anti-radikalisme, sikap Anda terhadap berbagai situasi, dan kemampuan Anda dalam bertindak secara bijaksana terhadap stimulus yang mungkin memicu atau berkaitan dengan radikalisme. Pada poin tertinggi, Anda menunjukkan sikap yang sangat mendukung antiradikalisme dengan menentang aksi persekusi. Anda memilih untuk memberikan pemahaman kepada orang yang menyebar video untuk tidak melakukan tindakan persekusi karena hal tersebut merupakan perbuatan sewenang-wenang yang tidak sesuai dengan prinsip keadilan dan martabat manusia. Tindakan ini mencerminkan sikap yang bijaksana, toleran, dan mengutamakan penyelesaian masalah dengan cara yang damai dan sesuai dengan hukum. Sementara itu, pada poin terendah, Anda menunjukkan sikap yang mendukung aksi persekusi. Hal ini menunjukkan kurangnya pemahaman atau kesadaran tentang pentingnya menjunjung tinggi nilainilai kemanusiaan, keadilan, dan perdamaian. Mendukung aksi persekusi hanya akan memperburuk situasi dan berpotensi menimbulkan konflik serta pelanggaran terhadap hak asasi manusia.   Dalam konteks anti-radikalisme, penting bagi setiap individu untuk memahami bahwa aksi persekusi tidak akan menyelesaikan masalah, melainkan hanya akan memperkeruh suasana dan merugikan banyak pihak. Sikap yang sebaiknya diambil adalah mengedepankan dialog, pemahaman, dan penyelesaian masalah secara damai dan sesuai dengan hukum."}, {"id": 7, "question": "Menteri Agama RI Jenderal (Purn) Fachrul Razi menyampaikan bahwa Pancasila mempersatukan berbagai keragaman yang Indonesia miliki, baik dari segi agama, budaya, bahasa, suku, etnis, dan keragaman lainnya. Akan tetapi, Fachrul juga mengakui bahwa dalam perjalanan Bangsa Indonesia, masih ada pihak-pihak yang masih berusaha membenturkan nilai-nilai Pancasila dengan nilai-nilai agama. Ada sebagian pihak yang menyebutkan bahwa tidak ada hukum yang lebih tinggi selain hukum Tuhan. Beberapa praktik ajaran agama dianggap bertolak belakang dengan nilai-nilai Pancasila, menurut anda ...", "choices": {"A": "Diperlukan kajian mendalam terhadap gagasan tersebut", "B": "Anggapan tersebut tidak benar", "C": "Anggapan tersebut bisa saja benar", "D": "Anggapan tersebut tidak berdasar", "E": "Pancasila tidak sesuai dengan karakter masyarakat yang mayoritas Islam"}, "correct": "D", "pembahasan": "Anggapan tersebut tidak berdasar Urutan Skor Tertinggi - Rendah = DBACE Aspek anti radikalisme dengan tujuan: menjaring informasi dari individu tentang pengetahuan terhadap anti radikalisme, kecenderungan bersikap, dan bertindak saat menanggapi stimulus dengan beberapa alternatif situasi. Indonesia sebagai negara Pancasila juga memfasilitasi dan mengakomodasi penyelenggaraan aktivitas keagamaan setiap warga negara, serta pada saat yang sama tetap menjamin kebebasan setiap warga negaranya untuk menjalankan keyakinan serta kepercayaannya masing-masing, tanpa ditentukan oleh Negara. Maka, Pancasila sama sekali tidak bertentangan dengan nilai-nilai agama mana pun. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda mempertanyakan dasar asumsi tersbeut. Poin terendah ada pada jawaban yang menunjukkan bahwa anda menganggap pancasila tidak sesuai dengan karakter kelompok agama mayoritas."}, {"id": 9, "question": "Anggota Dewan Pengarah Badan Pembinaan Ideologi Pancasila (BPIP) Mohammad Mahfud MD mengungkapkan ada pihak yang ingin mengganti ideologi Pancasila ke khilafah. Namun, upaya itu tak pernah berhasil karena rakyat sudah memutuskan ideologi Pancasila tak bisa diganggu gugat. Melihat adanya tulisan yang mengandung narasi untuk mengubah ideologi Pancasila dengan ideologi negara Islam di beranda media sosial anda, maka anda ...", "choices": {"A": "Saya akan menentang hal tersebut dan menyampaikan pendapat saya di kolom komentar karena ideologi Pancasila berdasar pada bangsa Indonesia sendiri", "B": "Membiarkannya karena Pancasila sangat tidak sesuai dengan kehidupan keagamaan di zaman ini", "C": "Salah dan saya akan memblokir dan melaporkan akun tersebut agar narasi tersebut tidak semakin meluas   D. Sudah tepat dan saya mendukung upaya tersebut dengan ikut menyebarkan tulisan tersebut di akun media sosial saya", "E": "Saya akan menanggapi dengan komentar untuk berhati-hati bahwa hal tersebut merupakan upaya pihak luar dalam penyebaran paham radikal"}, "correct": "A", "pembahasan": "Saya akan menentang hal tersebut dan menyampaikan pendapat saya di kolom komentar karena ideologi Pancasila berdasar pada bangsa Indonesia sendiri Urutan Skor Tertinggi - Rendah = ACEBD Soal ini bertujuan untuk mengevaluasi sikap Anda terhadap radikalisme serta kemampuan Anda dalam merespons situasi terkait dengan paham tersebut. Poin tertinggi diberikan pada jawaban yang menunjukkan bahwa Anda menolak paham radikalisme dengan tegas dan tidak gegabah. Artinya, Anda memiliki kesadaran yang kuat akan bahaya radikalisme dan bersedia bertindak secara tegas untuk melawannya. Sikap ini menunjukkan bahwa Anda mendukung nilai-nilai kedamaian, toleransi, dan keberagaman, serta memiliki komitmen untuk menjaga stabilitas sosial. Sementara itu, poin terendah diberikan pada jawaban yang menunjukkan bahwa Anda mendukung paham radikalisme. Ini menunjukkan bahwa Anda mungkin tidak memiliki pemahaman yang memadai tentang konsekuensi negatif dari radikalisme atau bahkan mendukung ideologi yang bertentangan dengan nilai-nilai kemanusiaan, perdamaian, dan keadilan. Sikap ini berpotensi membahayakan diri sendiri serta masyarakat sekitar karena dapat memperkuat dan menyebarkan paham radikal yang dapat mengancam stabilitas dan keselamatan. Dalam konteks anti-radikalisme, penting untuk memiliki sikap yang tegas menentang paham radikalisme dan ekstremisme. Hal ini mencakup penolakan terhadap ideologi atau tindakan yang mengancam perdamaian, kebebasan, dan keadilan dalam masyarakat. Dengan menguatkan sikap penolakan terhadap radikalisme, kita dapat bersama-sama membangun masyarakat yang damai, inklusif, dan berkeadilan."}, {"id": 10, "question": "Banjir dan tanah longsor terjadi di Kota Manado, Sulawesi Utara pada bulan Januari lalu. Bencana yang diakibatkan hujan dengan intensitas tinggi dan struktur tanah yang labil tersebut menyebabkan 500 jiwa harus mengungsi dan lima orang meninggal dunia. Sebagian besar pegungsi yang ada di lingkungan tempat tinggal anda adalah jemaah gereja Kristen yang tak hanya kehilangan tempat ibadahnya tapi juga tempat tinggalnya. Apabila anda bukan penganut agama Kristen, maka sikap anda adalah ...", "choices": {"A": "Menyebarkan informasi tersebut kepada warga sekitar yang sekiranya bisa ikut menyumbang pasokan kebutuhan dasar", "B": "Ikut membantu dengan mengumpulkan harta benda yang sekiranya bisa digunakan di pengungsian dan mengajak warga sekitar, teman dan kerabat untuk ikut membantu menyumbang untuk para       if (val.questions.length === 0) return;
      const prog = state.progress[key] || {};
      const done = prog.lastScore !== undefined ? prog.lastScore : null;
      const el2 = document.createElement('div');
      el2.className = 'nav-item';
      el2.id = 'nav-topic-' + key;
      el2.onclick = () => startTopic(key);
      el2.innerHTML = `
        <span class="cat-dot ${cat}"></span>
        <span style="flex:1;line-height:1.3">${titleCase(key)}</span>
        <span class="nav-badge">${val.questions.length}</span>
      `;
      el.appendChild(el2);
    });
  });
}

function titleCase(s) {
  return s.split(' ').map(w => w[0] + w.slice(1).toLowerCase()).join(' ');
}

// ===== NAVIGATION =====
function showPage(page, extra) {
  state.page = page;
  ['home','simulasi','ai','progress'].forEach(p => {
    const n = document.getElementById('nav-' + p);
    if (n) n.classList.toggle('active', p === page);
  });
  document.getElementById('modeTabs').style.display = (page === 'quiz') ? 'flex' : 'none';
  
  const titles = { home: 'Beranda', simulasi: 'Simulasi Ujian', ai: 'AI Tutor', progress: 'Progress Belajar', quiz: state.topic ? titleCase(state.topic) : '' };
  document.getElementById('topTitle').textContent = titles[page] || extra || '';
  
  const content = document.getElementById('content');
  if (page === 'home') renderHome(content);
  else if (page === 'quiz') renderQuiz(content);
  else if (page === 'simulasi') renderSimulasi(content);
  else if (page === 'ai') renderAI(content);
  else if (page === 'progress') renderProgress(content);
}

function startTopic(key) {
  if (!SOAL_DATA[key] || SOAL_DATA[key].questions.length === 0) return;
  state.topic = key;
  state.questions = [...SOAL_DATA[key].questions];
  state.current = 0;
  state.answers = {};
  state.revealed = {};
  state.score = null;
  state.mode = 'latihan';
  closeSidebar();
  
  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-topic-' + key);
  if (navEl) navEl.classList.add('active');
  
  showPage('quiz');
}

function setMode(m) {
  state.mode = m;
  state.current = 0;
  state.answers = {};
  state.revealed = {};
  state.score = null;
  if (m === 'kilat') {
    // Shuffle
    state.questions = [...SOAL_DATA[state.topic].questions].sort(() => Math.random() - .5);
  } else {
    state.questions = [...SOAL_DATA[state.topic].questions];
  }
  document.getElementById('tab-latihan').classList.toggle('active', m === 'latihan');
  document.getElementById('tab-kilat').classList.toggle('active', m === 'kilat');
  renderQuiz(document.getElementById('content'));
}

// ===== QUIZ =====
function renderQuiz(el) {
  if (state.score !== null) { renderResult(el); return; }
  const q = state.questions[state.current];
  const total = state.questions.length;
  const pct = ((state.current + 1) / total) * 100;
  const isRevealed = state.revealed[state.current];
  const chosen = state.answers[state.current];
  const cat = SOAL_DATA[state.topic].category;
  
  el.innerHTML = `
    <div class="quiz-header">
      <button class="btn-back" onclick="backToHome()">← Kembali</button>
      <h2>${titleCase(state.topic)}</h2>
      <span class="cat-badge ${cat}">${cat}</span>
      <span class="q-progress">${state.current + 1} / ${total}</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    
    <div class="q-card" style="animation:fadeIn .25s ease">
      <div class="q-num">Soal ${state.current + 1} dari ${total}</div>
      <div class="q-text">${q.question}</div>
    </div>
    
    <div class="choices" id="choices"></div>
    
    <div class="pembahasan ${isRevealed ? 'show' : ''}" id="pembahasan">
      <div class="pem-title">📖 Pembahasan — Jawaban: ${q.correct}</div>
      <div class="pem-text">${q.pembahasan || 'Jawaban yang benar adalah pilihan ' + q.correct + '.'}</div>
    </div>
    
    <div class="quiz-actions" style="margin-top:20px">
      <button class="btn btn-secondary" onclick="prevQ()" ${state.current === 0 ? 'disabled' : ''}>← Prev</button>
      ${isRevealed ? 
        `<button class="btn btn-primary" onclick="nextQ()">${state.current === total - 1 ? 'Lihat Hasil 🎉' : 'Soal Berikutnya →'}</button>` :
        `<button class="btn btn-primary" onclick="revealAnswer()" ${chosen === undefined && state.mode === 'kilat' ? 'disabled' : ''} id="btnReveal">
          ${chosen === undefined ? (state.mode === 'kilat' ? 'Pilih jawaban dulu' : 'Tampilkan Pembahasan') : 'Tampilkan Pembahasan'}
        </button>`
      }
      <button class="btn btn-secondary" onclick="skipQ()" style="margin-left:auto">Lewati</button>
    </div>
  `;
  
  renderChoices(q, isRevealed, chosen);
}

function renderChoices(q, isRevealed, chosen) {
  const el = document.getElementById('choices');
  if (!el) return;
  el.innerHTML = Object.entries(q.choices).map(([k, v]) => {
    let cls = 'choice';
    if (isRevealed) {
      cls += k === q.correct ? ' correct' : (k === chosen ? ' wrong' : '');
    } else if (k === chosen) {
      cls += ' selected';
    }
    if (isRevealed) cls += ' locked';
    return `<div class="${cls}" onclick="chooseAnswer('${k}')">
      <span class="choice-key">${k}</span>
      <span>${v}</span>
    </div>`;
  }).join('');
}

function chooseAnswer(key) {
  if (state.revealed[state.current]) return;
  state.answers[state.current] = key;
  if (state.mode === 'kilat') {
    revealAnswer();
    return;
  }
  // Update choices visual only
  const q = state.questions[state.current];
  document.querySelectorAll('.choice').forEach(el => {
    const k = el.querySelector('.choice-key').textContent;
    el.className = 'choice' + (k === key ? ' selected' : '');
  });
  const btnReveal = document.getElementById('btnReveal');
  if (btnReveal) { btnReveal.disabled = false; btnReveal.textContent = 'Tampilkan Pembahasan'; }
}

function revealAnswer() {
  state.revealed[state.current] = true;
  renderQuiz(document.getElementById('content'));
}

function nextQ() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz(document.getElementById('content'));
  } else {
    finishQuiz();
  }
}

function prevQ() {
  if (state.current > 0) { state.current--; renderQuiz(document.getElementById('content')); }
}

function skipQ() {
  if (state.current < state.questions.length - 1) { state.current++; renderQuiz(document.getElementById('content')); }
  else { finishQuiz(); }
}

function finishQuiz() {
  const qs = state.questions;
  let correct = 0;
  qs.forEach((q, i) => { if (state.answers[i] === q.correct) correct++; });
  const attempted = Object.keys(state.answers).length;
  const pct = Math.round((correct / qs.length) * 100);
  state.score = { correct, wrong: attempted - correct, skipped: qs.length - attempted, total: qs.length, pct };
  
  // Save progress
  state.progress[state.topic] = { lastScore: pct, lastDate: new Date().toISOString() };
  localStorage.setItem('cpns_progress', JSON.stringify(state.progress));
  
  renderResult(document.getElementById('content'));
}

function renderResult(el) {
  const s = state.score;
  const msg = s.pct >= 80 ? '🏆 Luar Biasa! Terus pertahankan!' : s.pct >= 60 ? '👍 Bagus! Tingkatkan lagi!' : '💪 Jangan menyerah, terus belajar!';
  el.innerHTML = `
    <div class="quiz-header">
      <button class="btn-back" onclick="backToHome()">← Kembali</button>
      <h2>Hasil — ${titleCase(state.topic)}</h2>
    </div>
    <div class="result-card" style="animation:fadeIn .4s ease">
      <div class="result-score">${s.pct}%</div>
      <div class="result-label">${msg}</div>
      <div class="result-meta">
        <div><strong>${s.correct}</strong> Benar</div>
        <div><strong>${s.wrong}</strong> Salah</div>
        <div><strong>${s.skipped}</strong> Dilewati</div>
        <div><strong>${s.total}</strong> Total</div>
      </div>
    </div>
    <div class="result-breakdown">
      <div class="rb-item"><span class="rb-num correct-num">${s.correct}</span><span style="color:var(--text2)">Jawaban benar dari ${s.total} soal</span></div>
      <div class="rb-item"><span class="rb-num wrong-num">${s.wrong}</span><span style="color:var(--text2)">Jawaban salah</span></div>
    </div>
    <div style="display:flex;gap:12px">
      <button class="btn btn-primary" onclick="retryQuiz()">🔄 Coba Lagi</button>
      <button class="btn btn-secondary" onclick="reviewQuiz()">📖 Review Soal</button>
      <button class="btn btn-secondary" onclick="backToHome()">🏠 Beranda</button>
    </div>
  `;
}

function retryQuiz() {
  state.current = 0;
  state.answers = {};
  state.revealed = {};
  state.score = null;
  state.questions = [...SOAL_DATA[state.topic].questions];
  renderQuiz(document.getElementById('content'));
}

function reviewQuiz() {
  // Show all answers for review
  state.current = 0;
  Object.keys(state.questions).forEach((_, i) => { state.revealed[i] = true; });
  state.score = null;
  renderQuiz(document.getElementById('content'));
}

function backToHome() {
  state.topic = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
  showPage('home');
}

// ===== SIMULASI =====
function renderSimulasi(el) {
  if (state.simStarted) { renderSimQuiz(el); return; }
  el.innerHTML = `
    <div class="sim-config" style="animation:fadeIn .3s ease">
      <h2>⏱️ Simulasi Ujian SKD</h2>
      <p>Rasakan pengalaman ujian CAT CPNS yang sesungguhnya dengan timer dan sistem penilaian resmi</p>
      <div class="sim-options">
        <div class="sim-option ${state.simMode==='mini'?'selected':''}" onclick="selectSim('mini')">
          <div class="s-icon">⚡</div>
          <h4>Mini Test</h4>
          <p>15 soal · 20 menit</p>
        </div>
        <div class="sim-option ${state.simMode==='half'?'selected':''}" onclick="selectSim('half')">
          <div class="s-icon">🎯</div>
          <h4>Half Test</h4>
          <p>40 soal · 60 menit</p>
        </div>
        <div class="sim-option ${state.simMode==='full'?'selected':''}" onclick="selectSim('full')">
          <div class="s-icon">🏆</div>
          <h4>Full SKD</h4>
          <p>110 soal · 100 menit</p>
        </div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:24px;font-size:13px;line-height:1.8;color:var(--text2)">
        <strong style="color:var(--text)">📋 Sistem Penilaian SKD:</strong><br>
        TWK: Benar +5, Salah 0 · TIU: Benar +5, Salah 0 · TKP: Benar +1–5, Salah 0<br>
        <strong style="color:var(--text)">Nilai Ambang Batas:</strong> TWK ≥65 | TIU ≥80 | TKP ≥166
      </div>
      <button class="btn btn-primary" onclick="startSimulasi()" ${!state.simMode?'disabled':''} style="width:100%">
        Mulai Simulasi ${state.simMode ? '→' : '(Pilih mode dulu)'}
      </button>
    </div>
  `;
}

function selectSim(mode) {
  state.simMode = mode;
  renderSimulasi(document.getElementById('content'));
}

function startSimulasi() {
  const configs = { mini: {n:15, t:1200}, half: {n:40, t:3600}, full: {n:110, t:6000} };
  const cfg = configs[state.simMode];
  
  // Build mix of questions
  const all = [];
  Object.values(SOAL_DATA).forEach(v => { v.questions.forEach(q => all.push({...q, cat: v.category, topic: v.title})); });
  const shuffled = all.sort(() => Math.random() - .5);
  state.simQuestions = shuffled.slice(0, cfg.n);
  state.simAnswers = {};
  state.simCurrent = 0;
  state.simTimeLeft = cfg.t;
  state.simStarted = true;
  
  clearInterval(state.simTimer);
  state.simTimer = setInterval(() => {
    state.simTimeLeft--;
    updateTimer();
    if (state.simTimeLeft <= 0) { clearInterval(state.simTimer); finishSim(); }
  }, 1000);
  
  renderSimQuiz(document.getElementById('content'));
}

function updateTimer() {
  const el = document.getElementById('simTimer');
  if (!el) return;
  const m = Math.floor(state.simTimeLeft / 60);
  const s = state.simTimeLeft % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer-text' + (state.simTimeLeft < 300 ? ' warning' : '');
}

function renderSimQuiz(el) {
  const q = state.simQuestions[state.simCurrent];
  const total = state.simQuestions.length;
  const chosen = state.simAnswers[state.simCurrent];
  
  el.innerHTML = `
    <div class="quiz-header">
      <h2>Simulasi ${state.simMode === 'mini' ? 'Mini Test' : state.simMode === 'half' ? 'Half Test' : 'Full SKD'}</h2>
      <span class="cat-badge ${q.cat}">${q.cat}</span>
      <span class="q-progress">${state.simCurrent + 1} / ${total}</span>
    </div>
    
    <div class="timer-bar">
      <span class="timer-icon">⏱️</span>
      <span class="timer-text" id="simTimer">--:--</span>
      <span class="timer-label">Sisa waktu</span>
      <button class="btn btn-secondary" onclick="finishSim()" style="padding:6px 14px;font-size:12px">Selesai</button>
    </div>
    
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${((state.simCurrent+1)/total)*100}%"></div></div>
    
    <div class="q-card" style="animation:fadeIn .25s ease">
      <div class="q-num">Soal ${state.simCurrent + 1} · ${titleCase(q.topic || '')}</div>
      <div class="q-text">${q.question}</div>
    </div>
    
    <div class="choices">
      ${Object.entries(q.choices).map(([k,v]) => `
        <div class="choice ${chosen === k ? 'selected' : ''}" onclick="simChoose('${k}')">
          <span class="choice-key">${k}</span>
          <span>${v}</span>
        </div>
      `).join('')}
    </div>
    
    <div class="quiz-actions" style="margin-top:20px">
      <button class="btn btn-secondary" onclick="simPrev()" ${state.simCurrent===0?'disabled':''}>← Prev</button>
      <button class="btn btn-primary" onclick="simNext()">${state.simCurrent === total-1 ? 'Selesai 🏁' : 'Berikutnya →'}</button>
      <span style="margin-left:auto;font-size:13px;color:var(--text2)">${Object.keys(state.simAnswers).length}/${total} dijawab</span>
    </div>
  `;
  
  updateTimer();
}

function simChoose(k) {
  state.simAnswers[state.simCurrent] = k;
  renderSimQuiz(document.getElementById('content'));
}

function simNext() {
  if (state.simCurrent < state.simQuestions.length - 1) { state.simCurrent++; renderSimQuiz(document.getElementById('content')); }
  else finishSim();
}

function simPrev() {
  if (state.simCurrent > 0) { state.simCurrent--; renderSimQuiz(document.getElementById('content')); }
}

function finishSim() {
  clearInterval(state.simTimer);
  state.simStarted = false;
  
  // Calculate scores
  let twkScore = 0, tiuScore = 0, tkpScore = 0;
  state.simQuestions.forEach((q, i) => {
    const ans = state.simAnswers[i];
    if (!ans) return;
    const cat = q.cat;
    const correct = ans === q.correct;
    if (cat === 'TWK') twkScore += correct ? 5 : 0;
    else if (cat === 'TIU') tiuScore += correct ? 5 : 0;
    else if (cat === 'TKP') tkpScore += correct ? 5 : 0;
  });
  
  const totalScore = twkScore + tiuScore + tkpScore;
  const twkPass = twkScore >= 65;
  const tiuPass = tiuScore >= 80;
  const tkpPass = tkpScore >= 166;
  
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="quiz-header">
      <button class="btn-back" onclick="resetSim()">← Simulasi Baru</button>
      <h2>Hasil Simulasi</h2>
    </div>
    <div class="result-card" style="animation:fadeIn .4s ease">
      <div class="result-score">${totalScore}</div>
      <div class="result-label">Total Nilai SKD</div>
      <div class="result-meta">
        <div><strong style="color:${twkPass?'var(--correct)':'var(--wrong)'}">${twkScore}</strong> TWK ${twkPass?'✓':'✗'}</div>
        <div><strong style="color:${tiuPass?'var(--correct)':'var(--wrong)'}">${tiuScore}</strong> TIU ${tiuPass?'✓':'✗'}</div>
        <div><strong style="color:${tkpPass?'var(--correct)':'var(--wrong)'}">${tkpScore}</strong> TKP ${tkpPass?'✓':'✗'}</div>
      </div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;font-size:14px;line-height:1.8">
      ${twkPass && tiuPass && tkpPass ? 
        '<span style="color:var(--correct);font-weight:700;font-size:16px">🏆 LULUS ambang batas SKD!</span>' :
        `<span style="color:var(--wrong);font-weight:700">❌ Belum mencapai ambang batas</span><br>
         ${!twkPass ? `<span style="color:var(--text2)">TWK perlu ≥65 (saat ini: ${twkScore})</span><br>` : ''}
         ${!tiuPass ? `<span style="color:var(--text2)">TIU perlu ≥80 (saat ini: ${tiuScore})</span><br>` : ''}
         ${!tkpPass ? `<span style="color:var(--text2)">TKP perlu ≥166 (saat ini: ${tkpScore})</span><br>` : ''}`
      }
    </div>
    <button class="btn btn-primary" onclick="resetSim()">🔄 Coba Lagi</button>
  `;
}

function resetSim() {
  state.simMode = null;
  renderSimulasi(document.getElementById('content'));
}

        <div class="quick-chip" onclick="askAI('Buatkan jadwal belajar CPNS 1 bulan')">Jadwal belajar</div>
      </div>
      <div class="ai-input-row">
        <textarea class="ai-input" id="aiInput" placeholder="Tanya materi CPNS, minta penjelasan soal..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI()}" rows="1"></textarea>
        <button class="btn-send" id="btnSend" onclick="sendAI()">
          <svg width="18" height="18" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  `;
  
  // Re-render old messages
  if (state.aiMessages.length > 0) {
    const msgEl = document.getElementById('aiMessages');
    msgEl.innerHTML = state.aiMessages.map(m => `
      <div class="msg ${m.role}">
        ${m.role === 'ai' ? '<div class="ai-name">AI TUTOR</div>' : ''}
        ${m.text}
      </div>
    `).join('');
    msgEl.scrollTop = msgEl.scrollHeight;
  }
}

async function askAI(text) {
  document.getElementById('aiInput').value = text;
  sendAI();
}

async function sendAI() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  document.getElementById('btnSend').disabled = true;
  document.getElementById('quickAsk').style.display = 'none';
  
  // Add user message
  state.aiMessages.push({ role: 'user', text });
  const msgEl = document.getElementById('aiMessages');
  msgEl.innerHTML += `<div class="msg user" style="animation:fadeIn .2s ease">${text}</div>`;
  
  // Add typing indicator
  const typingId = 'typing-' + Date.now();
  msgEl.innerHTML += `<div class="msg ai" id="${typingId}" style="animation:fadeIn .2s ease"><div class="ai-name">AI TUTOR</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgEl.scrollTop = msgEl.scrollHeight;
  
  try {
    const history = state.aiMessages.slice(-10).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.text.replace(/<[^>]+>/g, '')
    }));
    
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Kamu adalah AI Tutor khusus CPNS 2026 yang cerdas, ramah, dan suportif. Kamu membantu peserta CPNS belajar materi SKD yang meliputi:
- TWK (Tes Wawasan Kebangsaan): Bela Negara, Pancasila, UUD 1945, NKRI, Bhinneka Tunggal IKA, Nasionalisme, Integritas
- TIU (Tes Inteligensi Umum): Analogi, Silogisme, Analitis, Numerik, Pola Bilangan, Perbandingan, Kalimat Efektif, Gagasan Utama
- TKP (Tes Karakteristik Pribadi): Pelayanan Publik, Profesionalisme, Jejaring Kerja, TIK, Sosial Budaya, Anti Radikalisme

Sistem penilaian: TWK & TIU: benar +5, salah 0. TKP: benar +1 s/d +5.
Ambang batas: TWK ≥65, TIU ≥80, TKP ≥166.

Berikan jawaban yang jelas, ringkas, terstruktur, dan dalam Bahasa Indonesia yang baik. Gunakan emoji untuk membuatnya lebih menarik. Format dengan <br> untuk baris baru saat diperlukan.`,
        messages: history
      })
    });
    
    const data = await resp.json();
    const aiText = data.content?.[0]?.text || 'Maaf, terjadi kesalahan. Coba lagi ya!';
    
    state.aiMessages.push({ role: 'ai', text: aiText });
    document.getElementById(typingId).innerHTML = `<div class="ai-name">AI TUTOR</div>${aiText}`;
    msgEl.scrollTop = msgEl.scrollHeight;
    
  } catch(err) {
    document.getElementById(typingId).innerHTML = `<div class="ai-name">AI TUTOR</div>Maaf, terjadi kesalahan koneksi. Coba lagi!`;
  }
  
  document.getElementById('btnSend').disabled = false;
  input.focus();
}

// ===== PROGRESS =====
function renderProgress(el) {
  const prog = state.progress;
  const topics = Object.entries(SOAL_DATA).filter(([,v]) => v.questions.length > 0);
  const done = Object.keys(prog).length;
  const avgScore = done > 0 ? Math.round(Object.values(prog).reduce((a,v) => a + v.lastScore, 0) / done) : 0;
  
  const bycat = { TWK: [], TIU: [], TKP: [] };
  topics.forEach(([key, val]) => {
    const p = prog[key];
    bycat[val.category].push({ key, val, score: p ? p.lastScore : null, date: p ? new Date(p.lastDate).toLocaleDateString('id-ID') : null });
  });
  
  el.innerHTML = `
    <div style="animation:fadeIn .3s ease">
      <h2 style="font-size:22px;font-weight:800;margin-bottom:8px">📊 Progress Belajar</h2>
      <p style="color:var(--text2);margin-bottom:28px;font-size:14px">Pantau perkembangan latihan soal kamu</p>
      
      <div class="stats-row" style="margin-bottom:32px">
        <div class="stat-card"><div class="num">${done}</div><div class="lbl">Topik Dikerjakan</div></div>
        <div class="stat-card"><div class="num">${topics.length}</div><div class="lbl">Total Topik</div></div>
        <div class="stat-card"><div class="num">${avgScore}%</div><div class="lbl">Rata-rata Nilai</div></div>
        <div class="stat-card"><div class="num">${topics.length - done}</div><div class="lbl">Belum Dikerjakan</div></div>
      </div>
      
      ${['TWK','TIU','TKP'].map(cat => `
        <div style="margin-bottom:24px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <span class="cat-badge ${cat}">${cat}</span>
            <h3 style="font-size:15px;font-weight:700">
              ${cat === 'TWK' ? 'Tes Wawasan Kebangsaan' : cat === 'TIU' ? 'Tes Inteligensi Umum' : 'Tes Karakteristik Pribadi'}
            </h3>
          </div>
          ${bycat[cat].map(item => `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:16px;cursor:pointer" onclick="startTopic('${item.key}')">
              <div style="flex:1">
                <div style="font-size:14px;font-weight:600;margin-bottom:4px">${titleCase(item.key)}</div>
                ${item.score !== null ? `
                  <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" style="width:${item.score}%;background:${cat==='TWK'?'var(--twk)':cat==='TIU'?'var(--tiu)':'var(--tkp)'}"></div></div>
                ` : '<div style="font-size:12px;color:var(--text2)">Belum dikerjakan</div>'}
              </div>
              ${item.score !== null ? `
                <div style="text-align:right">
                  <div style="font-size:22px;font-weight:800;font-family:Fira Mono,monospace;color:${item.score>=80?'var(--correct)':item.score>=60?'var(--accent)':'var(--wrong)'}">${item.score}%</div>
                  <div style="font-size:11px;color:var(--text2)">${item.date}</div>
                </div>
              ` : '<span style="font-size:12px;color:var(--text2)">Mulai →</span>'}
            </div>
          `).join('')}
        </div>
      `).join('')}
      
      ${done > 0 ? `<button class="btn btn-secondary" onclick="if(confirm('Reset semua progress?')){localStorage.removeItem('cpns_progress');state.progress={};renderProgress(document.getElementById('content'))}">🗑️ Reset Progress</button>` : ''}
    </div>
  `;
}

// ===== SIDEBAR =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ===== START =====
init();
</script>
