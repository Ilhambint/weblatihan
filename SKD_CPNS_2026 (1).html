<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKD CPNS 2026 — Latihan Soal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #58a6ff;
  --twk: #f97316;
  --tiu: #3b82f6;
  --tkp: #22c55e;
  --correct: #22c55e;
  --wrong: #ef4444;
  --accent: #f97316;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== LAYOUT ===== */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
  transition: transform .3s;
}
#main {
  margin-left: 280px;
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== SIDEBAR ===== */
.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
  line-height: 1.2;
}
.logo span { color: var(--text2); font-weight: 500; font-size: 13px; display: block; margin-top: 2px; }
.sidebar-nav { padding: 12px 12px; flex: 1; }
.nav-group { margin-bottom: 16px; }
.nav-group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text2);
  padding: 0 8px;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text2);
  transition: all .15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(249,115,22,.12); color: var(--accent); }
.nav-badge {
  margin-left: auto;
  background: var(--surface2);
  color: var(--text2);
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 20px;
  font-family: 'Fira Mono', monospace;
}
.cat-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cat-dot.TWK { background: var(--twk); }
.cat-dot.TIU { background: var(--tiu); }
.cat-dot.TKP { background: var(--tkp); }

/* ===== TOPBAR ===== */
#topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
#topbar h1 { font-size: 16px; font-weight: 700; flex: 1; }
.mode-tabs {
  display: flex;
  background: var(--surface2);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.mode-tab {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text2);
  transition: all .15s;
  border: none;
  background: none;
}
.mode-tab.active {
  background: var(--accent);
  color: #fff;
}

/* ===== CONTENT ===== */
#content { flex: 1; padding: 32px; max-width: 900px; width: 100%; margin: 0 auto; }

/* ===== HOME ===== */
.home-hero {
  margin-bottom: 36px;
  padding: 40px;
  background: linear-gradient(135deg, #1a2332 0%, #161b22 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(249,115,22,.15) 0%, transparent 70%);
  border-radius: 50%;
}
.home-hero h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.home-hero p { color: var(--text2); font-size: 15px; }
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.stat-card .num {
  font-size: 32px;
  font-weight: 800;
  font-family: 'Fira Mono', monospace;
  color: var(--accent);
}
.stat-card .lbl { font-size: 12px; color: var(--text2); margin-top: 4px; }
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.topic-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.topic-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.topic-card.TWK::before { background: var(--twk); }
.topic-card.TIU::before { background: var(--tiu); }
.topic-card.TKP::before { background: var(--tkp); }
.topic-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.topic-card .t-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
  opacity: .7;
}
.topic-card.TWK .t-label { color: var(--twk); }
.topic-card.TIU .t-label { color: var(--tiu); }
.topic-card.TKP .t-label { color: var(--tkp); }
.topic-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
.topic-card .t-meta { display: flex; align-items: center; justify-content: space-between; }
.topic-card .t-count { font-size: 12px; color: var(--text2); }
.progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.progress-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.TWK .progress-fill { background: var(--twk); }
.TIU .progress-fill { background: var(--tiu); }
.TKP .progress-fill { background: var(--tkp); }

/* ===== QUIZ ===== */
.quiz-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.quiz-header h2 { font-size: 20px; font-weight: 800; flex: 1; }
.btn-back {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: all .15s;
}
.btn-back:hover { color: var(--text); border-color: var(--text2); }

.q-progress {
  font-size: 12px;
  font-family: 'Fira Mono', monospace;
  color: var(--text2);
  padding: 8px 14px;
  background: var(--surface2);
  border-radius: 20px;
}

.quiz-progress-bar {
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  margin-bottom: 28px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .3s ease;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 20px;
}
.q-num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.q-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 24px 0;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
  font-size: 14px;
  line-height: 1.5;
}
.choice:hover:not(.locked) { border-color: var(--accent); background: rgba(249,115,22,.06); }
.choice.selected:not(.revealed) { border-color: var(--accent); background: rgba(249,115,22,.1); }
.choice.correct { border-color: var(--correct); background: rgba(34,197,94,.1); }
.choice.wrong { border-color: var(--wrong); background: rgba(239,68,68,.1); }
.choice-key {
  font-family: 'Fira Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  min-width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  background: var(--border);
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 1px;
}
.choice.selected .choice-key { background: var(--accent); color: #fff; }
.choice.correct .choice-key { background: var(--correct); color: #fff; }
.choice.wrong .choice-key { background: var(--wrong); color: #fff; }

.pembahasan {
  background: rgba(22,27,34,1);
  border: 1px solid var(--border);
  border-left: 3px solid var(--correct);
  border-radius: 10px;
  padding: 20px;
  margin-top: 20px;
  display: none;
  animation: fadeIn .3s ease;
}
.pembahasan.show { display: block; }
.pembahasan .pem-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--correct);
  margin-bottom: 10px;
}
.pembahasan .pem-text { font-size: 13.5px; line-height: 1.7; color: var(--text2); }

.quiz-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn {
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: all .15s;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #ea6c10; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--text2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== RESULTS ===== */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  margin-bottom: 24px;
}
.result-score {
  font-size: 72px;
  font-weight: 800;
  font-family: 'Fira Mono', monospace;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
}
.result-label { font-size: 16px; color: var(--text2); margin-bottom: 24px; }
.result-meta {
  display: flex;
  justify-content: center;
  gap: 32px;
  font-size: 14px;
  color: var(--text2);
}
.result-meta strong { color: var(--text); display: block; font-size: 22px; font-family: 'Fira Mono', monospace; }

.result-breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.rb-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13.5px;
}
.rb-num { font-family: 'Fira Mono', monospace; font-size: 22px; font-weight: 700; }
.rb-num.correct-num { color: var(--correct); }
.rb-num.wrong-num { color: var(--wrong); }

/* ===== AI TUTOR ===== */
.ai-chat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 180px);
  min-height: 500px;
}
.ai-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.ai-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), #f59e0b);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.ai-header-text h3 { font-size: 15px; font-weight: 700; }
.ai-header-text p { font-size: 12px; color: var(--correct); }
.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg {
  max-width: 80%;
  line-height: 1.6;
  font-size: 14px;
  animation: fadeIn .2s ease;
}
.msg.user {
  align-self: flex-end;
  background: rgba(249,115,22,.15);
  border: 1px solid rgba(249,115,22,.3);
  border-radius: 12px 12px 2px 12px;
  padding: 12px 16px;
}
.msg.ai {
  align-self: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 2px 12px 12px 12px;
  padding: 12px 16px;
  color: var(--text);
}
.msg.ai .ai-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: .5px;
}
.typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: bounce .8s infinite; }
.dot:nth-child(2) { animation-delay: .15s; }
.dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

.ai-input-row {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}
.ai-input {
  flex: 1;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  outline: none;
  transition: border-color .15s;
  resize: none;
  height: 44px;
  max-height: 120px;
}
.ai-input:focus { border-color: var(--accent); }
.btn-send {
  width: 44px; height: 44px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.btn-send:hover { background: #ea6c10; }
.btn-send:disabled { opacity: .4; cursor: not-allowed; }

.quick-ask {
  padding: 0 24px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.quick-chip {
  padding: 6px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text2);
  transition: all .15s;
}
.quick-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ===== SIMULASI ===== */
.sim-config {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 24px;
}
.sim-config h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.sim-config p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
.sim-options {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.sim-option {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
}
.sim-option:hover { border-color: var(--accent); }
.sim-option.selected { border-color: var(--accent); background: rgba(249,115,22,.08); }
.sim-option .s-icon { font-size: 28px; margin-bottom: 8px; }
.sim-option h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.sim-option p { font-size: 12px; color: var(--text2); margin-bottom: 0; }

.timer-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 24px;
}
.timer-icon { font-size: 18px; }
.timer-text { font-family: 'Fira Mono', monospace; font-size: 18px; font-weight: 700; }
.timer-text.warning { color: #ef4444; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.timer-label { font-size: 12px; color: var(--text2); margin-left: auto; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .sim-options { grid-template-columns: 1fr; }
  .result-breakdown { grid-template-columns: 1fr; }
  #content { padding: 20px 16px; }
}

.hamburger {
  display: none;
  padding: 8px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  font-size: 18px;
}
@media (max-width: 768px) { .hamburger { display: flex; align-items: center; justify-content: center; } }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 99;
}
.overlay.show { display: block; }

/* section cat badges */
.cat-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: .5px;
}
.cat-badge.TWK { background: rgba(249,115,22,.15); color: var(--twk); }
.cat-badge.TIU { background: rgba(59,130,246,.15); color: var(--tiu); }
.cat-badge.TKP { background: rgba(34,197,94,.15); color: var(--tkp); }
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="logo">SKD CPNS 2026<span>Latihan Soal Premium</span></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="nav-group">
        <div class="nav-group-label">Menu</div>
        <div class="nav-item active" onclick="showPage('home')" id="nav-home">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          Beranda
        </div>
        <div class="nav-item" onclick="showPage('simulasi')" id="nav-simulasi">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Simulasi Ujian
        </div>
        <div class="nav-item" onclick="showPage('ai')" id="nav-ai">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          AI Tutor
        </div>
        <div class="nav-item" onclick="showPage('progress')" id="nav-progress">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Progress
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">TWK — Wawasan Kebangsaan</div>
        <div id="nav-twk"></div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">TIU — Inteligensi Umum</div>
        <div id="nav-tiu"></div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">TKP — Karakteristik Pribadi</div>
        <div id="nav-tkp"></div>
      </div>
    </nav>
  </div>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <h1 id="topTitle">Beranda</h1>
      <div class="mode-tabs" id="modeTabs" style="display:none">
        <button class="mode-tab active" id="tab-latihan" onclick="setMode('latihan')">Latihan</button>
        <button class="mode-tab" id="tab-kilat" onclick="setMode('kilat')">Kilat</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
const SOAL_DATA = {"BELA NEGARA": {"category": "TWK", "title": "BELA NEGARA", "questions": [{"id": 1, "question": "Setelah berjuang keras dan melewati berbagai ujian, akhirnya Dani berhasil meraih satu langkah besar menuju pencapaian cita-citanya yang mulia. Sebagai seorang mahasiswa yang bersemangat dan berprestasi, Dani berhasil memperoleh beasiswa Fulbright yang sangat bergengsi untuk melanjutkan studi magisternya di Amerika Serikat. Rasa bangga dan haru pun bercampur aduk dalam diri Dani ketika dia menerima kabar tersebut.   Baginya, ini adalah bukti nyata bahwa kerja keras dan ketekunan selama ini tidak pernah sia-sia. Wujud bela negara yang dapat dilakukan Dani selama menempuh studi di Amerika Serikat adalah …", "choices": {"A": "Mencari kerja parttime untuk menambah uang saku", "B": "Memberikan sponsor kepada mahasiswa disana", "C": "Memperkenalkan kebudayaan Indonesia dan mengembangkan ilmu pengetahuan", "D": "Aktif memamerkan aktivitas sehari-harinya nielalui· media sosial", "E": "Mengesampingkan studi dan_ berfokus memncari pekerjaan dengan gaji tinggi"}, "correct": "C", "pembahasan": "Memperkenalkan kebudayaan Indonesia dan mengembangkan ilmu pengetahuan Bela Negara adalah sikap dan perllaku warga negara yang dijiwai oleh kecintaannya kepada Negara Kesatuan Republik Indonesia yang berdasarkan Pancasila dan Undang-Undang Dasar 1945 dalam menjalin kelangsungan hidup bangsa dan negara yang seutuhnya. Bela Negara adalah tekad, sikap dan perilaku warga negara yang dijiwai oleh kecintaannya kepada Negara Kesatuan Republik Indonesia yang berdasarkan Pancasila dan UUD 1945 dalam menjamin kelangsungan hidup bangsa dan negara. Wujud dari usaha Bela Negara adalah kesiapan dan kerelaan setiap warga negara untuk berkorban demi mempertahankan kemerdekaan dan kedaulatan negara, Kesatuan dan persatuan bangsa, Keutuhan wilayah dan yuridiksi nasional dan Nilai-nilai Pancasila dan UUD"}, {"id": 2, "question": "Negara menjamin kepada warga negara Indonesia untuk ikut serta bergabung dalam usaha pembelaan negara melalui berbagai upaya yang dilakukan oleh pemerintah. Partisipasi dalam pembelaan negara juga bisa dilakukan melalui berbagai program pemerintah yang menitikberatkan pada pembinaan kewaspadaan dan kesiapsiagaan dalam menghadapi berbagai ancaman baik dari dalam maupun dari luar negeri. Program- program ini dapat mencakup pelatihan keterampilan pertahanan sipil, partisipasi dalam upaya penanggulangan bencana alam, serta penggalangan masyarakat dalam mendukung kebijakan dan langkah-langkah pemerintah terkait pertahanan negara. Perwujudan tindakan tersebut pada era saat ini adalah …", "choices": {"A": "Menciptakan lagu bela negara", "B": "Mendaftarkan diri menjadi anggota TNI atau Polri", "C": "Peduli terhadap ideologi agar tetap terjaga keasliannya   D. Meningkatkan kemampuan dan keterampilan", "E": "Ikut serta dalam organisasi masyarakat manapun"}, "correct": "B", "pembahasan": "Mendaftarakan diri menjadi anggota TNI atau POLRI Upaya bela negara pada masa kini tercermin dalam semangat dan cita-cita generasi muda untuk berkontribusi secara aktif dalam pembelaan negara, salah satunya dengan menjadi anggota Tentara Nasional Indonesia (TNI) dan Kepolisian Republik Indonesia (POLRI). Semangat ini merupakan wujud nyata dari kesadaran akan pentingnya peran serta dalam menjaga kedaulatan, keamanan, dan keselamatan negara. Generasi muda yang memiliki tekad untuk bergabung dengan TNI dan POLRI merupakan manifestasi dari komitmen dalam melindungi bangsa dan negara dari berbagai ancaman baik dari dalam maupun luar negeri. Mereka siap untuk menjalani pelatihan dan mengabdikan diri demi menjaga stabilitas dan keutuhan bangsa. Di era digital seperti saat ini, upaya bela negara juga melibatkan partisipasi dalam menjaga keamanan siber dan informasi negara dari ancaman cybercrime dan disinformasi. Generasi muda berperan dalam menyebarkan informasi yang akurat dan positif, serta menjadi garda terdepan dalam melawan penyebaran hoaks dan konten negatif yang dapat merusak persatuan dan kesatuan bangsa. Dengan demikian, semangat bela negara pada masa kini tidak hanya terbatas pada menjadi anggota TNI dan POLRI, tetapi juga meliputi berbagai bentuk pengabdian dan kontribusi positif dalam berbagai aspek kehidupan masyarakat dan bangsa. Ini menunjukkan bahwa bela negara bukanlah tanggung jawab yang hanya dipikul oleh aparat keamanan semata, tetapi menjadi tanggung jawab bersama seluruh elemen masyarakat untuk menjaga kedaulatan dan keutuhan negara Indonesia."}, {"id": 3, "question": "Dina merupakan seorang yang sangat nasionalis dan bangga dengan produk-produk dalam negeri. Setiap kali ia berbelanja, Dina selalu memilih produk-produk buatan dalam negeri daripada produk impor. Baginya, mendukung produk lokal bukan hanya tentang menunjukkan patriotisme, tetapi juga tentang memberikan dukungan langsung kepada para produsen lokal. Dina yakin bahwa produk dalam negeri memiliki kualitas yang setara, bahkan kadang lebih baik daripada produk impor. Selain itu, Dina juga percaya bahwa menggunakan produk dalam negeri dapat membantu menggerakkan roda perekonomian. Cerita Dina di atas merupakan perwujudan upaya bela negara yang didasarkan pada …", "choices": {"A": "Rasa cinta tanah air", "B": "Tingkat perekonomian bangsa", "C": "Sikap bangsa yang berlebihan", "D": "Upaya peningkatan kualitas produk luar negeri", "E": "Upaya peningkatan kualitas produk dalam negeri"}, "correct": "A", "pembahasan": "Rasa cinta tanah air Rasa kebangsaan yang tercermin dalam dukungan terhadap produk-produk lokal memang merupakan salah satu bentuk nyata dari bela negara. Dengan memilih produk dari negara sendiri, kita secara tidak langsung turut serta dalam memajukan perekonomian domestik dan mendukung pertumbuhan industri dalam negeri. Hal ini sejalan dengan upaya untuk mencintai tanah   air melalui tindakan nyata, yaitu dengan memilih dan menggunakan produkproduk yang berasal dari dalam negeri. Selain itu, kesadaran berbangsa dan bernegara juga terwujud dalam dukungan terhadap produk lokal. Dengan memilih produk dari negara sendiri, kita menunjukkan kesetiaan dan kecintaan terhadap bangsa dan negara, serta menyadari pentingnya menjaga keberlangsungan ekonomi dan kesejahteraan masyarakat dalam negeri. Sesuai dengan unsur Bela negara yakni : - Cinta Tanah Air - Kesadaran berbangsa & bernegara - Yakin akan Pancasila sebagai ideologi negara. - Rela berkorban untuk bangsa & negara, dan - Memiliki kemampuan awal bela negara"}, {"id": 4, "question": "Bela negara adalah kewajiban setiap warga negara untuk melindungi, mempertahankan, dan mengisi kemerdekaan serta kedaulatan Negara Kesatuan Republik Indonesia. Ini berarti bahwa setiap individu memiliki tanggung jawab moral dan konstitusional untuk mencintai dan mempertahankan negaranya sesuai dengan nilai-nilai Pancasila dan UUD 1945. Melalui sikap dan perilaku yang dijiwai oleh kecintaan yang mendalam kepada Indonesia, warga negara dapat memastikan kelangsungan hidup bangsa dan negara secara menyeluruh. Upaya pemuda untuk melakukan bela negara dalam mengisi kemerdekaan yang dapat dilakukan di lingkungan masyarakat yaitu..", "choices": {"A": "Membantu tetangga yang membutuhkan bantuan", "B": "Aktif mendengarkan penjelasan dari guru kelas", "C": "Berziarah ke taman makam pahlawan", "D": "Aktif dalam kegiatan karang taruna", "E": "Menjadi petugas upacara"}, "correct": "D", "pembahasan": "Aktif dalam kegiatan karang taruna Upaya pemuda dalam bela negara dapat dilakukan dengan berpartisipasi aktif dalam kegiatan karang taruna, yang menawarkan beragam kegiatan positif untuk mengisi kemerdekaan. Beberapa kegiatan yang dapat dilakukan dalam karang taruna antara lain: • Pelatihan keterampilan dan wirausaha untuk meningkatkan kemampuan ekonomi generasi muda. • Program bakti sosial seperti penggalangan dana untuk korban bencana, kegiatan donor darah, atau kunjungan ke panti jompo. • Kampanye lingkungan untuk menggalakkan kesadaran akan pentingnya pelestarian lingkungan hidup. • Diskusi tentang isu-isu sosial dan kebangsaan yang relevan, untuk meningkatkan pemahaman dan kesadaran masyarakat. • Program pengembangan kepemimpinan dan pengelolaan organisasi untuk menumbuhkan pemimpin-pemimpin muda yang berkualitas. • Kegiatan seni dan budaya seperti pentas seni, pameran seni rupa, atau festival budaya, untuk mempromosikan dan melestarikan kekayaan budaya bangsa.   Melalui berbagai kegiatan tersebut, karang taruna menjadi wadah yang efektif untuk pembinaan dan pemberdayaan generasi muda dalam memperjuangkan serta mempertahankan kemerdekaan bangsa."}, {"id": 5, "question": "Selain rasa cinta terhadap bangsa, upaya bela negara juga harus didasarkan pada rasa kesetiaan yang mendalam terhadap tanah air dan lambang negara. Kesetiaan merupakan nilai yang mendasari loyalitas dan dedikasi seseorang dalam mengabdi kepada negara, serta menjunjung tinggi prinsipprinsip kebangsaan yang telah diwariskan oleh para pendahulu. Rasa kesetiaan merupakan pondasi yang kuat dalam upaya bela negara, karena melalui kesetiaan, setiap individu dapat memberikan kontribusi yang berarti bagi kemajuan dan kelangsungan negara, serta menjadi bagian dari perjalanan panjang dalam membangun bangsa yang maju dan sejahtera. Berikut ini bentuk kesetiaaan terhadap bangsa dan negara tampak pada …", "choices": {"A": "Mengikuti upacara kemerdekaan", "B": "Skeptis pada perubahan zaman agar budaya tidak tergerus", "C": "Membiarkan pengaruh asing yang mengancam ideologi", "D": "Mengembangkan budaya-budaya asing yang lebih baik", "E": "Lebih memilih kualitas produk luar negeri dibandingkan mencoba produk dalam negeri"}, "correct": "A", "pembahasan": "Mengikuti upacara kemerdekaan Dalam kegiatan upacara kemerdekaan, rasa cinta terhadap bangsa akan tumbuh dan terjaga karena merupakan momen yang memperingati kemenangan dan keberhasilan bangsa Indonesia dalam merebut dan mempertahankan kemerdekaan. Upacara tersebut membangkitkan semangat nasionalisme dan kebanggaan akan identitas sebagai bangsa yang merdeka. Upacara kemerdekaan juga membangun kesadaran akan pentingnya mempertahankan kemerdekaan agar negara tidak dijajah kembali. Dengan melibatkan berbagai lapisan masyarakat, termasuk generasi muda sebagai pewaris dan pengawal nilai-nilai kemerdekaan, upacara tersebut menyampaikan pesan bahwa tugas untuk mempertahankan kemerdekaan adalah tanggung jawab bersama setiap warga negara."}, {"id": 6, "question": "TNI memiliki peran strategis sebagai alat negara dalam bidang pertahanan. Tugas utamanya adalah menjaga kedaulatan, keutuhan wilayah, dan keselamatan bangsa dari ancaman militer maupun bersenjata, baik dari luar maupun dalam negeri. Untuk melaksanakan tugas ini, pemerintah menugaskan pasukan TNI untuk berjaga di perbatasan negara dan melakukan patroli di wilayah perbatasan, sehingga memastikan keamanan dan ketertiban di sekitar wilayah Republik Indonesia. Kegiatan tersebut merupakan bagian dari upaya …", "choices": {"A": "Menjaga ketertiban dunia internasional", "B": "Mengayomi masyarakat sekitar", "C": "Menciptakan ketertiban nasional", "D": "Menjaga keutuhan negara Indonesia", "E": "Melaksanakan tugas yang diberikan pimpinan"}, "correct": "D", "pembahasan": "Menjaga keutuhan negara Indonesia Salah satu upaya pemerintah dalam menjaga perbatasan wilayah Republik Indonesia adalah dengan meningkatkan kehadiran personel TNI di wilayah   perbatasan, baik itu perbatasan laut maupun darat. Langkah ini bertujuan untuk mengamankan wilayah Indonesia dari berbagai ancaman seperti penyelundupan barang ilegal, pergerakan kelompok bersenjata, dan penangkapan pelaku kejahatan lintas negara. Selain itu, peningkatan kehadiran personel TNI di perbatasan juga memperkuat kontrol terhadap masuknya orang asing yang tidak diinginkan ke wilayah Indonesia serta melindungi sumber daya alam yang ada di sekitar perbatasan. Dengan demikian, upaya ini tidak hanya menyangkut keutuhan wilayah, tetapi juga melindungi kedaulatan dan kepentingan nasional secara menyeluruh."}, {"id": 7, "question": "Bela negara tidak hanya dllakukan dengan mengangkat senjata tapi juga bisa dilakukan dengan hal lainnya. Upaya negara dalam melindungi warga negara dari pencegahan peredaran makanan kadaluarsa merupakan bagian dari tanggung jawab negara dalam hal perlindungan kesehatan masyarakat. Hal ini termasuk dalam upaya pemerintah untuk memastikan keselamatan dan kesejahteraan warga negara, serta menjaga hak-hak kesehatan dan keamanan konsumen. Dengan mencegah peredaran makanan kadaluarsa, negara berperan dalam menjaga kesehatan dan keamanan masyarakat dari risiko keracunan dan dampak negatif lainnya yang dapat timbul akibat konsumsi makanan yang tidak layak. Upaya tersebut merupakan tugas dan tanggung jawab negara dalam hal...", "choices": {"A": "Mensejahterakan seluruh rakyat lndonesia", "B": "Memenuhi kebutuhan hldup sehari-hari", "C": "Menjaga agar bahan pokok tetap stabil", "D": "Membela dan melindungi warga negara", "E": "M·enjamin ketersediaan kebutuhan pangan"}, "correct": "D", "pembahasan": "Membela dan melindungi warga negara Selain menjaga keamanan dan stabilitas negara dari kemungkinan serangan dari luar serta mencegah pemberontakan, pemerintah juga bertanggung jawab untuk melindungi dan membela warga negara dari berbagai ancaman. Upaya tersebut tidak hanya terbatas pada bidang keamanan, tetapi juga mencakup aspek sosial, ekonomi, kesehatan, dan kesejahteraan. Pemerintah dapat melakukan hal ini dengan memberikan akses terhadap layanan kesehatan yang berkualitas, pendidikan yang merata, perlindungan hukum, serta menciptakan lapangan kerja yang mencukupi. Dengan demikian, pemerintah memastikan bahwa warga negara merasa aman, dilindungi, dan didukung dalam berbagai aspek kehidupan mereka."}, {"id": 8, "question": "Bela negara adalah sikap dan perilaku warga negara yang dijiwai oleh kecintaannya kepada Negara Kesatuan Republik Indonesia (NKRI) berdasarkan Pancasila dan Undang-Undang Dasar 1945 dalam menjamln kelangsungan hidup bangsa dan negara yang seutuhnya. Kesadaran bela negara itu hakikatnya kesediaan berbakti pada negara dan kesediaan berkorban membela negara. Dengan melaksanakan kewajiban bela negara, menjadi bukti dan proses bagi seluruh warga negara untuk menunjukkan kesediaan mereka dalam berbakti pada nusa dan bangsa. Berdasarkan Pasal 30 ayat (1) Undang-Undang No. 3 Tahun 2002 tentang Pertahanan Negara, \"Setiap warga negara berhak dan wajib ikut serta dalam upaya bela negara yang diwujudkan dalam penyelenggaraan   pertahanan negara\". Makna kata kewajiban dalam ketentuan tersebut adalah ...", "choices": {"A": "Bila diwajibkan setiap warga negara ikut dalam pembelaan negara", "B": "Setiap warga negara harus mengikuti wajib militer", "C": "Negara dapat memaksa setiap warga negara untuk ikut serta dalam pembelaan negara dalam keadaan tertentu", "D": "Setiap warga negara memiliki kesempatan menentukan untuk ikut atau tidak dalam upaya pembelaan negara", "E": "Hanya warga negara yang dipersyaratkan wajib ikut dalam pembelaan negara"}, "correct": "C", "pembahasan": "Negara dapat memaksa setiap warga negara untuk ikut serta dalam pembelaan negara dalam keadaan tertentu Pasal 30 ayat (1) dalam Undang-Undang Dasar Negara Republik Indonesia menegaskan bahwa setiap warga negara memiliki hak dan kewajiban terkait dengan pertahanan dan keamanan negara. Hak tersebut mencakup hak untuk mendapatkan perlindungan dan keamanan yang disediakan oleh negara. Namun, di sisi lain, pasal ini juga menegaskan adanya kewajiban bagi setiap warga negara untuk ikut serta dalam usaha pertahanan dan keamanan negara. Dalam konteks ini, hak untuk mendapatkan perlindungan dari negara menunjukkan bahwa setiap warga negara memiliki hak untuk merasa aman dan dilindungi oleh negara dari segala ancaman dan bahaya yang mungkin terjadi. Di sisi lain, kewajiban untuk ikut serta dalam usaha pertahanan dan keamanan negara menunjukkan bahwa tanggung jawab menjaga keamanan negara bukan hanya menjadi urusan pemerintah atau aparat keamanan semata, tetapi juga menjadi tanggung jawab bersama seluruh warga negara. Dengan demikian, pasal ini mencerminkan prinsip bahwa keamanan dan pertahanan negara adalah tanggung jawab bersama yang harus diemban oleh seluruh warga negara. Hal ini menegaskan pentingnya partisipasi aktif dan kesadaran kolektif dalam menjaga kedaulatan, keutuhan wilayah, dan keamanan negara sebagai landasan bagi eksistensi dan kelangsungan hidup bangsa Indonesia."}, {"id": 9, "question": "Penyebaran hoaks yang marak di dunia maya menjadi ancaman serius bagi keamanan negara. Salah satu faktor penyebabnya adalah rendahnya budaya membaca di masyarakat Indonesia. Oleh karena itu, pemerintah melalui Kementerian Pertahanan (Kemhan) berupaya untuk meningkatkan kesadaran dan kewaspadaan masyarakat dengan mencetak 100 juta kader bela negara. Langkah ini bertujuan untuk menangkal ancaman terhadap negara, terutama melalui penyebaran paham radikal dan berita bohong (hoaks) yang tersebar melalui internet. Penting bagi pemerintah untuk segera mengambil langkah konkret guna mengatasi masalah tersebut demi menjaga stabilitas dan keamanan negara. Salah satunya dengan langkah bela negara non fisik seperti …", "choices": {"A": "Mewajibkan para generasi muda mengikuti pendidikan militer", "B": "Meningkatkan kembali kesadaran berbangsa dan bernegara", "C": "Mengajak masyarakat berlatih bela diri", "D": "Mengajarkan generasi muda untuk berani berdemonstrasi", "E": "Membekali aparat negara dengan senjata terbaru"}, "correct": "B", "pembahasan": "Meningkatkan kembali kesadaran berbangsa dan bernegara Bela Negara merupakan sikap dan perilaku yang tercermin dari cinta yang mendalam terhadap Negara Kesatuan Republik Indonesia, yang berlandaskan nilai-nilai Pancasila dan Undang-Undang Dasar"}, {"id": 10, "question": "Dalam era yang terus berkembang dan kompleks seperti sekarang ini, konsep bela negara telah melampaui batas-batas tradisionalnya yang terkait dengan pertahanan dan keamanan. Meskipun tetap menjadi aspek penting, bela negara juga mencakup partisipasi aktif dalam pembangunan ekonomi, sosial, dan budaya. Misalnya, selain menjaga kedaulatan wilayah dari ancaman luar, bela negara juga mencakup upaya untuk meningkatkan daya saing ekonomi nasional, melalui inovasi, kewirausahaan, dan investasi dalam sumber daya manusia. Salah satu contoh wujud bela negara dalam konteks ekonomi adalah …", "choices": {"A": "Membeli kualitas terbaik produk luar negeri", "B": "Menambah defisit perdagangan", "C": "Peningkatan importasi barang luar", "D": "Pengurangan kekuatan struktur industri", "E": "Menggunakan produk dalam negeri."}, "correct": "E", "pembahasan": "Menggunakan produk dalam negeri. Dalam konteks ekonomi, bela negara melibatkan dukungan terhadap produk dalam negeri untuk meningkatkan kemandirian ekonomi dan mengurangi ketergantungan terhadap produk impor. Salah satu langkah strategisnya adalah melalui program Peningkatan Penggunaan Produk Dalam Negeri (P3DN). Program ini bertujuan untuk meningkatkan permintaan terhadap produk lokal, yang pada gilirannya akan menurunkan impor, memperkuat struktur industri dalam negeri, dan mengurangi defisit perdagangan. Dengan demikian, partisipasi dalam P3DN merupakan bagian dari upaya nyata dalam mendukung pertumbuhan ekonomi domestik dan mendorong roda ekonomi masyarakat."}]}, "IMPLEMENTASI PANCASILA": {"category": "TWK", "title": "IMPLEMENTASI PANCASILA", "questions": [{"id": 1, "question": "Setiap tahun, sering terjadi kebakaran hutan dan lahan di berbagai wilayah Indonesia, yang mengakibatkan kabut asap. Presiden Jokowi telah memerintahkan menteri terkait untuk mengambil tindakan penanggulangan dan pencegahan agar kejadian serupa tidak terulang di masa depan. Kebakaran ini mengganggu kehidupan sehari-hari masyarakat, menyebabkan penutupan sekolah di beberapa tempat, penundaan penerbangan, dan dampak negatif lainnya. Setelah diselidiki, banyak kebakaran yang disebabkan oleh ulah manusia, terutama perusahaan sawit yang ingin memperluas bisnis mereka dengan cara yang cepat. Tindakan ini bertentangan dengan nilai-nilai Pancasila, khususnya sila ke …", "choices": {"A": "Sila pertama", "B": "Sila kedua", "C": "Sila ketiga", "D": "Sila keempat", "E": "Sila Kelima"}, "correct": "E", "pembahasan": "Sila Kelima Tindakan perusahaan-perusahaan sawit yang sengaja menyebabkan kebakaran hutan untuk memperluas bisnis mereka bertentangan dengan nilai-nilai Pancasila, khususnya sila kelima. Sila kelima Pancasila menekankan pentingnya tidak menggunakan hak milik untuk kepentingan pribadi yang merugikan kepentingan umum. Dalam konteks ini, tindakan perusahaan sawit tersebut jelas melanggar prinsip tersebut karena kebakaran yang mereka timbulkan mengganggu kehidupan sehari-hari masyarakat, termasuk penutupan sekolah, penundaan penerbangan, dan dampak negatif lainnya bagi kehidupan sosial dan ekonomi masyarakat. Selain itu, tindakan ini juga bertentangan dengan nilai-nilai keberlanjutan dan keadilan sosial yang dianut oleh Pancasila. Pembakaran hutan oleh perusahaan sawit menyebabkan kerusakan lingkungan yang serius, termasuk hilangnya habitat satwa liar, terancamnya keberlangsungan hidup masyarakat adat, serta terganggunya sumber air dan udara yang bersih. Hal ini tidak hanya merugikan masyarakat saat ini, tetapi juga generasi mendatang. Dengan demikian, tindakan tersebut tidak hanya melanggar prinsip Pancasila, tetapi juga mencerminkan ketidakpedulian terhadap keberlanjutan lingkungan dan kesejahteraan masyarakat secara keseluruhan."}, {"id": 2, "question": "Setiap lima tahun sekali, Indonesia mengadakan Pemilihan Umum (Pemilu) sebagai bagian penting dari proses demokrasi. Pemilu ini dijalankan sesuai dengan prinsip-prinsip yang telah diamanatkan, seperti asas langsung, umum, bebas, rahasia, jujur, dan adil. Melalui pelaksanaan Pemilu, negara menghormati hak warga negara untuk berpartisipasi secara aktif dalam   menentukan pemerintahan mereka. Ini merupakan salah satu bentuk konkrit dari pengamalan nilai-nilai Pancasila, terutama sila ke ….", "choices": {"A": "Sila pertama", "B": "Sila kedua", "C": "Sila ketiga", "D": "Sila keempat", "E": "Sila Kelima"}, "correct": "D", "pembahasan": "Sila Keempat Pada sila keempat Pancasila, kita diajarkan untuk memberikan prioritas pada musyawarah dalam proses pengambilan keputusan demi kepentingan bersama. Dalam konteks ini, musyawarah menjadi prinsip yang sangat penting dalam menjalankan pemerintahan yang demokratis dan berkeadilan. Musyawarah memungkinkan semua pihak untuk terlibat dalam pembahasan dan pengambilan keputusan, sehingga setiap keputusan yang dihasilkan dapat mencerminkan aspirasi dan kepentingan bersama. Salah satu implementasi konkret dari prinsip musyawarah ini adalah dalam proses Pemilu. Pemilu merupakan mekanisme demokratis di mana rakyat berpartisipasi secara langsung dalam menentukan siapa yang akan mewakili mereka di parlemen atau lembaga legislatif lainnya. Melalui hak pilihnya, setiap warga negara memiliki kesempatan untuk menyatakan preferensi politik mereka dan memilih pemimpin yang dianggap dapat mewakili dan mengadvokasi kepentingan mereka secara efektif. Dalam konteks Pemilu, proses pemungutan suara menjadi representasi nyata dari semangat musyawarah. Melalui proses ini, setiap suara dihitung dan setiap pendapat dihargai, sehingga hasilnya mencerminkan kehendak kolektif dari seluruh rakyat. Dengan demikian, Pemilu menjadi wujud konkret dari semangat musyawarah untuk mencapai kesepakatan yang mewakili kehendak rakyat secara kolektif, serta menegaskan komitmen Indonesia terhadap prinsip-prinsip demokrasi dan keadilan."}, {"id": 3, "question": "Setiap individu, tanpa memandang jabatan atau posisi sosialnya, memiliki nilai dan martabat yang sama dalam sila kemanusiaan yang adil dan beradab. Hal ini berarti bahwa setiap orang memiliki hak yang sama untuk dihormati dan diperlakukan secara adil, serta memiliki kewajiban yang sama terhadap masyarakat dan negara. Dalam sila ini, penting untuk tidak kehilangan identitas dan nilai-nilai budaya kita sendiri ketika berinteraksi dengan orang lain atau ketika kita terpengaruh oleh budaya asing. Kita harus tetap mengingat dan menjaga jati diri kita sendiri, serta menghargai keberagaman budaya tanpa melupakan akar dan identitas kita sebagai individu. Kalimat diatas merupakan bentuk penjabaran Pancasila pada...", "choices": {"A": "Sila pertama", "B": "Sila Kelima", "C": "Sila ketiga", "D": "Sila keempat", "E": "Sila kedua"}, "correct": "E", "pembahasan": "Sila Kedua Nilai-nilai dari Pancasila memiliki makna yang penting:"}, {"id": 4, "question": "Republik Indonesia adalah sebuah negara berdaulat yang berdiri di dunia ini. Seperti halnya negara-negara lain yang merdeka, Indonesia menempati posisi yang sama di mata internasional. Oleh karena itu, Indonesia menjunjung tinggi sikap saling menghormati dan bekerjasama dengan negara-negara lain dalam berbagai aspek hubungan internasional. Sikap tersebut merupakan penjabaran dari Pancasila pada...", "choices": {"A": "Sila pertama", "B": "Sila ketiga", "C": "Sila kedua", "D": "Sila keempat", "E": "Sila Kelima"}, "correct": "C", "pembahasan": "Sila Kedua Dalam implementasi sikap bahwa Bangsa Indonesia merasa sebagai bagian dari seluruh umat manusia, kita mengakui bahwa Negara Kesatuan Republik Indonesia adalah salah satu negara yang memiliki kedaulatan penuh di dunia ini. Pernyataan ini merupakan refleksi dari nilai-nilai yang terkandung dalam sila kedua Pancasila, yang menegaskan pentingnya mengembangkan sikap saling menghormati dan bekerja sama dengan bangsa-bangsa lain di dunia. Dengan memahami bahwa Indonesia merupakan bagian dari seluruh umat manusia, kita diingatkan akan tanggung jawab kita untuk memelihara perdamaian, keadilan, dan kerjasama global. Sebagai negara yang merdeka dan berdaulat, Indonesia memiliki peran yang signifikan dalam mewujudkan tujuan-tujuan ini di tingkat internasional. Keterlibatan aktif Indonesia dalam berbagai forum internasional dan organisasi regional adalah bentuk nyata   dari komitmen untuk berkontribusi dalam memecahkan tantangan global dan mempromosikan perdamaian serta keberlanjutan. Selain itu, sikap saling menghormati dan bekerja sama dengan bangsabangsa lain juga mencerminkan semangat diplomasi Indonesia yang inklusif dan berkeadilan. Dalam hubungan internasional, Indonesia selalu mengadvokasi prinsip-prinsip demokrasi, hak asasi manusia, dan penyelesaian damai konflik. Dengan demikian, Indonesia tidak hanya menjaga kepentingan nasionalnya, tetapi juga berperan sebagai agen perubahan positif dalam mewujudkan kesejahteraan dan keadilan global."}, {"id": 5, "question": "Rani mengalami keterlambatan dalam menyelesaikan kuliahnya karena dia harus bekerja untuk membantu memenuhi kebutuhan ekonomi keluarganya. Setelah bekerja paruh waktu selama dua tahun di beberapa tempat, sekarang dia telah diterima bekerja di sebuah perusahaan. Meskipun menghadapi beban kerja yang berat, Rani tidak pernah mengeluh kepada rekan-rekan atau anggota keluarganya. Dia merasa mampu menyelesaikan tugasnya dengan baik demi memenuhi kebutuhan hidupnya. Sikap Rani ini mencerminkan nilai-nilai dari Pancasila sila ke...", "choices": {"A": "Ketuhanan Yang Maha Esa", "B": "Kemanusiaan Yang Adil dan Beradab", "C": "Persatuan Indonesia", "D": "Kerakyatan Yang Dipimpin oleh Hikmah Kebijaksanaan dalam Permusyawaratan/ Perwakilan", "E": "Keadilan Sosial Bagi Seluruh Rakyat Indonesia"}, "correct": "E", "pembahasan": "Keadilan Sosial Bagi Seluruh Rakyat Indonesia Terkait dengan soal tersebut yang dilakukan Rani merupakan pengamalan pancasila pada sila kelima karena ia bekerja keras tanpa mengeluh untuk perusahaannya demi bisa membiayai hidupnya. Pengamalan tersebut sesuai dengan butir pancasila yakni Suka bekerja keras. Berikut butir Pancasila pada sila kelima: - Mengembangkan perbuatan yang luhur, yang mencerminkan sikap dan suasana kekeluargaan dan kegotongroyongan. - Mengembangkan sikap adil terhadap sesama. - Menjaga keseimbangan antara hak dan kewajiban. - Menghormati hak orang lain. - Suka memberi pertolongan kepada orang lain agar dapat berdiri sendiri. - Tidak menggunakan hak milik untuk usaha-usaha yang bersifat pemerasan terhadap orang lain. - Tidak menggunakan hak milik untuk hal-hal yang bersifat pemborosan dan gaya hidup mewah. - Tidak menggunakan hak milik untuk bertentangan dengan atau merugikan kepentingan umum. - Suka bekerja keras. - Suka menghargai hasil karya orang lain yang bermanfaat bagi kemajuan dan kesejahteraan bersama. - Suka melakukan kegiatan dalam rangka mewujudkan kemajuan yang merata dan berkeadilan sosial."}, {"id": 6, "question": "Setiap hari, Ani membantu ibunya di rumah dengan melakukan berbagai tugas, mulai dari membersihkan rumah, melakukan kebersihan, hingga   membantu ibunya dalam belanja ke pasar. Ani terkenal sebagai anak yang baik dan ramah terhadap semua orang, baik kepada orang tuanya, temantemannya, maupun para guru di sekolahnya. Sifat baik Ani ini tergambar dari kecenderungannya untuk selalu menolong orang lain, yang membuatnya dihormati dan disukai oleh banyak orang di sekitarnya.", "choices": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "correct": "B", "pembahasan": "2 Yang dilakukan adit suka menolong orang lain hal itu merujuk pada nilai kemanusiaan sesuai dengan butir pancasila yakni mengembangkan sikap tenggang rasa. Berikut butir Pancasila pada sila kedua. - Mengakui dan memperlakukan manusia sesuai dengan harkat dan martabatnya sebagai makhluk Tuhan Yang Maha Esa. - Mengakui persamaan derajat, persamaan hak, dan kewajiban asasi setiap manusia, tanpa membeda-bedakan suku, keturunan, agama, kepercayaan, jenis kelamin, kedudukan sosial, warna kulit dan sebagainya. - Mengembangkan sikap saling mencintai sesama manusia. - Mengembangkan sikap saling tenggang rasa dan tepa selira. - Mengembangkan sikap tidak semena-mena terhadap orang lain. - Menjunjung tinggi nilai-nilai kemanusiaan. - Gemar melakukan kegiatan kemanusiaan. - Berani membela kebenaran dan keadilan. - Bangsa Indonesia merasa dirinya sebagai bagian dari seluruh umat manusia. - Mengembangkan sikap hormat menghormati dan bekerja sama dengan bangsa lain.   PILAR NKRI PANCASILA Arti dan Pengertian Ideologi Secara sederhana, ideologi adalah sistem gagasan, keyakinan, dan nilai-nilai yang membentuk cara pandang seseorang atau kelompok tentang dunia dan masyarakat. Ini adalah kerangka berpikir yang memandu tindakan, keputusan, dan tujuan hidup. Ideologi memberikan arahan tentang bagaimana seharusnya masyarakat diorganisir, bagaimana kekuasaan didistribusikan, dan apa yang dianggap benar atau salah. Asal Kata Ideologi Kata \"ideologi\" berasal dari bahasa Yunani: \"Idea\" yang berarti gagasan, konsep, atau cita-cita. \"Logos\" yang berarti ilmu atau studi. Jadi, secara etimologis, ideologi berarti ilmu tentang gagasan atau ilmu tentang ide. Istilah ini pertama kali diperkenalkan oleh seorang filsuf Prancis bernama Destutt de Tracy pada akhir abad ke-"}]}, "PILAR NKRI": {"category": "TWK", "title": "PILAR NKRI", "questions": [{"id": 1, "question": "Sehari setelah Proklamasi Kemerdekaan Indonesia pada tanggal 17 Agustus 1945, langkah-langkah penting diambil untuk mengonsolidasikan kemerdekaan baru yang dideklarasikan. Pada tanggal 18 Agustus 1945, Panitia Persiapan Kemerdekaan Indonesia (PPKI) menggelar pertemuan pentingnya. Tujuan utama pertemuan ini adalah untuk menegaskan dan mengukuhkan posisi Indonesia sebagai bangsa merdeka. Dalam sidang tersebut, para pemimpin nasional membahas dan merumuskan langkahlangkah yang diperlukan untuk memperjuangkan kemerdekaan yang telah diumumkan sehari sebelumnya. Keputusan dan kebijakan yang diambil dalam sidang tersebut menjadi tonggak penting dalam sejarah kemerdekaan Indonesia, menandai transisi penting dari status bangsa yang terjajah menuju bangsa yang merdeka. Putusan – putusan yang dihasilkan mencakup hal – hal berikut ini kecuali …", "choices": {"A": "Mengesahkan Undang-Undang Dasar Negara (UUD 1945) yang terdiri atas Pembukaan dan Batang Tubuh", "B": "Memilih Presiden dan Wakil Presiden yang pertama (Soekarno dan Hatta).", "C": "Membentuk Komite Nasional Indonesia Pusat (KNIP) yang anggota intinya adalah mantan anggota PPKI ditambah tokoh-tokoh masyarakat dari banyak golongan", "D": "Mengesahkan Pancasila sebagai way of life bangsa Indonesia", "E": "Mengesahkan dasar Negara Pancasila yang dalam sila pertama Pancasila telah dihapuskan tujuh kata"}, "correct": "D", "pembahasan": "Mengesahkan Pancasila sebagai way of life bangsa Indonesia Hasil perumusan PPKI pada tanggal 18 Agustus 1945 adalah tonggak sejarah yang menandai langkah awal dalam pembangunan negara Indonesia yang merdeka. Beberapa keputusan penting diambil untuk mengonsolidasikan kemerdekaan baru yang telah diumumkan pada tanggal 17 Agustus"}, {"id": 3, "question": "Sebelum kemerdekaan Indonesia, para pendiri bangsa Indonesia merumuskan landasan yang menjadi dasar negara, yang kemudian dikenal sebagai Pancasila. Ada tiga tokoh pendiri bangsa yang berperan dalam menyampaikan pandangan mereka tentang dasar negara pada masa itu. Ketiga tokoh tersebut adalah Soekarno, Muhammad Yamin, dan Mr Soepomo. Mereka berkontribusi secara signifikan dalam pembentukan ideide dasar negara yang menggambarkan visi Indonesia sebagai negara merdeka dan berdaulat. Melalui serangkaian sidang dan perdebatan, Pancasila akhirnya dirumuskan sebagai dasar negara yang menggabungkan nilai-nilai keadilan sosial, demokrasi, kemanusiaan, persatuan, dan ketuhanan. Salah satu usulan dasar negara saat siding BPUPKI oleh Mr Soepomo pada tanggal 31 Mei 1945 adalah …", "choices": {"A": "Kebangsaan Indonesia", "B": "Keadilan Rakyat", "C": "Peri Kebangsaan", "D": "Peri Ketuhanan", "E": "Internasionalisme dan Kemanusiaan"}, "correct": "B", "pembahasan": "Keadilan Rakyat Usulan dasar negara yang disampaikan oleh Dr. Supomo pada sidang pertama BPUPKI tanggal 31 Mei 1945 mencakup lima prinsip utama. Pertama, persatuan, yang menggarisbawahi pentingnya kesatuan dalam keberagaman untuk mencapai tujuan bersama. Kedua, kekeluargaan, yang menekankan pentingnya sikap saling mendukung dan peduli di antara seluruh anggota masyarakat. Ketiga, keseimbangan lahir batin, yang merujuk pada pentingnya keseimbangan antara aspek fisik dan spiritual dalam kehidupan bermasyarakat. Keempat, musyawarah, yang menekankan pentingnya berdiskusi dan berunding untuk mencapai kesepakatan yang adil dan demokratis. Kelima, keadilan rakyat, yang menegaskan perlunya keadilan sosial bagi seluruh rakyat Indonesia tanpa kecuali. Dengan demikian, usulan Dr. Supomo mencerminkan upaya untuk membentuk landasan negara yang inklusif, berkeadilan, dan berdasarkan pada prinsip-prinsip kebersamaan serta keadilan."}, {"id": 4, "question": "Pada tanggal 22 Juni 1945, sembilan tokoh nasional yang dikenal sebagai Panitia 9 berkumpul untuk membahas usulan-usulan dasar negara yang telah disampaikan dalam sidang pertama BPUPKI. Sidang tersebut bertujuan untuk merumuskan landasan negara yang kokoh dan sesuai dengan semangat kemerdekaan yang sedang diraih. Setelah berbagai diskusi dan perdebatan, Panitia 9 berhasil menyusun sebuah naskah piagam yang kemudian dikenal sebagai Piagam Jakarta. Piagam ini berisi prinsipprinsip dasar negara yang menjadi pijakan bagi pembentukan konstitusi Indonesia yang baru, yang pada akhirnya menjadi cikal bakal dari UndangUndang Dasar Negara Republik Indonesia yang kemudian disahkan. Menurut Muh. Yamin naskah piagam ini disebut dengan ….", "choices": {"A": "Jakarta Charter", "B": "Gentlemans Agreement", "C": "Mukaddimah", "D": "Preambule", "E": "Jakarta Statue"}, "correct": "A", "pembahasan": "Jakarta Charter Pada tanggal 22 Juni 1945, sembilan tokoh nasional yang dikenal sebagai Panitia 9, dipimpin oleh Ir. Soekarno sebagai Ketua, bersidang untuk membahas usulan-usulan dasar negara yang telah disampaikan dalam sidang pertama BPUPKI. Anggota-anggota Panitia 9 tersebut terdiri dari Drs. Muhammad Hatta, Mr. Muhammad Yamin, Mr. Ahmad Soebardjo, Mr. Alfred Andre Maramis, Abdoel Kahar Muzakkir, K.H. Wahid Hasyim, Abikoesno Tjokrosoejoso, dan H. Agus Salim. Tujuan sidang ini adalah untuk merumuskan landasan negara yang sesuai dengan semangat kemerdekaan yang sedang diraih. Setelah melalui berbagai diskusi dan perdebatan yang mendalam, Panitia 9 berhasil menyusun sebuah naskah piagam yang kemudian dikenal sebagai Piagam Jakarta. Piagam ini juga dikenal dengan sebutan Jacarta Charter, sesuai dengan istilah yang digunakan oleh Muh. Yamin, atau Gentelman Agreement menurut Soekiman. Dokumen ini memuat prinsip-prinsip dasar   negara yang menjadi pijakan bagi pembentukan konstitusi Indonesia yang baru. Piagam Jakarta menjadi tonggak penting dalam perjalanan menuju kemerdekaan dan pembentukan negara Indonesia, serta menjadi bagian integral dari sejarah perjuangan bangsa."}, {"id": 5, "question": "Hasil sidang BPUPKI pada tanggal 22 Juni 1945 memunculkan sebuah dokumen yang dikenal sebagai Piagam Jakarta. Dokumen ini menjadi tonggak penting dalam perjalanan perumusan dasar negara bagi Indonesia yang baru merdeka. Salah satu perubahan signifikan yang tercantum dalam Piagam Jakarta adalah pada sila pertama, di mana formulasi awal yang menyebutkan \"Ketuhanan yang berkewajiban menjalankan Syariat Islam bagi pemeluk-pemeluknya\" diubah menjadi \"Ketuhanan yang Maha Esa\". Alasan utama perubahan ini adalah ….", "choices": {"A": "Sebagian Anggota PPKI tidak setuju karena sebagian rakyat Indonesia khususnya yang dari daerah timur tidak beragama Islam", "B": "Anggota BPUPKI yang lain berpikir ini akan menimbulkan masalah baru terkait nasionalisme, kesatuan, dan persatuan", "C": "Perwakilan Indonesia bagian timur datang kepada Hatta dan menjelaskan bahwa mereka tidak ingin bergabung dengan Indonesia jika sila yang pertama tidak diubah", "D": "Muhammad Yamin menyarankan anggota panitia untuk mengubah sila pertama karena akan mengganggu integrasi calon calon wilayah yang tergabung dalam NKRI", "E": "Pada saat itu masing-masing wilayah Indonesia sibuk mengarahkan paham untuk menentukan tujuan kemana Indonesia ini"}, "correct": "C", "pembahasan": "Perwakilan Indonesia bagian timur datang kepada Hatta dan menjelaskan bahwa mereka tidak ingin bergabung dengan Indonesia jika sila yang pertama tidak diubah Pada saat itu, perwakilan Indonesia dari wilayah timur mendatangi Muhammad Hatta untuk menyampaikan keprihatinan mereka terkait isi Piagam Jakarta, khususnya terkait formulasi sila pertama yang mengenai \"Ketuhanan yang Maha Esa\". Mereka menegaskan kepada Muhammad Hatta bahwa mereka tidak ingin bergabung ke dalam Negara Kesatuan Republik Indonesia (NKRI) jika sila pertama dalam Piagam Jakarta tetap dalam formulasi tersebut. Mereka menyatakan kesiapan untuk berpartisipasi dalam kesatuan nasional hanya jika sila pertama tersebut diubah agar lebih mencerminkan keyakinan dan nilai-nilai agama mereka. Hal ini menunjukkan pentingnya representasi dan partisipasi dari seluruh wilayah Indonesia dalam proses pembentukan dasar negara, serta kebutuhan untuk mengakomodasi keragaman agama dan budaya dalam membangun kesatuan bangsa."}, {"id": 6, "question": "Budi Utomo, yang didirikan oleh Dr. Soetomo pada tanggal 20 Mei 1908, merupakan organisasi yang memiliki peran penting dalam sejarah pergerakan nasional Indonesia. Pendiriannya tidak terlepas dari peran pendorong utamanya, yaitu Wahidin Soedirohusodo. Budi Utomo diakui sebagai organisasi pertama di Indonesia yang memiliki ciri khas nasionalisme modern, dengan struktur pengurus tetap, keanggotaan resmi, serta tujuan dan program kerja yang jelas. Melalui Budi Utomo, para pemikir dan pemimpin nasional saat itu berupaya menggalang kesatuan dan   semangat persatuan dalam rangka memperjuangkan kemerdekaan Indonesia. Tujuan utama didirikannya organisasi Budi Utomo adalah …", "choices": {"A": "Menyadarkan kedudukan masyarakat Jawa, Sunda, Madura, dan penduduk Hindia seluruhnya tanpa melihat keturunan, kelamin, dan agama", "B": "Menyadarkan Belanda untuk membalas budi kebaikan masyarakat Jawa, Sunda, Madura, dan Penduduk Hindia seluruhnya tanpa melihat keturunan, kelamin dan agama", "C": "Memajukan Pendidikan masyarakat Jawa, Sunda, Madura, dan Penduduk Hindia seluruhnya tanpa melihat keturunan, kelamin dan agama", "D": "Meningkatkan keharmonisan Belanda dan Indonesia Khususnya dalam bidang pengajaran, pertanian, pertenakan, dagang, Teknik, industry dan kebudayaan", "E": "Mengajak masyarakat Jawa, Sunda, Madura da·n Penduduk Hindia seluruhnya untuk melawan penjajah Belanda dengan strategi perang Gerilya"}, "correct": "C", "pembahasan": "Memajukan Pendidikan masyarakat Jawa, Sunda, Madura, dan Penduduk Hindia seluruhnya tanpa melihat keturunan, kelamin dan agama Selain memperjuangkan kemajuan Jawa dan Madura, Budi Utomo juga bertujuan untuk meningkatkan kesejahteraan masyarakat secara umum. Salah satu usaha yang dilakukan dalam rangka mewujudkan tujuan tersebut adalah dengan memajukan bidang pendidikan sesuai dengan visi yang dicita-citakan oleh Wahidin Soedirohusodo. Langkah ini dianggap sebagai upaya awal yang penting dalam meraih kemajuan bangsa. Selain itu, Budi Utomo juga aktif dalam upaya memajukan sektor pertanian, peternakan, dan perdagangan. Hal ini dilakukan sebagai bagian dari strategi untuk meningkatkan ekonomi lokal dan memperkuat kemandirian ekonomi masyarakat. Dengan memperbaiki sektor-sektor ini, diharapkan dapat meningkatkan pendapatan dan kesejahteraan masyarakat secara keseluruhan, serta mengurangi tingkat kemiskinan dan ketidaksetaraan sosial."}, {"id": 7, "question": "Sumpah Pemuda memang menjadi tonggak sejarah kemerdekaan Indonesia dan juga merupakan salah satu titik awal dari perjuangan bangsa Indonesia dalam mencapai kemerdekaan. Menjadi suatu titik awal pastinya Sumpah Pemuda mengandung nilainilai yang tidak tergantikan didalamnya, salah satunya adalah perasaan menghargai dan mencintai bangsa Indonesia. Makna dan nilai-nilai dari sumpah pemuda dapat diterapkan dalam kehidupan sehari-hari baik dalam lingkungan keluarga, lingkungan sekolah maupun pada lingkungan masyarakat. Berikut merupakan penerapan nilai Sumpah Pemuda yang dilaksanakan dalam kehidupan bermasyarakat antara lain ….", "choices": {"A": "Menerapkan sikap saling tolong-menolong sesama anggota keluarga, artinya jika terdapat salah satu anggota yang membutuhkan bantuan keluarga sebagai lingkungan terdekat harusnya bisa menolong satu sama lain.   B. Menjalin kerjasama sesama warga untuk mencapai suatu tujuan yang sama, seperti melakukan pembangunan desa, meningkatkan fasilitas desa, dan lain sebagainya.", "C": "Tidak hanya tolong menolong saat ada masalah saja, tetapi bergotong royong atau tolong menolong dalam hal lain seperti menjaga kebersihan lingkungan keluarga; mengerjakan pekerjaan rumah juga perlu dilakukan secara bersama-sama.", "D": "Mengikuti upacara bendera yang diadakan secara rutin dengan tertlb untuk menghormati bangsa Indonesia serta sejarah perjuang dldalamnya.", "E": "Mematuhi peraturan sekolah untuk mencegah terjadlnya pelanggaran-pelanggaran yang dapat mengarah pada suatu konfllk atau masalah berdasarkan pada satu nilai persatuan."}, "correct": "B", "pembahasan": "Menjalin kerjasama sesama warga untuk mencapai suatu tujuan yang sama, seperti melakukan pembangunan desa, meningkatkan fasilitas desa, dan lain sebagainya. Nilai-nilai luhur yang terkandung dalam Sumpah Pemuda membawa makna yang dalam dan luas bagi pembentukan karakter dan identitas bangsa Indonesia. Salah satu nilai utama yang terpancar adalah cinta tanah air, yang mendorong rasa bangga dan kesetiaan terhadap bangsa dan negara Indonesia. Rasa cinta tanah air ini bukan sekadar perasaan, tetapi juga menjadi pendorong untuk membangun semangat nasionalisme yang kuat di kalangan masyarakat. Contoh nyata dari implementasi nilai-nilai Sumpah Pemuda adalah penggunaan bahasa Indonesia dalam kehidupan sehari-hari dan kebanggaan dalam menggunakan produk-produk buatan Indonesia. Dengan menggunakan bahasa Indonesia, kita tidak hanya memperkuat identitas budaya kita, tetapi juga menyatukan beragam suku dan etnis di Indonesia di bawah satu bahasa nasional yang sama. Selain itu, rasa bangga menggunakan produk lokal juga merupakan bentuk dukungan terhadap ekonomi domestik dan industri dalam negeri, yang pada akhirnya dapat meningkatkan kesejahteraan bangsa. Peran Sumpah Pemuda dalam mempersatukan bangsa Indonesia juga terlihat dalam kerjasama dan solidaritas antarwarga untuk mencapai tujuan bersama. Misalnya, melalui kerjasama dalam pembangunan desa atau peningkatan fasilitas masyarakat, masyarakat dapat saling mendukung dan bekerja sama demi meningkatkan kualitas hidup dan pembangunan di lingkungan lokal mereka. Dengan memahami dan mengimplementasikan nilai-nilai Sumpah Pemuda secara nyata dalam kehidupan sehari- hari, kita dapat menjaga persatuan dan kesatuan bangsa Indonesia serta mewujudkan cita-cita kemerdekaan yang diemban oleh para pahlawan dan pejuang kemerdekaan."}, {"id": 8, "question": "Keragaman budaya merupakan salah satu aset berharga yang dimiliki oleh suatu bangsa. Di Indonesia, keberagaman budaya menjadi ciri khas yang memperkaya kehidupan masyarakatnya. Setiap daerah di Indonesia memiliki warisan budaya yang kaya dan beragam, mencakup berbagai aspek seperti adat istiadat, tata cara, kuliner, pakaian adat, bahasa, seni, dan banyak lagi. Keragaman budaya di Indonesia menjadi sumber kekayaan yang tidak ternilai harganya. Dengan menghargai, menjaga, dan mempromosikan keberagaman budaya tersebut, kita dapat memperkokoh   persatuan dan keutuhan bangsa Indonesia, serta menjunjung tinggi kearifan lokal dan keindahan budaya yang dimiliki oleh setiap daerah di negeri ini. Namun bagaimana keragaman budaya dapat mempengaruhi nasionalisme di Indonesia ….", "choices": {"A": "Keberagaman budaya dapat memperkaya kebudayaan nasional tetapi tidak berpengaruh pada nasionalisme", "B": "Keberagaman budaya dapat mempengaruhi nasionalisme hanya jika diatur o_leh pemerintah", "C": "Keberagaman budaya dapat membantu masyarakat untuk membangun rasa toleransi terhadap perbedaan dan memperkuat persatuan nasional", "D": "Keberagaman budaya dapat menimbulkan perpecahan dan mengurangi rasa nasionalisme", "E": "Keberagaman budaya tidak memiliki pengaruh pada nasionalisme"}, "correct": "C", "pembahasan": "Keberagaman budaya dapat membantu masyarakat untuk membangun rasa toleransi terhadap perbedaan dan memperkuat persatuan nasional Budaya tidak hanya mencerminkan identitas suatu bangsa, tetapi juga mengajarkan nilai- nilai luhur yang menjadi dasar kehidupan masyarakat. Setiap aspek budaya, mulai dari adat istiadat, kesenian, bahasa, hingga kebiasaan sehari-hari, memiliki keunikan dan kegunaannya masing-masing. Keberagaman budaya di Indonesia menjadi sumber kekayaan yang tidak ternilai, karena melalui keberagaman tersebut, kita dapat memahami dan menghargai berbagai pandangan dunia, tradisi, dan kepercayaan yang berbeda-beda. Lebih dari itu, budaya juga memiliki peran penting dalam membentuk sikap toleransi dan persatuan nasional. Melalui budaya, masyarakat diajarkan untuk menghargai perbedaan dan menghormati keberagaman yang ada. Budaya menjadi media untuk memahami bahwa meskipun berbeda-beda, setiap individu memiliki nilai yang sama sebagai manusia. Dengan demikian, budaya dapat menjadi jembatan yang menghubungkan berbagai kelompok masyarakat, suku, agama, dan etnis dalam semangat persatuan dan kesatuan bangsa."}, {"id": 9, "question": "Masuknya budaya asing ke dalam suatu masyarakat memang dapat membawa dampak negatif jika tidak dielaborasi dengan bijak oleh masyarakat penerima. Tanpa proses penyaringan dan pemilahan yang cermat, adopsi budaya asing dapat menyebabkan perubahan signifikan dalam struktur kebudayaan lokal. Dampak negatif yang mungkin timbul akibat adopsi budaya asing yang tanpa pemilahan ini adalah penurunan identitas dan jati diri bangsa. Identitas budaya suatu bangsa merupakan warisan berharga yang mencerminkan sejarah, nilai-nilai, dan kekayaan budaya yang dimiliki. Ketika budaya asing menggantikan atau mengesampingkan budaya lokal, maka akan terjadi degradasi terhadap identitas dan keberagaman budaya masyarakat tersebut. Untuk menghindari pengaruh tersebut langkah ang perlu dilakukan adalah …", "choices": {"A": "Memantapkan budaya naslonal untuk mengganti dengan budaya daerah", "B": "Menghindari masuknya pengaruh budaya darl negara lain", "C": "Mengaktualisasi budaya daerah dalam berbagai kesempatan   D. Menyesuikan budaya daerah dengan budaya yang datang dari luar", "E": "Membangun sanggar-sanggar budaya dlberbagai tempat"}, "correct": "C", "pembahasan": "Mengaktualisasi budaya daerah dalam berbagai kesempatan Upaya untuk menjaga keragaman budaya masyarakat Indonesia tidak hanya berhenti pada pemantapan budaya nasional, tetapi juga memperkuat dan mengaktualisasi budaya daerah dalam berbagai aspek kehidupan. Pendekatan ini memperkuat kedudukan budaya lokal sebagai bagian integral dari identitas nasional yang kaya dan beragam. Dengan memantapkan budaya nasional, masyarakat Indonesia dapat membangun fondasi yang kuat untuk menghadapi arus globalisasi yang membawa pengaruh budaya asing. Budaya nasional yang kokoh menjadi payung yang melindungi keberagaman budaya daerah dari ancaman homogenisasi budaya yang mungkin terjadi akibat penetrasi budaya asing. Sementara itu, mengaktualisasi budaya daerah dalam berbagai kesempatan menjadi sarana untuk memperkuat identitas budaya lokal dan mempertahankan kekayaan budaya setempat. Dalam konteks ini, pemerintah, lembaga pendidikan, dan masyarakat secara keseluruhan dapat menggalakkan upaya-upaya seperti festival budaya, pertunjukan seni tradisional, dan promosi warisan budaya daerah. Melalui upaya-upaya ini, masyarakat Indonesia dapat menghindari pengaruh asing yang dapat mengikis keragaman budaya dengan membangun kedudukan yang kuat bagi budaya nasional dan memperkuat serta mengaktualisasikan budaya daerah dalam berbagai aspek kehidupan. Dengan demikian, keberagaman budaya Indonesia dapat terjaga dan terus berkembang sebagai aset berharga bagi bangsa dan negara."}, {"id": 10, "question": "Kerusuhan atau gangguan keamanan adalah suatu kondlsl tldak aman yang diakibatkan oleh gangguan keamanan, huru hara, ataupun konflik soslal antarkelompok yang ditandai oleh benturan fisik dan berlangsung pada waktu tertentu serta mengganggu stabilitas nasional dan mengancam lunturnya rasa persatuan dan kesatuan negara. Maka dari itu kedaulatan dan kestabilan negara harus tetap dijaga, terutama darl berbagai gangguan yang ingin menggangu kewibawaan negara. Bangsa Indonesia harus mewaspadai segala bentuk ancaman baik dari dalam amupun dari luar. Berlkut yang termasuk contoh ancaman dari dalam negeri adalah ...", "choices": {"A": "Adanya invansi dari negara tetangga", "B": "Menjamurnya produk impor di Indonesia", "C": "Semakln banyak bermunculan kelompok-kelompok kapitalisme", "D": "Munculnya kelompok-kelompok berpaham separatisme", "E": "Feminisme dan liberalisme menjadi satu acuan dalam membuat kebijakan"}, "correct": "D", "pembahasan": "Munculnya kelompok-kelompok berpaham separatism Kelompok separatisme adalah kelompok yang me_miliki pandangan bahwa suatu wilayah atau daerah harus memisahkan diri dari negara atau pemerintahan yang saat ini menguasainya dan membentuk pemerintahan atau negara baru yang merdeka. Kelompok ini sering menuntut pemisahan wilayah melalui cara yang bersifat radikal atau konfrontatif. Kelompok separatisme dapat muncul karena berbagai alasan, seperti perbedaan etnis,   agama, bahasa, dan kebudayaan. Kelompok ini dapat menimbulkan ancaman bagi kedaulatan dan kestabilan negara, karena dapat mengarah pada perpecahan dan konflik dalam masyarakat. Oleh karena itu, pemerintah harus berhati-hati dan memperlakukan isu ini dengan bijak dan solusi yang tepat.    NASIONALISME � Pengertian Nasionalisme Nasionalisme adalah rasa cinta, bangga, dan kesetiaan kepada bangsa dan negara yang diwujudkan melalui sikap menghormati simbol negara, menjaga persatuan, serta mendukung pembangunan nasional. Menurut beberapa ahli: Tokoh  Definisi Nasionalisme  Ernest Renan  Keinginan untuk hidup bersama sebagai suatu bangsa (kesatuan kehendak).  Benedict Anderson  Komunitas politik yang dibayangkan (imagined community).  Hans Kohn  Perasaan kebersamaan berdasarkan sejarah, budaya, dan cita-cita bersama.  � Dalam konteks Indonesia, nasionalisme mengakar pada Pancasila dan UUD 1945, serta semangat perjuangan kemerdekaan.  � Landasan Nasionalisme Indonesia Landasan  Keterangan  Filosofis  Pancasila  Konstitusional Pembukaan UUD 1945 (Alinea I – IV) Historis  Perjuangan melawan penjajah selama ±350 tahun  Sosiologis  Keanekaragaman suku, agama, budaya yang membutuhkan pemersatu  Yuridis  UU No. 3 Tahun 2002 tentang Pertahanan Negara  � Ciri dan Nilai Nasionalisme Indonesia Nasionalisme Indonesia memiliki ciri khas yang berbeda dari paham nasionalisme ekstrem di negara tertentu yang bersifat chauvinistik. Nilai pokok nasionalisme Indonesia:"}]}, "NASIONALISME": {"category": "TWK", "title": "NASIONALISME", "questions": [{"id": 1, "question": "Salah satu tugas utama sekolah adalah membangun karakter bangsa yang kuat melalui pendidikan tentang nasionalisme. Namun, sering kali pendidikan nasionalisme hanya terfokus pada pengajaran sejarah Indonesia dan memupuk rasa kebanggaan terhadap budaya Indonesia, tanpa memperhatikan keterkaitannya dengan tantangan global yang dihadapi oleh Indonesia saat ini. Seiring dengan perkembangan zaman dan globalisasi, penting bagi pendidikan nasionalisme untuk lebih luas dalam cakupannya. Ini mencakup pemahaman tentang peran Indonesia dalam kancah internasional, tantangan global seperti perubahan iklim, perdagangan internasional, dan teknologi informasi. Dengan demikian, pendidikan nasionalisme yang holistik akan membekali generasi muda dengan pemahaman yang mendalam tentang identitas nasional mereka serta kesiapan menghadapi dinamika global dalam upaya membangun bangsa yang kuat dan adaptif. Bagaiman cara meningkatkan pendidikan naionalisme yang lebih holistik dan relevan dengan kebutuhan zaman …", "choices": {"A": "Memberikan bimbingan karir kepada siswa untuk mengenal berbagai peluang karir di dunia internasional", "B": "Mengajarkan siswa tentang pentingnya pengembangan teknologi dan inovasi untuk memajukan Indonesia di dunia internasional", "C": "Menjalin kemitraan dengan lembaga pendidikan di negara lain untuk meningkatkan kualitas pendidikan di Indonesia·", "D": "Meningkatkan keterlibatan siswa dalam kegiatan sosial dan lingkungan untuk mengembangkan kesadaran akan tanggung jawab sosial dan lingkungan", "E": "Meningkatkan pemahaman siswa tentang peran Indonesia dalam konteks regional dan global melalui program pertukaran siswa ke luar negeri."}, "correct": "D", "pembahasan": "meningkatkan keterlibatan siswa dalam kegiatan sosial dan lingkungan untuk mengembangkan kesadaran akan tanggungjawab sosial dan lingkungan. Melalui partisipasi dalam kegiatan sosial dan lingkungan, siswa dapat memperdalam pemahaman mereka tentang nilai-nilai yang mendasari nasionalisme yang holistik. Dalam konteks ini, mereka tidak hanya belajar tentang pentingnya solidaritas dan kerjasama dalam membangun   masyarakat yang lebih baik, tetapi juga tentang tanggung jawab mereka terhadap lingkungan alam dan sosial di sekitar mereka. Dengan terlibat dalam kegiatan sosial seperti kegiatan amal, penyuluhan, atau aksi sukarela, siswa memiliki kesempatan untuk merasakan dampak langsung dari kontribusi mereka terhadap kesejahteraan masyarakat. Hal ini membantu mereka membangun kesadaran akan pentingnya tanggung jawab sosial, di mana mereka belajar untuk peduli terhadap kebutuhan orang lain dan berkontribusi secara positif dalam mengatasi berbagai masalah sosial yang ada. Di sisi lain, terlibat dalam kegiatan lingkungan seperti penanaman pohon, kampanye daur ulang, atau membersihkan lingkungan, membantu siswa memahami pentingnya menjaga alam dan lingkungan hidup yang bersih dan sehat. Mereka belajar bahwa sebagai bagian dari bangsa yang bertanggung jawab, mereka memiliki peran dalam melindungi dan melestarikan sumber daya alam demi keberlanjutan lingkungan bagi generasi mendatang. Selain itu, keterlibatan dalam kegiatan sosial dan lingkungan juga membantu siswa mengembangkan keterampilan interpersonal dan kepemimpinan yang berharga. Dengan bekerja sama dalam tim, berkomunikasi dengan efektif, dan mengelola proyek bersama, mereka memperoleh pengalaman praktis yang dapat membantu mereka menjadi pemimpin yang efektif dan berpengaruh di masa depan. Dengan demikian, partisipasi siswa dalam kegiatan sosial dan lingkungan bukan hanya tentang membangun kesadaran akan nilai-nilai nasionalisme yang holistik, tetapi juga tentang membentuk karakter mereka sebagai individu yang peduli, bertanggung jawab, dan memiliki kemampuan untuk membawa perubahan positif bagi masyarakat dan lingkungan mereka."}, {"id": 2, "question": "Nasionalisme, dalam banyak kasus, dapat berfungsi sebagai alat yang efektif untuk menyatukan individu dari berbagai latar belakang budaya, agama, dan etnis di dalam suatu negara. Ketika seseorang merasa bangga dengan identitas nasionalnya, mereka cenderung memiliki dorongan untuk mempertahankan integritas dan keamanan negara tersebut. Hal ini bisa terwujud dalam bentuk dukungan terhadap institusi-institusi negara, partisipasi dalam upaya pembangunan, dan rasa solidaritas dengan sesama warga negara. Namun, penting untuk diingat bahwa nasionalisme juga memiliki potensi untuk memperburuk konflik dan perbedaan di antara individu-individu. Di bawah ini yang tidak termasuk bentuk yang memperburuk nasionalisme adalah ...", "choices": {"A": "Ketakutan atau kebencian terhadap orang asing atau orang yang berbeda latar belakang budaya dan etnisnya", "B": "Nasionalisme yang berlebihan dapat digunakan sebagai alat untuk membenarkan diskriminasi terhadap kelompok minoritas", "C": "Nasionalisme yang berlebihan dapat mendorong pemikiran bahwa negara atau kelompok tertentu lebih superior dibanding kelompok lainnya", "D": "Nasionalisme yang bersifat inklusif cenderung memperkuat persatuan dan kesatuan", "E": "Nasionalisme yang tidak inklusif menghambat pengakuan hak asasi manusia semua warga negara terutama hak-hak minoritas"}, "correct": "D", "pembahasan": "Nasionalisme yang bersifat inklusif cenderung memperkuat persatuan dan kesatuan   Nasionalisme yang bersifat inklusif adalah sikap atau pandangan yang mengutamakan persatuan dan kesatuan suatu negara tanpa menimbulkan konflik atau pemisahan di antara warganya. Dalam konteks ini, nasionalisme inklusif tidak hanya mengakui, tetapi juga mendorong penghargaan terhadap keragaman budaya, etnis, dan agama yang ada di dalam negara tersebut. Hal ini tercermin dalam penghargaan terhadap hak asasi manusia semua warga negara tanpa pandang bulu. Lebih jauh lagi, nasionalisme inklusif membangun fondasi yang kokoh untuk persatuan di antara individu-individu dari berbagai latar belakang budaya, agama, dan etnis dalam suatu negara. Dengan mempromosikan rasa saling menghormati dan saling memahami, nasionalisme ini menciptakan ikatan yang kuat di antara semua elemen masyarakat, memperkuat stabilitas dan keharmonisan dalam bangsa, serta mendorong kolaborasi yang positif dalam membangun masa depan yang bersama-sama. Dengan demikian, nasionalisme inklusif tidak hanya membawa manfaat bagi pembangunan negara, tetapi juga untuk kesejahteraan dan kedamaian seluruh masyarakatnya."}, {"id": 3, "question": "Sebagai negara yang memiliki keberagaman budaya atau multikultural, Indonesia memiliki risiko terhadap ancaman dalam hal sosial dan budaya. Perbedaan-perbedaan ini dapat menjadi kelebihan yang memperkaya bangsa, namun sekaligus menjadi tantangan yang perlu diatasi untuk menjaga kesatuan dan keutuhan negara. Apa peran nasionalisme yang tepat untuk menghadapi hal tersebut?", "choices": {"A": "Bersikap objektif dan tidak terlibat dalam masalah politik negara", "B": "Aktif mengikutl kegiatan nasional agar memiliki jiwa nasion
