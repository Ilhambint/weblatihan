alisme", "C": "Mengenal berbagai budaya yang ada di masyarakat Indonesia", "D": "Menghadiri forum seperti perkumpulan lintas agama yang beredar", "E": "Menerapkan nilai sila kedua dalam kehidupan sehari-hari"}, "correct": "C", "pembahasan": "Mengenal berbagal budaya yang ada di masyarakat Indonesia Nasionalisme, yang merupakan ungkapan dari cinta mendalam terhadap negara, memiliki peran yang sangat penting dalam membentuk identitas dan kekuatan suatu bangsa. Di Indonesia, yang kaya akan keanekaragaman suku, bahasa, dan budaya, pengakuan dan penghormatan terhadap keragaman tersebut menjadi kunci dalam membangun fondasi nasionalisme yang kuat dan inklusif. Dalam kehidupan sosial dan budaya, penting bagi kita untuk tidak hanya mengenal, tetapi juga menghargai serta merayakan keberagaman budaya yang ada di masyarakat. Ini mencakup pemahaman terhadap berbagai tradisi, adat istiadat, bahasa, dan kepercayaan yang menjadi bagian integral dari identitas masyarakat Indonesia. Dengan menghargai keberagaman ini, kita dapat membangun toleransi, saling pengertian, dan rasa solidaritas di antara berbagai kelompok dalam masyarakat. Pengenalan dan penghargaan terhadap keberagaman budaya juga memainkan peran penting dalam menjaga persatuan dan keutuhan bangsa. Ketika setiap individu merasa diakui dan dihargai atas identitas budaya mereka, hal ini akan memperkuat rasa memiliki terhadap negara dan memperkuat ikatan persaudaraan di antara seluruh rakyat Indonesia.   Dengan demikian, pengakuan terhadap keberagaman budaya bukanlah hanya tentang menghormati perbedaan, tetapi juga tentang memperkuat kesatuan dan keutuhan bangsa. Selain itu, melalui pengenalan dan penghormatan terhadap keberagaman budaya, kita juga dapat memperkaya pengalaman kita sendiri dan memperluas wawasan tentang warisan budaya yang kaya di Indonesia. Ini tidak hanya membantu memperkuat identitas nasional kita, tetapi juga membuka pintu untuk dialog lintas budaya yang lebih dalam dan memperkuat hubungan antar masyarakat di seluruh nusantara. Dengan demikian, nasionalisme yang inklusif dan berbasis pada pengakuan terhadap keberagaman budaya adalah kunci dalam membangun negara yang kuat, harmonis, dan berdaya saing di panggung global."}, {"id": 4, "question": "Peristiwa Sumpah Pemuda pada tanggal 28 Oktober 1928 menjadi tonggak penting dalam sejarah perjuangan bangsa Indonesia. Sumpah Pemuda memberikan semangat dan kekuatan kepada pemuda Indonesia untuk bersatu dalam semangat persatuan dan kesatuan. Dengan diselenggarakannya Sumpah Pemuda, terlihat jelas semangat nasionalisme yang berkobar di kalangan pemuda saat itu. Sumpah Pemuda mencerminkan tekad dan keinginan para pemuda Indonesia untuk bersatu dalam satu bangsa, satu bahasa, dan satu tanah air. Bentuk nyata implementasi nasionalisme pada sumpah pemuda adalah ….", "choices": {"A": "Meyakini kemerdekaan merpakan hak segala bangsa", "B": "Memilih Ir. Soekarno menjadi Presiden Republik Indonesia", "C": "Membantu persekutuan para pemuda di daerah-daerah", "D": "Mengakui bahasa Indonesia sebagai bahasa peme,rsatu", "E": "Mengakui NKRI sebagai negara kepulauan"}, "correct": "D", "pembahasan": "Mengakui Bahasa Indonesia sebagai bahasa pemersatu Salah satu bentuk nyata implementasi rasa nasionalisme yang terwujud melalui Sumpah Pemuda adalah pengakuan resmi terhadap bahasa Indonesia sebagai bahasa pemersatu bangsa. Dengan mengakui bahasa Indonesia sebagai bahasa nasional, para pemuda pada masa itu menunjukkan kesediaan untuk meninggalkan perbedaan bahasa daerah dan mengadopsi bahasa yang dapat digunakan secara universal oleh seluruh rakyat Indonesia. Tindakan ini tidak hanya menciptakan kesatuan dalam komunikasi di antara berbagai etnis dan suku, tetapi juga memberikan identitas yang kuat bagi bangsa Indonesia yang sedang berkembang. Dengan demikian, langkah ini bukan hanya sebagai tindakan simbolis, tetapi juga sebagai upaya konkret untuk memperkuat persatuan dan integrasi nasional"}, {"id": 5, "question": "Setiap bangsa harus memiliki kedaulatan dalam upaya mempertahankan eksistensl dimata dunia. Dalam mencapai hal tersebut, tidak hanya pihak pemerintah yang harus berusaha tetapi juga harus ada keterlibatan aktif dari setiap warga negara sebagal bagian penting dari sebuah negara. Oleh karena itu, perlu adanya pembinaan dan pemahaman sikap-sikap yang menunjukan jiwa nasionalisme. Nasionalisme dimaksud untuk menumbuhkan nilai-nilai ke lndonesiaan yang berangkat dari ldentitas bangsa dan negara dalam upaya mencapai tujuan nasional. Pemahaman tentang sikap-sikap nasionalisme harus bersifat holistik atau menyeluruh   bagi seluruh warga negara Indonesia. Sehingga dalam penerapanya, diharapkan dapat memperkuat dan mempertahankan kedaulatan bangsa dan negara. 0ibawah ini tindakan yang menunjukan jiwa-jiwa nasionalisme warga negara adalah ...", "choices": {"A": "Membeli kue-kue tradisional di pasar untuk memperkuat ekonomi masyarakat bawah agar kesejahteraan ekonomi tumbuh secara merata bagi setiap lapisan masyarakat", "B": "Menggunakan sepatu produk dalam negeri di acara-acara resmi kenegaraan baik nasional maupun internasional", "C": "Menjunjung tlnggl dan mendorong penggunaan Bahasa Indonesia di seluruh wilayah NKRI darl kota hlngga ke pelosok-pelosok daerah.", "D": "Mendirikan sekolah alam bagl masyarakat pedalaman dalam upaya mendorong pemerataan pendidlkan di seluruh wllayah Indonesia agar tumbuh menjadi warga yang cerdas.", "E": "Dokter yang terjun kelapangan memberlkan vaksinasl gratis bagi warga negara Indonesia di wilayah 3T"}, "correct": "C", "pembahasan": "Menjujung tinggi dan mendorong penggunaan Bahasa Indonesia di seluruh wilayah NKRI dari kota hingga pelosok – pelosok daerah Nasionalisme merupakan ungkapan dari rasa cinta dan kesetiaan yang mendalam terhadap negara, yang timbul secara alami dari perasaan yang tulus. Lebih dari sekadar sikap politik, nasionalisme mencakup identitas budaya, kesamaan wilayah, serta cita-cita dan tujuan bersama dalam suatu bangsa. Ini mencerminkan kesatuan dan solidaritas antara individu-individu dalam masyarakat yang memiliki latar belakang budaya yang serupa. Dalam konteks nasionalisme, kesamaan kebudayaan dan identitas wilayah memainkan peran penting dalam membentuk persatuan dan kesatuan suatu bangsa. Kesadaran akan adanya ikatan budaya yang bersamaan dan rasa memiliki terhadap tanah air membentuk dasar dari kesetiaan yang mendalam terhadap negara. Hal ini mengilhami individu-individu untuk berkontribusi dalam upaya memajukan bangsa dan mempertahankan keutuhan wilayah serta kebudayaan yang dimiliki. Selain itu, nasionalisme juga mencakup kesamaan cita-cita dan tujuan bersama dalam mencapai kemajuan dan kesejahteraan bagi seluruh rakyat negara tersebut. Ini mencerminkan semangat kolektif untuk membangun masa depan yang lebih baik dan meraih cita-cita bersama sebagai sebuah bangsa. Dengan demikian, nasionalisme tidak hanya tentang rasa cinta terhadap negara, tetapi juga tentang komitmen untuk berkontribusi dalam pembangunan dan perlindungan kepentingan bersama. Dalam keseluruhan, nasionalisme merupakan konsep yang mencakup lebih dari sekadar rasa cinta terhadap negara. Ini melibatkan identitas budaya, kesetiaan terhadap wilayah, serta semangat untuk mencapai cita-cita bersama sebagai sebuah bangsa. Dengan memahami dan menerapkan nilai-nilai nasionalisme, masyarakat dapat memperkuat persatuan dan kesatuan, serta memajukan negara ke arah kemajuan dan kesejahteraan yang lebih besar."}, {"id": 6, "question": "Rasa cinta terhadap negara tidak hanya mendorong partisipasi aktif dalam berbagai bidang seperti ekonomi, politik, sosial, dan budaya, tetapi juga memberikan dorongan kuat bagi individu untuk berkontribusi secara   maksimal dalam upaya memajukan bangsa. Melalui partisipasi yang aktif ini, baik dalam menciptakan lapangan kerja, berperan dalam kebijakan politik, mengatasi masalah sosial, atau mendukung pengembangan seni dan budaya, individu-individu tersebut dapat memberikan kontribusi yang signifikan dalam mempercepat proses pembangunan nasional secara menyeluruh. Dibawah ini yang termasuk ke dalam tindakan yang mendorong pembangunan nasonal dalam aspek ekoomi adalah …...", "choices": {"A": "Mendorong partisipasi aktif dalam kegiatan sosial seperti keja bakti, donasi, dan relawan untuk membantu masyarakat yang membutuhkan", "B": "Mendorong kewirausahaan dan inovasi teknologi di bidang industri, pertanian, dan jasa yang dapat meningkatkan daya saing ekonomi negara", "C": "Memberikan fasilitas dan dukungan bagi pelaku usaha kecil dan menengah dengan bunga yang besar", "D": "Membatasi investasi asing dan lebih fokus pada investasi dalam negeri", "E": "Menjalin kerja sama antar lembaga negara dan masyarakat dalam upaya meningkatkan kualitas pelayanan public"}, "correct": "B", "pembahasan": "Mendorong kewirausahaan dan inovasi teknologi di bidang industri, pertanian, dan jasa yang dapat meningkatkan daya saing ekonomi negara Untuk meningkatkan pembangunan nasional dalam segi ekonomi, diperlukan upaya yang komprehensif dan berkelanjutan. Salah satu langkah penting adalah mendorong kewirausahaan dan inovasi teknologi di berbagai sektor ekonomi, seperti industri, pertanian, dan jasa. Kewirausahaan dapat menjadi motor penggerak bagi pertumbuhan ekonomi, karena menciptakan lapangan kerja baru, meningkatkan daya saing industri, dan memperluas basis ekonomi negara. Dalam konteks ini, inovasi teknologi juga memainkan peran penting dalam meningkatkan efisiensi dan produktivitas di berbagai sektor. Penerapan teknologi yang canggih dapat meningkatkan kualitas produk dan layanan yang dihasilkan, serta mempercepat proses produksi dan distribusi. Hal ini akan membantu meningkatkan daya saing ekonomi negara dalam pasar global yang semakin kompetitif. Selain itu, dukungan kepada pelaku usaha kecil dan menengah (UKM) juga merupakan komponen kunci dalam memperkuat kemampuan ekonomi negara. UKM memiliki potensi besar untuk menjadi motor penggerak pertumbuhan ekonomi lokal, karena kontribusi mereka terhadap penciptaan lapangan kerja dan peningkatan pendapatan masyarakat. Oleh karena itu, negara perlu memberikan dukungan dalam bentuk pelatihan, pendanaan, dan akses pasar bagi UKM agar mereka dapat berkembang dan bersaing secara efektif. Selanjutnya, memfasilitasi investasi yang berkelanjutan juga menjadi prioritas dalam memperkuat ekonomi negara dalam jangka panjang. Investasi yang berkelanjutan tidak hanya berkontribusi pada pertumbuhan ekonomi, tetapi juga pada pembangunan infrastruktur, penciptaan lapangan kerja, dan transfer teknologi. Dengan demikian, negara perlu menciptakan iklim investasi yang kondusif, memberikan insentif kepada   investor, dan menjaga stabilitas ekonomi untuk menarik investasi domestik maupun asing. Dengan menjalankan strategi ini secara komprehensif dan berkelanjutan, negara dapat memperkuat kemampuan ekonominya dalam menghadapi tantangan global dan mencapai pembangunan yang berkelanjutan serta inklusif."}, {"id": 7, "question": "Nasionalisme yang sehat dan positif memiliki potensi sebagai kekuatan penggerak yang mendorong pembangunan kebangsaan dan memperkokoh kesatuan bangsa Indonesia. Namun, perlu diwaspadai bahwa nasionalisme yang berlebihan dan fanatik dapat menimbulkan dampak negatif. Nasionalisme yang ekstrem seringkali berujung pada konflik dan ketidakadilan terhadap kelompok minoritas di Indonesia. Di bawah ini yang tidak termasuk upaya menjaga keseimbangan antara nasionalisme yang kuat dan inklusif dengan menghargai keberagaman di Indonesia adalah ….", "choices": {"A": "Meningkatkan pemahaman tentang sejarah dan budaya Indonesia sebagai sumber kebanggaan dan inspirasi dalam membangun nasionalisme yang kuat", "B": "Memperkuat pengawasan terhadap gerakan-gerakan ekstrem dan intoleran yang dapat mengancam persatuan dan kesatuan bangsa", "C": "Memberikan perlindungan dan keadilan bagi kelompok minoritas agar merasa dihargai dan diperlakukan sama seperti kelompok mayoritas", "D": "Mendorong kerja sama dan dialog antar kelompok masyarakat untuk membangun kebersamaan dan persatuan di tengah perbedaan", "E": "Membatasi kebebasan berekspresi yang dapat merugikan kelompok minoritas untuk menjaga stabilitas dan harmoni di dalam masyarakat"}, "correct": "E", "pembahasan": "Membatasi kebebasan yang dapat merugikan kelompok minoritas untuk menjaga stabilitas dan harmoni di dalam masyarakat. Pentingnya menjaga stabilitas dan harmoni dalam masyarakat tidak bisa diragukan. Namun, ketika tindakan untuk mencapai tujuan ini melibatkan pembatasan terhadap kebebasan berekspresi, hal ini bisa menimbulkan masalah hak asasi manusia. Pembatasan semacam itu seringkali tidak mencerminkan semangat nasionalisme yang inklusif, yang seharusnya mempromosikan pengakuan terhadap keragaman pendapat dan identitas serta menghormati hak-hak individu. Oleh karena itu, sementara penting untuk menjaga stabilitas dan harmoni, pendekatan yang lebih seimbang dan inklusif mungkin lebih tepat, yang menghormati hak-hak individu tanpa mengorbankan tujuan utama dari sebuah negara yang bersatu dan berdaulat."}, {"id": 8, "question": "Bhinneka Tunggal Ika adalah semboyan nasional Indonesia yang bermakna \"berbeda- beda tetapi tetap satu juga\". Makna ini menggambarkan kekayaan Indonesia sebagai negara kepulauan yang kaya akan keragaman budaya, suku, agama, ras, dan antar golongan. Dalam konteks ini, Bhinneka Tunggal Ika menegaskan bahwa meskipun Indonesia terdiri dari berbagai kelompok yang berbeda, baik dari segi budaya maupun latar belakang sosial, namun semua itu bersatu dalam satu kesatuan sebagai bangsa Indonesia. Hal ini menggarisbawahi prinsip inklusivitas dan persatuan dalam keberagaman, di mana keanekaragaman tersebut dianggap sebagai   kekuatan, bukan sebagai penyebab perpecahan. Contoh penerapan Bhineka Tunggal Ika pada kehidupan sehari hari adalah ...", "choices": {"A": "Memaksa orang lain untuk mengikuti ajaran agamanya", "B": "Menghargal dan menghormati setiap perbedaan pendapat yang ada.", "C": "Berteman hanya dengan sesama suku", "D": "Menerima hak secara berlebihan", "E": "Membentuk organisasi paguyuban bagi para pendatang di daerah rantau."}, "correct": "B", "pembahasan": "menghargai dan menghormati setiap perbedaan pendapat yang ada. Salah satu penerapan Bhinneka Tunggal Ika dalam kehidupan sehari-hari adalah dengan menghargai dan menghormati setiap perbedaan pendapat yang ada. Artinya, meskipun kita memiliki pandangan atau pendapat yang berbeda-beda, kita tetap bersatu sebagai satu bangsa Indonesia. Dengan menghargai perbedaan pendapat, kita menunjukkan sikap toleransi dan menghormati hak setiap individu untuk memiliki pandangan yang berbeda. Hal ini mencerminkan semangat persatuan dalam keberagaman, di mana kebebasan berekspresi dipahami sebagai hak yang harus dijaga, asalkan tidak melanggar prinsip-prinsip keadilan, ketertiban, dan persatuan bangsa. Dengan demikian, menghargai perbedaan pendapat adalah salah satu cara konkrit untuk menerapkan semboyan Bhinneka Tunggal Ika dalam kehidupan sehari-hari."}, {"id": 9, "question": "Dengan berkembangnya teknologi dan globalisasi, nasionalisme mengalami evolusi menjadi fenomena yang semakin kompleks dan multidimensional. Tidak lagi hanya berkaitan dengan kebanggaan terhadap bangsa dan negara, nasionalisme juga melibatkan faktor-faktor ekonomi, sosial, dan budaya yang lebih luas. Artinya, nasionalisme tidak hanya mencakup kesetiaan terhadap lambang-lambang negara, tetapi juga menyangkut hubungan ekonomi antarnegara, identitas sosial masyarakat, serta keberagaman budaya. Bagiamana cara mengembangkan nasionalisme yang holistik dan adaptif dengan tantangan zaman?", "choices": {"A": "Menggalang kerja sama antara pemerintah, masyarakat, dan dunia usaha dalam memperkuat ekonomi Indonesia", "B": "Meningkatkan- keterlibatan . masyarakat dalam program-'program sosial dan lingkungan untuk membangun kepedulian terhadap kesejahteraan bersama", "C": "Menjalin hubungan diplomasi yang, baik dengan negara-negara lain untuk memperkuat posisi'° lndonesia di dunia internasional", "D": "Mempromosikan keragaman budaya Indonesia dan memanfaatkannya sebagai daya tarik pariwisata untuk meningkatkan perekonomian Indonesia", "E": "Meningkatkan pemahaman tentang hak asasi manusia dan keadilan sosial sebagai nilai fundamental dala·m membangun nasionalisme yang inklusif dan berkeadilan"}, "correct": "E", "pembahasan": "meningkatkan pemahaman tentang hak asasi manuasia dan keadilan sosial sebagai nilai fundamental dalam membangun nasioalisme yang inklusif dan berkeadilan. Ada banyak cara yang dapat diambil untuk mengembangkan nasionalisme yang komprehensif dan responsif terhadap tantangan zaman. Meskipun   begitu, opsi E memiliki peran yang sangat penting dalam memastikan bahwa nasionalisme yang berkembang tetap inklusif dan adil. Hal ini karena nasionalisme yang hanya berfokus pada aspek- aspek ekonomi, sosial, dan budaya tanpa memperhatikan hak asasi manusia dan keadilan sosial dapat menghasilkan ketidakadilan terhadap kelompok minoritas dalam masyarakat. Opsi E, atau pilihan yang menekankan inklusivitas dan keadilan, menawarkan pendekatan yang holistik dalam pengembangan nasionalisme. Ini tidak hanya mempertimbangkan aspek-aspek materi seperti ekonomi dan budaya, tetapi juga memperhatikan dimensi moral dan etis dari keadilan sosial. Dengan memperkuat perlindungan terhadap hak asasi manusia dan menekankan pentingnya keadilan sosial, opsi E memberikan jaminan bahwa setiap warga negara, tanpa memandang latar belakangnya, akan diperlakukan secara adil dan setara. Selain itu, opsi E mempromosikan inklusivitas, yang penting dalam konteks keberagaman masyarakat modern. Dengan mengakui dan menghormati perbedaan-perbedaan budaya, agama, dan latar belakang lainnya, nasionalisme yang inklusif memperkuat ikatan sosial antara individu-individu dari berbagai kelompok. Ini menciptakan kerangka kerja yang kuat untuk pembangunan masyarakat yang harmonis dan damai, di mana setiap individu merasa dihargai dan diakui. Dengan demikian, opsi E bukan hanya tentang membangun kesatuan nasional, tetapi juga tentang membangun masyarakat yang inklusif dan adil bagi semua warga negara. Ini merupakan fondasi yang kokoh untuk pembangunan negara yang berkelanjutan dan harmonis, di mana setiap individu memiliki kesempatan yang sama untuk berkembang dan berkontribusi dalam memajukan bangsa."}, {"id": 10, "question": "Semangat nasionalisme dan patriotisme adalah sikap politik atau pemahaman yang dimiliki oleh individu, kelompok, dan masyarakat sebagai suatu bangsa. Ini mencakup rasa kebanggaan dan identitas yang kuat terhadap negara dan budaya mereka. Semangat nasionalisme menekankan persatuan dan keselarasan budaya serta wilayah di dalam suatu negara. Hal ini tercermin dalam rasa memiliki kesetiaan terhadap negara dan semangat untuk memajukannya. Jadi, semangat nasionalisme bukan hanya tentang rasa cinta pada tanah air, tetapi juga tentang kepedulian dan keterlibatan aktif dalam membangun bangsa dan memelihara nilai-nilai budaya yang menjadi identitas bangsa tersebut. Hal ini tertuang dalam ideology Pancasila yang terkadng dalam sila ke …", "choices": {"A": "Ketuhanan Yang Maha Esa", "B": "Kemanusiaan yang adil dan beradab Persatuan Indonesia", "C": "Persatuan Indonesia", "D": "Kerakyatan yang dipimpln oleh hikmat kebijaksanaan dalam permusyawara'tan perwakilan", "E": "Keadilan sosial bagi seluruh rakyat Indonesia"}, "correct": "C", "pembahasan": "Persatuan Indonesia Semangat nasionalisme menjadi landasan penting bagi keutuhan dan keberlanjutan suatu negara. Hal ini tercermin dalam prinsip-prinsip Pancasila, khususnya dalam sila ke- 3 yang menekankan pentingnya mencintai tanah air dan bangsa, serta dalam butir ke-4 yang mendorong   untuk memiliki rasa kebanggaan sebagai warga negara Indonesia. Nasionalisme yang kuat mendorong individu untuk terlibat secara aktif dalam kehidupan negara, baik melalui partisipasi dalam pembangunan maupun dalam upaya memelihara persatuan dan kesatuan bangsa. Dengan demikian, semangat nasionalisme menjadi pendorong utama bagi masyarakat untuk berkomitmen pada nilai-nilai yang memperkuat identitas dan integritas bangsa.   INTEGRITAS Secara etimologi, kata integritas berasal dari bahasa Latin, yaitu integer, yang berarti utuh, lengkap, tanpa cacat, atau sempurna. Dalam konteks modern, integritas merujuk pada kualitas atau karakter seseorang yang bertindak secara konsisten dengan nilai-nilai moral, etika, dan prinsip-prinsip yang dipegangnya, bahkan ketika tidak ada orang lain yang melihat. Konsistensi: Antara perkataan dan perbuatan. Keteguhan hati: Tidak mudah goyah oleh godaan atau tekanan. Kejujuran: Baik terhadap diri sendiri maupun orang lain. Moralitas: Memegang teguh prinsip-prinsip etika yang universal. Seseorang yang memiliki integritas akan melakukan hal yang benar karena itu adalah hal yang benar untuk dilakukan, bukan karena takut hukuman atau mengharapkan imbalan."}]}, "INTEGRITAS": {"category": "TWK", "title": "INTEGRITAS", "questions": [{"id": 1, "question": "Indonesia, sebagai negara kepulauan terbesar di dunia, memiliki kekayaan sumber daya laut yang melimpah. Para nelayan, yang merupakan tulang punggung perekonomian di banyak daerah pesisir, mengandalkan hasil tangkapan dari laut untuk mencukupi kebutuhan hidup mereka. Namun, dengan munculnya pandemi Covid-19, banyak nelayan mengalami kesulitan karena penurunan permintaan dan pembatasan aktivitas perekonomian yang berdampak pada penjualan hasil tangkapan mereka. Pemerintah setempat telah menyadari dampak yang ditimbulkan oleh pandemi ini terhadap nelayan dan perekonomian keluarga mereka. Sebagai respons, mereka telah merumuskan kebijakan yang bertujuan untuk menangani masalah tersebut. Yang dilakukan pemerintah untuk membuat kebijakan untuk menyelesaikan suatu permasalahan merupakan conth penerapan norma …", "choices": {"A": "Agama", "B": "Kesusilaan", "C": "Kesopanan", "D": "Hukum", "E": "Adat"}, "correct": "D", "pembahasan": "Hukum Norma hukum merupakan suatu sistem aturan atau ketentuan yang mengikat seluruh atau sebagian besar warga masyarakat dalam suatu wilayah tertentu. Aturan ini berfungsi sebagai panduan baku yang mengatur perilaku dan interaksi antara individu, kelompok, dan institusi dalam masyarakat. Dengan adanya norma hukum, tercipta suatu kerangka kerja yang memberikan pedoman tentang hak dan kewajiban setiap individu serta sanksi yang diterapkan apabila aturan tersebut dilanggar. Dalam konteks kebijakan pemerintah setempat yang dibuat untuk menangani masalah para nelayan terdampak pandemi Covid-19, langkah   tersebut akan diwujudkan menjadi peraturan daerah (Perda) yang tergolong sebagai norma hukum. Perda adalah peraturan yang ditetapkan oleh pemerintah daerah untuk mengatur kehidupan masyarakat di wilayah mereka. Perda biasanya disusun berdasarkan kebutuhan dan karakteristik khusus setiap daerah, serta mengacu pada regulasi yang lebih tinggi seperti undang- undang dan peraturan pemerintah."}, {"id": 2, "question": "Ketika sedang berkendara, kamu melihat ada sekelompok orang di sekitar lampu lalu lintas. Mereka sedang melakukan penggalangan dana untuk korban bencana akibat banjir. Saat melihat itu, hatimu tergerak oleh rasa empati dan simpati terhadap para korban banjir yang sedang mengalami penderitaan. Kamu merasa bahwa ini adalah kesempatan bagimu untuk turut berkontribusi dalam membantu sesama yang membutuhkan bantuan. Tanpa ragu, kamu pun memutuskan untuk ikut menyumbang untuk para korban banjir. Yang kamu lakukan merupakan cerminan penerapan norma ….", "choices": {"A": "Agama", "B": "Kesusilaan", "C": "Kesopanan", "D": "Hukum", "E": "Adat"}, "correct": "B", "pembahasan": "Kesusilaan Jadi, untuk menjawab soal ini, kita dapat merujuk pada prinsip-prinsip nilai yang mendasari tindakan tersebut. Dalam hal ini, tindakan untuk berbagi sumbangan kepada korban banjir didasari oleh rasa empati dan keinginan untuk membantu sesama yang sedang mengalami kesulitan. Hal ini mencerminkan adanya norma kesusilaan, karena tindakan tersebut berasal dari hati nurani manusia yang membedakan antara kebaikan dan keburukan. Norma kesusilaan adalah norma yang bersumber dari hati nurani manusia dan didasarkan pada nilai-nilai moral yang baik. Ini melibatkan kemampuan seseorang untuk merasakan empati dan simpati terhadap penderitaan orang lain serta keinginan untuk membantu sesama. Dengan demikian, sumbangan tersebut dapat dikategorikan sebagai tindakan yang berasal dari norma kesusilaan. Dalam konteks norma, terdapat beberapa jenis norma, di antaranya:"}, {"id": 3, "question": "Saya bekerja di sebuah perusahaan lokal di daerah tempat tinggal saya. Posisi saya adalah di bagian administrasi, yang bertanggung jawab atas pengurusan surat-menyurat perusahaan. Suatu hari, ketika saya sedang bertugas, datang seorang klien yang memiliki keperluan mendesak. Dia ingin agar pengurusan surat-menyuratnya diprioritaskan dan dipercepat.   Klien tersebut tampak sangat mendesak dan menunjukkan raut wajah yang cemas. Dia mengatakan bahwa surat-menyurat tersebut sangat penting untuk keperluan bisnisnya. Saya merasa simpati terhadap situasinya, namun saya juga sadar bahwa menerima uang untuk mempercepat proses pengurusan tersebut tidaklah etis dan melanggar kebijakan perusahaan. Sikap yang saya ambil adalah …", "choices": {"A": "Menerimanya dengan anggapan sebagai hadiah.", "B": "Menerimanya selama tidak diketahui oleh rekan yang lain.", "C": "Menolak apabila diminta oleh atasan.", "D": "Memarahi klien tersebut karena berusaha menyogok saya.", "E": "Menolak karena hal tersebut adalah gratifikasi"}, "correct": "E", "pembahasan": "Menolak karena hal tersebut adalah gratifikasi. Dalam situasi yang dijelaskan, penting untuk memahami bahwa integritas kita sebagai individu sangat penting, terutama ketika kita dihadapkan pada tawaran atau pemberian dari orang lain yang bertujuan untuk mempercepat atau mempermudah suatu pekerjaan atau urusan tertentu. Tindakan tersebut dapat dikategorikan sebagai bentuk gratifikasi, yang mana menerima pemberian semacam itu bisa merusak integritas dan etika kerja kita. Sebagai pekerja yang bertanggung jawab, penting bagi kita untuk tetap konsisten dengan prinsip-prinsip yang telah ditetapkan, termasuk kepatuhan terhadap aturan dan kebijakan perusahaan. Meskipun terkadang tawaran tersebut mungkin terlihat menguntungkan atau menggoda, namun menerima gratifikasi semacam itu dapat membuka pintu bagi praktikpraktik yang tidak etis dan merugikan. Oleh karena itu, langkah yang tepat dalam situasi tersebut adalah dengan tegas menolak tawaran atau pemberian tersebut. Dengan demikian, kita tidak hanya menjaga integritas dan kepercayaan dari pihak lain, tetapi juga memastikan bahwa pekerjaan atau urusan yang kita tangani tetap dilakukan secara adil, transparan, dan sesuai dengan prinsip- prinsip etika kerja yang tinggi."}, {"id": 4, "question": "Di lingkungan perumahan saya, kehadiran tetangga yang dicurigai sebagai bandar narkoba telah menjadi perbincangan dan kekhawatiran bagi hampir seluruh warga di sekitar. Meskipun telah ada upaya untuk melaporkan keberadaannya kepada pihak berwenang, seperti kepolisian, namun tetangga tersebut tampaknya selalu mampu menghindari jeratan hukum. Setiap kali ada razia atau laporan dari warga, tetangga yang dicurigai sebagai bandar narkoba tersebut selalu lolos dari tindakan hukum. Suatu hari saya mengetahui bahwa tetangga tersebut ternyata memiliki hubungan keluarga dengan petinggi di instansi setempat. Tindakan saya …", "choices": {"A": "Membiarkan saja lebih baik mencari aman, bisa jadi malah kita sendiri yang yang dituduh.", "B": "Melaporkan ke aparat agar ditindaklanjuti lebih lanjut", "C": "Tidak memperdulikan karena hal itu bukan merupakan urusan saya.", "D": "Meminta bantuan tetangga lainnya untuk mendiskusikan hal ini bagaimana mencari jalan keluarnya", "E": "Melaporkan kejadian tersebut kepada ketua RT"}, "correct": "B", "pembahasan": "Melaporkan ke aparat agar ditindaklanjuti lebih lanjut   Setelah mengetahui atau menyaksikan suatu hal yang menimbulkan dugaan pelanggaran integritas, langkah yang perlu diambil adalah melaporkan kejadian tersebut kepada pihak yang berwenang, seperti kepolisian atau lembaga penegak hukum lainnya. Melaporkan kejadian tersebut penting untuk memastikan bahwa masalah tersebut ditangani secara profesional dan sesuai dengan prosedur hukum yang berlaku. Selain itu, melalui pelaporan, kita dapat memberikan kontribusi dalam menjaga keamanan dan ketertiban lingkungan serta mencegah potensi bahaya bagi masyarakat"}, {"id": 5, "question": "Anda seorang pegawai bagian inventarisasi sarana dan prasarana di kantor. Salah satu aset kantor adalah mobil dinas yang Anda pakai setiap hari untuk berangkat ke kantor. Ada peraturan kantor yang melarang menggunakan mobil dinas untuk kepentingan pribadi baik saat maupun di luar jam kerja. Pada suatu hari, anggota keluarga Anda sakit sehingga harus segera dibawa ke rumah sakit untuk mendapatkan perawatan intensif karena kondisinya cukup parah. Kondisi lalu lintas jalan kota Anda sangat macet. Di rumah, tidak ada kendaran lain selain mobil dinas. Hal yang akan Anda lakukan adalah....", "choices": {"A": "Menggunakan mobil dinas untuk segera membawa anggota keluarga saya ke rumah sakit karena kondisinya mendesak. Belum tentu ada rekan kerja atau atasan yang melihat saya menggunakan mobil dinas", "B": "Menggunakan mobil dinas untuk segera membawa anggota keluarga saya ke rumah sakit karena kondisinya mendesak. Bila tidak sengaja terlihat oleh rekan kerja atau atasan, saya akan klarifikasikan ketika masuk kantor", "C": "Menelepon ambulan untuk menjemput anggota keluarga yang sakit untuk segera dibawa ke rumah sakit guna mendapatkan perawatan intensif", "D": "Menelepon keluarga yang memiliki kendaaran untuk meminta tolong mengantarkan anggota keluarga saya yang sedang kritis ke rumah sakit", "E": "Memesan taksi online atau mencarter angkutan umum untuk membawa anggota keluarga ke rumah sakit dengan segera"}, "correct": "E", "pembahasan": "Memesan taksi online atau mencarter angkutan umum untuk membawa anggota keluarga ke rumah sakit dengan segera Integritas merupakan nilai yang sangat penting dalam kehidupan individu maupun masyarakat. Prinsip nilai dalam integritas yang meliputi kemandirian, tanggung jawab, dan jujur memiliki peran yang signifikan dalam menjaga kualitas hubungan antarindividu, mengelola tugas-tugas dengan baik, dan membangun kepercayaan di antara anggota masyarakat. - Kemandirian adalah kemampuan untuk bertindak dan membuat keputusan secara independen, tanpa dipengaruhi oleh tekanan eksternal atau kepentingan pribadi yang bertentangan dengan norma-norma moral dan etika. Dengan menjadi individu yang mandiri, seseorang mampu menjaga integritasnya dengan tidak tergantung pada bantuan atau pengaruh dari pihak lain yang dapat mengarah pada tindakan tidak bermoral atau melanggar prinsip-prinsip etika. - Tanggung jawab merupakan sikap mental dan perilaku yang menuntut individu untuk mengakui dan memenuhi kewajiban-kewajibannya dengan baik. Dalam konteks integritas, tanggung jawab berarti bersedia untuk   bertanggung jawab atas tindakan dan keputusan yang diambil, serta menerima konsekuensi yang mungkin timbul dari tindakan tersebut. Dengan bertanggung jawab, individu menunjukkan komitmen mereka terhadap prinsip-prinsip moral dan etika yang menjadi landasan dari integritas. - Jujur merupakan sifat yang menuntut individu untuk berbicara dan bertindak sesuai dengan kebenaran dan keadilan, tanpa menyembunyikan fakta atau menyajikan informasi yang tidak benar. Jujur adalah pondasi dari integritas karena melibatkan kesediaan untuk berinteraksi dengan orang lain dengan penuh kejujuran, transparansi, dan integritas moral. Dengan berpegang teguh pada prinsip kejujuran, individu membangun reputasi yang baik dan memelihara kepercayaan orang lain terhadap dirinya. Dengan menerapkan prinsip-prinsip nilai dalam integritas, individu dapat membentuk karakter yang kuat, memperkuat hubungan interpersonal yang sehat, dan memberikan kontribusi yang positif bagi masyarakat. Integritas yang terpatri dalam perilaku sehari-hari juga membantu dalam menciptakan lingkungan yang aman, adil, dan harmonis bagi semua orang."}, {"id": 6, "question": "Bersikap objektif adalah sikap atau cara berpikir di mana seseorang memberikan penilaian atau membuat keputusan berdasarkan pada ukuranukuran atau kriteria tertentu yang telah ditetapkan sebelumnya. Dalam bersikap objektif, penilaian atau keputusan yang diambil tidak dipengaruhi oleh emosi, preferensi pribadi, atau pandangan subjektif, melainkan didasarkan pada data dan fakta yang ada. Di bawah ini yang tidak termasuk ke dalam ciri – ciri orang yang berpikir objektif adalah …", "choices": {"A": "Selalu berusaha melihat dari sudut pandang yang berbeda", "B": "Sebisa mungkin tidak melibatkan sisi _ emosional dalam memandang suatu permasalahan", "C": "Saat ragu atau bimbang, tidak segan meminta masukan pendapat orang lain", "D": "Menggangap semua orang selalu punya alasan dalam melakukan sesuatu", "E": "Selalu megutamakan kepentingan pribadi jika terdesak"}, "correct": "E", "pembahasan": "Selalu megutamakan kepentingan pribadi jika terdesak Orang yang mampu bersikap objektif memiliki kecenderungan untuk dapat menempatkan diri dengan lebih bijak dalam berbagai situasi. Kemampuan ini memungkinkan mereka untuk melihat suatu peristiwa atau situasi dari berbagai sudut pandang dan mempertimbangkan semua faktor yang relevan sebelum membuat keputusan atau penilaian. Dalam konteks pekerjaan, bersikap objektif dapat membantu seseorang dalam mengambil keputusan yang lebih tepat dan efektif. Di sisi lain, dalam kehidupan seharihari, orang yang objektif cenderung lebih terbuka terhadap berbagai pandangan dan pendapat yang berbeda. Bersikap objektif juga membantu seseorang untuk mengelola emosi dan mengendalikan reaksi impulsif. Secara keseluruhan, kemampuan untuk bersikap objektif merupakan keterampilan yang sangat berharga dalam menghadapi berbagai tantangan dan situasi dalam kehidupan. Dengan mempraktikkan sikap objektif, seseorang dapat mencapai penilaian yang lebih akurat, membuat keputusan yang lebih baik, dan membangun hubungan yang lebih positif dengan orang lain."}, {"id": 8, "question": "Terkait upaya meningkatkan kualitas sumber daya manusia dengan integritas, perusahaan Maju Jaya Corp. menyelenggarakan program pelatihan dan pengembangan karyawan secara rutin. Dalam program ini, karyawan diberikan pelatihan terkait skill teknis, manajerial, dan pengembangan kepribadian yang berintegritas. Ini termasuk pelatihan etika kerja, keterampilan teknis dalam industri IT, dan simulasi situasi kerja. Harapannya, dengan program ini, perusahaan dapat membangun tim yang profesional, berkualitas, dan berintegritas tinggi, meningkatkan kinerja, dan menciptakan lingkungan kerja yang positif. Bagaimana integritas dapat   diterapkan dalam pelaksanaan pelatihan dan pengembangan karyawan tersebut?", "choices": {"A": "Memilih karyawan yang bersedia memberikan suap agar dapat · mengikuti pelatihan.", "B": "Memberikan informasi palsu mengenai kualitas pelatihan agar terlihat lebih baik dari yang sebenarnya.", "C": "Menentukan karyawan yang akan , mengikuti pelatihan secara objektif dan berdasarkan kriteria yang jelas.", "D": "Meminta karyawan untuk membayar biaya pelatihan agar terlihat lebih komitmen dan serius.", "E": "Memberikan penghargaan kepada karyawan yang bersedia melanggar etika dan . integritas dalam pelatihan."}, "correct": "C", "pembahasan": "Menentukan karyawan yang akan, mengikuti pelatihan secara objektif dan berdasarkan kriteria yang jelas lntegritas dapat diterapkan dalam pelaksanaan pelatihan dan pengembangan karyawan dengan menentukan karyawan yang akan mengikuti pelatihan secara objektif dan berdasarkan kriteria yang jelas. Hal inl penting agar proses pelatihan berjalan dengan adil dan tidak diskrlminatif. Memllih karyawan yang bersedia memberikan suap atau memberikan informasi palsu mengenal kualitas pelatihan tidak sesuai dengan prinsip integritas. Memlnta karyawan untuk membayar blaya pelatihan agar terlihat lebih komitmen dan serius juga dapat dlanggap tidak adil karena seharusnya biaya pelatihan menjadi tanggung jawab perusahaan sebagal bentuk investasi dalam pengembangan karyawan. Memberlkan penghargaan kepada karyawan ya_ng melanggar etika dan lntegritas juga jelas-jelas bertentangan dengan prinsip integritas."}, {"id": 9, "question": "Hidup sederhana merupakan sikap yang mencerminkan kebijakan untuk hidup hemat, tidak boros, dan tidak memamerkan kepemilikan barang secara berlebihan. Seseorang yang hidup sederhana tidak merasa perlu untuk menunjukkan kekayaan atau status sosialnya kepada orang lain, meskipun sebenarnya dia memiliki segalanya. Meskipun memulai gaya hidup sederhana terlihat sulit, konsistensi dalam menjalaninya jauh lebih sulit lagi. Namun, melalui perjalanan yang dilakukan secara bertahap, kita akan menyadari bahwa kita hidup dalam masyarakat yang seringkali menggiring kita pada konsumsi berlebihan yang pada akhirnya dapat merusak jati diri kita. Di bawah ini manfaat hidup sederhana dalam linkungan keluarga, kecuali ….", "choices": {"A": "Menjadi teladan yang baik untuk keluarga", "B": "Jaminan dana pendidikan anak anda bisa tercapai", "C": "Memiliki dana cadangan untuk masa depan karir anda", "D": "Memiliki dana untuk berlibur'bersama keluarga", "E": "Mendekatkan diri dengan tindak pidana pencurian"}, "correct": "E", "pembahasan": "Mendekatkan diri dengan tindak pidana pencurian Banyak orang sepakat bahwa hidup sederhana memiliki banyak kebaikan. Gaya hidup yang sederhana dapat membentuk kepribadian yang lebih dewasa dalam berpikir dan lebih hati-hati dalam bertindak serta membuat keputusan. Selain itu, hidup sederhana juga mengajarkan kita untuk lebih bijak dalam mengatur dan mengelola keuangan. Dengan mengurangi pengeluaran yang tidak perlu, kita dapat mengalokasikan sumber daya   finansial dengan lebih efisien, sehingga mampu mencapai tujuan keuangan secara lebih baik. Selain manfaat tersebut, hidup sederhana juga dapat menjaga kita dari risiko kejahatan, seperti pencurian. Karena kita tidak memamerkan harta atau kekayaan yang berlebihan, kita cenderung tidak menarik perhatian pelaku kejahatan. Dengan memilih hidup sederhana, kita juga dapat meredakan tekanan mental yang sering kali disebabkan oleh keinginan untuk terus berkompetisi dalam hal kepemilikan materi. Kita akan lebih fokus pada hal-hal yang benar-benar penting dalam hidup, seperti hubungan sosial, kebahagiaan batin, dan pengembangan diri. Dengan demikian, hidup sederhana dapat membawa kita menuju kehidupan yang lebih bermakna dan memuaskan."}, {"id": 10, "question": "Seorang karyawan yang biasanya selalu menyelesaikan pekerjaannya tepat waktu dan dengan kualitas yang sangat baik, tiba-tiba menghadapi masalah pribadi yang cukup mengganggu. Situasi ini mungkin membuatnya merasa tertekan, cemas, atau bahkan stres. Meskipun dia mencoba untuk mengatasi masalahnya dengan tetap bekerja, pikirannya seringkali terbagi antara tugas-tugas pekerjaan dan pemikiran tentang masalah pribadinya. Akibatnya, kinerjanya mungkin mengalami penurunan karena tidak dapat memberikan fokus dan perhatian yang optimal pada pekerjaannya. Apa yang seharusnya dilakukan karyawan tersebut untuk mempertahankan komitmen dan integritas di tempat kerja?", "choices": {"A": "Menyelesaikan pekerjaannya setelah masalah pribadinya selesai, tanpa memberi tahu rekan kerjanya tentang masalah tersebut.", "B": "Meminta cuti atau izin untuk menyelesaikan masalah pribadinya agar bisa fokus pada pekerjaannya di kemudian hari.", "C": "Menunda pekerjaannya dan membiarkan rekan kerjanya meriyelesaikan tugasnya sampai dia bisa kembali fokus pada pekerjaannya.", "D": "Menyelesaikan pekerjaannya dengan kualitas yang kurang baik karena dia tidak bisa fokus pada pekerjaannya.", "E": "Menyelesaikan pekerjaannya dengan bantuan rekan kerjanya agar bisa memenuhi standar kualitas yang diharapkan."}, "correct": "B", "pembahasan": "Meminta cuti atau izin untuk menyelesaikan masalah pribadinya agar bisa fokus pada pekerjaannya di kemudian hari Sebagai seorang karyawan yang memlliki komitmen dan integritas, dia harus tetap bertanggung jawab terhadap pekerjaannya · dan memastikan bahwa tugasnya diselesaikan dengan kualitas yang baik dan tepat waktu. Namun, jika dia mengalami masalah pribadi yang dapat mempengaruhi kinerjanya, sebaiknya dia meminta cuti atau izin agar dapat menyelesaikan masalah pribadinya terlebih dahulu dan kembali fokus pada pekerjaannya di kemudian hari. Dengan begitu, dia dapat mempertahankan integritas dan komitmennya terhadap pekerjaannya serta menghindari terjadinya kualitas kerja yang buruk atau kesalahan yang dapat merugikan perusahaan."}, {"id": 8, "question": "Masyarakat Indonesia diharapkan untuk saling menghargai perbedaan yang ada dalam masyarakat. Hal ini penting untuk mencegah terjadinya disintegrasi bangsa yang disebabkan oleh tindakan individu atau kelompok tertentu yang berupaya memecah belah persatuan dan kesatuan Indonesia. Salah satu cara untuk menjaga persatuan adalah dengan selalu mengutamakan kepentingan umum daripada kepentingan pribadi. Dengan demikian, sikap saling menghargai dan kesadaran akan kepentingan bersama menjadi landasan yang kuat dalam merawat persatuan dan kesatuan bangsa. Hal ini merupakan amanat Pancasila khususnya sila yang dilambangkan dengan ...", "choices": {"A": "Bintang", "B": "Rantai", "C": "Pohon Beringin", "D": "Padi dan Kapas", "E": "Kepala Banteng"}, "correct": "C", "pembahasan": "Pohon Beringin Merawat persatuan dan kesatuan merupakan prinsip yang tercermin dalam sila ketiga Pancasila, yaitu persatuan Indonesia. Dalam lambangnya, persatuan dan kesatuan digambarkan oleh pohon beringin yang kokoh dan menjalar, menunjukkan betapa pentingnya solidaritas dan keterkaitan antara seluruh elemen bangsa Indonesia. Artinya, setiap individu diharapkan untuk menjaga dan memelihara hubungan yang harmonis serta saling   mendukung demi keutuhan bangsa, seperti halnya akar yang menguatkan pohon beringin. Prinsip ini tidak hanya mengacu pada kesatuan dalam keragaman budaya, suku, agama, dan bahasa, tetapi juga melibatkan kesadaran akan pentingnya kerjasama dan gotong royong dalam mencapai tujuan bersama. Dalam konteks sosial dan politik, merawat persatuan dan kesatuan berarti menghormati perbedaan pendapat dan menjunjung tinggi semangat kebersamaan serta keadilan bagi seluruh rakyat Indonesia. Dengan menerapkan nilai-nilai persatuan dan kesatuan, Indonesia dapat mengatasi berbagai tantangan internal dan eksternal dengan lebih efektif. Solidaritas dan keterkaitan antarwarga negara memperkuat fondasi bangsa Indonesia, sehingga dapat bersama- sama menghadapi segala rintangan dan meraih kemajuan yang berkelanjutan. Oleh karena itu, menjaga dan memelihara persatuan dan kesatuan merupakan tanggung jawab bersama setiap individu dalam mewujudkan cita-cita bangsa."}, {"id": 9, "question": "Bangsa Indonesia hadir karena semangat untuk bersatu. Meskipun Indonesia memiliki beragam suku, ras, dan agama, semangat ingin bersatu ini menjadikan negara kita memiliki persatuan dan kesatuan yang kuat. Dengan menghargai perbedaan dan bekerja sama, bangsa Indonesia terus menjaga keutuhan dan keberagaman negara kita. Kalimat diatas merupakan bentuk penjabaran Pancasila pada...", "choices": {"A": "Sila pertama", "B": "Sila kedua", "C": "Sila ketiga", "D": "Sila keempat", "E": "Sila Kelima"}, "correct": "C", "pembahasan": "Sila Ketiga Nilai-nilai dari Pancasila memiliki makna yang penting:"}, {"id": 10, "question": "Dalam kehidupan sehari-hari, Pancasila sangat cocok untuk dijadikan pedoman karena nilainya sejalan dengan karakter bangsa Indonesia. Setiap perilaku yang ditunjukkan oleh masyarakat Indonesia sebaiknya mengikuti prinsip-prinsip yang terkandung dalam Pancasila. Salah satu simbol Pancasila yang menggambarkan nilai-nilai tersebut adalah lambang Padi dan Kapas. Berikut ini yang merupakan bentuk pengamalan Pancasila yang dilambangkan dengan Padi dan kapas adalah …", "choices": {"A": "Mendahulukan orang tua untuk mendapatkan vaksin", "B": "Antri mendapatkan vaksin sesuai aturan pemerintah", "C": "Memelihara kerukunan dan kenyamanan antar umat beragama", "D": "Mengirim bantuan pangan bagi rakyat yang terdampak pandemi", "E": "Ikut bermusyawarah dengan tetangga untuk mengurus penduduk yang tertular COVID"}, "correct": "A", "pembahasan": "Mendahulukan orang tua untuk mendapatkan vaksin Memberikan prioritas vaksin kepada orang tua merupakan contoh konkret dari penerapan prinsip keadilan bagi seluruh rakyat Indonesia. Tindakan ini mencerminkan upaya penghormatan terhadap kelompok yang rentan terhadap penyakit, terutama mereka yang rentan terhadap dampak serius COVID-"}]}, "IMPLEMENTASI UUD 1945": {"category": "TWK", "title": "IMPLEMENTASI UUD 1945", "questions": [{"id": 1, "question": "Sebagai warga negara, penting untuk memiliki kesetiaan terhadap bangsa dan negara. Ini bisa diwujudkan dengan memperhatikan dan menghormati konstitusi serta ideologi negara. Di Indonesia, konstitusi yang berlaku adalah Undang-Undang Dasar Negara Republik Indonesia Tahun 1945. Jika ada usulan untuk mengubah beberapa pasal dalam UUD, prosesnya dapat dimulai dengan mengajukan usulan tersebut dalam sidang Majelis Permusyawaratan Rakyat (MPR). Usulan tersebut harus didukung oleh setidaknya 1/3 dari total anggota MPR untuk bisa masuk dalam agenda sidang dan kemudian dibahas lebih lanjut. Hal ini terdapat dalam UUD 1945 pasal", "choices": {"A": "Pasal 37 ayat (1)", "B": "Pasal 37 ayat (2)", "C": "Pasal 37 ayat (3)", "D": "Pasal 37 ayat (4)", "E": "Pasal 37 ayat (5)"}, "correct": "A", "pembahasan": "Pasal 37 ayat (1) Pasal 37 ayat (1) Undang-Undang Dasar 1945 menyatakan bahwa jika ada usulan untuk mengubah isi dari UUD, usulan tersebut dapat dibahas dalam sidang Majelis Permusyawaratan Rakyat (MPR) asalkan didukung oleh setidaknya 1/3 dari total anggota MPR. Dengan kata lain, jika sekurangkurangnya 1/3 dari anggota MPR setuju dengan usulan perubahan tersebut, maka usulan tersebut dapat dimasukkan ke dalam agenda sidang untuk dibahas lebih lanjut. Hal ini menunjukkan pentingnya proses demokratis dan partisipatif dalam pembaharuan konstitusi. Dengan memberikan peluang bagi usulan perubahan UUD untuk didiskusikan di MPR, Undang-Undang Dasar 1945 memberikan ruang bagi aspirasi rakyat untuk diekspresikan dan dipertimbangkan secara kolektif oleh perwakilan yang dipilih. Proses ini mendorong inklusivitas dalam pembuatan keputusan yang mengatur kehidupan bersama di negara ini.   Selain itu, persyaratan dukungan setidaknya 1/3 dari anggota MPR juga menunjukkan pentingnya komitmen yang kuat dari sebagian besar perwakilan rakyat terhadap usulan perubahan tersebut. Ini menggambarkan pentingnya mendapatkan dukungan yang substansial sebelum memasukkan usulan perubahan ke dalam agenda resmi sidang MPR. Dengan demikian, prinsip kehati-hatian dan penerimaan kolektif menjadi inti dari proses perubahan konstitusi di Indonesia."}, {"id": 2, "question": "Pilkada Serentak 2020 tetap digelar di 270 daerah di tengah pandemi virus corona (Covid- 19). Jumlah pemilih pemula atau penduduk yang baru berusia 17 tahun ada sekitar 3 juta orang berdasarkan versi KPU. Pilkada serentak pertama kali dilaksanakan pada 2005. Sebelum itu, kepala daerah dipilih oleh DPRD setempat dan dilantik presiden. Saat itu, Indonesia menggelar serentak pemilihan gubernur dan 19 bupati/wali kota di Provinsi Aceh. Kemudian pada 2010, Indonesia kembali menggelar Pilkada serentak. Kali itu, pemilihan kepala daerah di 17 kabupaten/kota di Sumatera Barat digelar bersamaan. Lima tahun setelahnya, Indonesia mengukir sejarah dengan menggelar Pilkada serentak skala nasional untuk pertama kali. Pilkada serentak dan pemilu lima tahunan memiliki sejumlah perbedaan. Dalam Pilkada, pemilih hanya memilih kepala daerah, baik bupati, wali kota, dan/atau gubernur. Berbeda dengan pemilu yang mana masyarakat memilih anggota DPR RI, pemilihan anggota DPD RI, pemilihan anggota DPRD provinsi, serta pemilihan anggota DPRD kabupaten/kota. Pelaksanaan pemilu seperti yang digambarkan pada uraian di atas, merupakan implementasi UUD 1945...", "choices": {"A": "Pasal 22 E", "B": "Pasal 18 ayat (1)", "C": "Pasal 18 ayat (2)", "D": "Pasal 18 ayat (3)", "E": "Pasal 18 ayat (4)"}, "correct": "E", "pembahasan": "Pasal 18 ayat (4) Pasal 18 ayat (4) Undang-Undang Dasar 1945 menegaskan bahwa Gubernur, Bupati, dan Walikota bertanggung jawab sebagai kepala pemerintahan di tingkat provinsi, kabupaten, dan kota secara demokratis. Artinya, proses pemilihan mereka harus melibatkan partisipasi langsung dari warga atau masyarakat setempat. Dalam konteks ini, pemilihan secara demokratis menekankan pentingnya hak suara dan partisipasi aktif masyarakat dalam menentukan pemimpin mereka. Melalui proses pemilihan ini, warga memiliki kesempatan untuk mengekspresikan preferensi politik mereka dan memilih calon yang dianggap mampu mewakili dan memajukan kepentingan masyarakat setempat. Selain itu, prinsip demokratisasi dalam pemilihan kepala daerah juga mencerminkan semangat otonomi daerah yang diatur dalam UndangUndang Dasar"}, {"id": 3, "question": "Undang-Undang Republik Indonesia Nomor 13 Tahun 2012 tentang Keistimewaan Daerah Istimewa Yogyakarta disahkan pada 31 Agustus 2012 dan diundangkan pada 03 September 2012. Pengaturan Keistimewaan DIY bertujuan untuk mewujudkan tata pemerintahan yang baik dan demokratis, ketenteraman dan kesejahteraan masyarakat, menjamin ke-bhinnekatunggal-ika-an, dan melembagakan peran dan tanggung jawab Kasultanan dan Kadipaten dalam menjaga dan mengembangkan budaya Yogyakarta yang merupakan warisan budaya bangsa. Pada pasal berapa dalam UUD 1945 yang mengatur pengakuan dan penghormatan terhadap pemerintah daerah yang bersifat khusus dan istimewa?", "choices": {"A": "Pasal 18", "B": "Pasal 18A ayat (1)", "C": "Pasal 18B ayat (1)", "D": "Pasal 18A ayat (2)", "E": "Pasal 18B ayat (2)"}, "correct": "C", "pembahasan": "Pasal 18B ayat (1) Pasal 18B ayat (1) Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 menegaskan bahwa Negara mengakui dan menghormati keberadaan satuan-satuan pemerintahan daerah yang memiliki karakteristik khusus atau istimewa. Pengakuan ini diberikan dalam konteks kerangka Negara Kesatuan Republik Indonesia. Hal ini menunjukkan komitmen Negara untuk memperhatikan keberagaman dan karakteristik unik yang dimiliki oleh berbagai daerah di Indonesia. Sebagai negara yang terdiri dari berbagai suku, budaya, dan adat istiadat, pengakuan terhadap keberagaman ini merupakan cermin dari semangat persatuan dalam kerangka Negara Kesatuan Republik Indonesia. Pentingnya menghormati dan mengakui keberadaan daerah-daerah yang bersifat istimewa atau khusus adalah untuk memastikan bahwa setiap wilayah di Indonesia merasa diakui dan didukung dalam menjalankan pemerintahan dan mengembangkan potensi lokalnya. Dengan demikian, Pasal 18B ayat (1) UUD 1945 mencerminkan semangat pemberdayaan daerah dan pengakuan terhadap keberagaman sebagai salah satu landasan bagi pembangunan yang inklusif dan berkelanjutan di Indonesia."}, {"id": 4, "question": "Badan Reserse Kriminal (Bareskrim) Polri telah menangkap pendiri pasar Muamalah. Pasar tersebut sempat menarik perhatian publik lantaran bertransaksi menggunakan koin dinar dan dirham. Pihak pemerintah daerah setempat pun sempat melaporkan hal itu ke Satpol PP Kota Depok. Pasar Muamalah beroperasi setiap Minggu per dua pekan sekali di Jalan Raya Tanah Baru, Kelurahan Tanah Baru, Kecamatan Beji, Kota Depok. Pasar Muamalah dibuka di sebuah ruko milik seorang warga bernama Zaim (60) dan beroperasi mulai pukul 7.00-11.00 WIB. Setiap transaksi di pasar tersebut menggunakan koin dinar dan dirham. Pasar tersebut menjual sejumlah barang seperti sendal nabi, parfum, makanan ringan, madu, hingga pakaian. (Sumber: CNBC Indonesia)   Inti wacana pada informasi di atas merupakan sebuah tindakan penyimpangan atas UUD 1945 pasal", "choices": {"A": "Pasal 23", "B": "Pasal 23A", "C": "Pasal 23B", "D": "Pasal 23C", "E": "Pasal 23D"}, "correct": "C", "pembahasan": "Pasal 23B Pasal 23B Undang-Undang Dasar 1945 menegaskan bahwa macam dan harga mata uang diatur melalui undang-undang. Artinya, penetapan jenis mata uang yang sah serta nilai tukar mata uang tersebut diatur oleh peraturan yang telah ditetapkan melalui proses legislatif yang berlaku di negara ini. Dalam konteks ini, mata uang Republik Indonesia (RI) adalah Rupiah, yang merupakan alat pembayaran resmi yang digunakan dalam berbagai transaksi di Indonesia. Pengaturan terhadap jenis mata uang dan nilai tukarnya melalui undang-undang memberikan landasan hukum yang kuat bagi stabilitas ekonomi dan keuangan negara. Selain itu, penetapan macam dan harga mata uang dengan undang-undang juga mencerminkan prinsip demokrasi dan partisipasi masyarakat dalam proses pengambilan keputusan ekonomi yang penting bagi kehidupan sehari-hari. Dengan melibatkan lembaga legislatif dalam penetapan kebijakan mata uang, keputusan yang diambil diharapkan mencerminkan kepentingan dan kebutuhan masyarakat secara luas. Dengan demikian, Pasal 23B UUD 1945 menegaskan pentingnya regulasi yang jelas dan kuat terkait dengan mata uang negara, yang memiliki dampak signifikan terhadap kestabilan ekonomi dan kesejahteraan masyarakat secara umum."}, {"id": 5, "question": "Komisi Yudisial (KY) mengumumkan membuka penerimaan calon hakim agung (CHA) dan calon hakim ad hoc di Mahkamah Agung (MA) Tahun 2020. Rencana seleksi sempat tertunda akibat pandemi Covid-19, kendati demikian KY pastikan protokol kesehatan Covid-19 tetap diterapkan. Ketua Bidang Rekrutmen Hakim KY Aidul Fitriciada Azhari mengatakan, seleksi ini untuk menindaklanjuti Surat Wakil Ketua Mahkamah Agung Bidang Nonyudisial Nomor 18/WKMA-NY/SB/4/2020 perihal pengisian kekosongan jabatan hakim agung dan hakim ad hoc pada Mahkamah Agung RI. KY melakukan wewenangnya sebagaimana diatur dalam UUD 1945..", "choices": {"A": "Pasal 24", "B": "Pasal 24A ayat (1)", "C": "Pasal 24B ayat (1)", "D": "Pasal 24C ayat (1)", "E": "Pasal 25"}, "correct": "C", "pembahasan": "Pasal 24B ayat (1) Pasal 24B ayat (1) Undang-Undang Dasar 1945 Negara Republik Indonesia menetapkan bahwa Komisi Yudisial (KY) memiliki karakteristik sebagai lembaga yang mandiri. KY memiliki kewenangan untuk mengusulkan   pengangkatan hakim agung dan memiliki wewenang lainnya dalam menjaga dan menegakkan integritas, martabat, serta etika hakim. Tugas utama KY adalah melakukan seleksi dan pengusulan calon hakim agung serta calon hakim ad hoc pada Mahkamah Agung kepada Dewan Perwakilan Rakyat Republik Indonesia (DPR RI), yang kemudian ditetapkan oleh Presiden. Proses seleksi ini dilakukan sesuai dengan kebutuhan hakim agung dan hakim ad hoc yang diperlukan oleh Mahkamah Agung. Dalam menjalankan tugasnya, KY bertanggung jawab untuk memastikan bahwa proses seleksi dan penempatan hakim dilakukan secara transparan, objektif, dan adil. Dengan demikian, KY memainkan peran penting dalam menjaga independensi, integritas, dan kualitas lembaga peradilan di Indonesia. Pasal 24B ayat (1) UUD 1945 menegaskan pentingnya peran KY sebagai penjaga kehormatan dan kualitas hakim dalam sistem peradilan Indonesia, yang bertujuan untuk memastikan terwujudnya keadilan dan perlindungan hukum bagi seluruh warga negara."}, {"id": 6, "question": "27 ayat (1) UUD NRI tahun 1945 menyatakan, \"Segala warga negara bersamaan kedudukannya di dalam hukum dan pemerintahan dan wajlb menjunjung hukum dan pemer,intahan itu dengan tidak ada kecualinya.\" Hal ini menunjukkan bahwa ada kesetaraan antara hak dan kewajiban bagi semua warga negara, dan tidak boleh ada diskriminasi dalam hal tersebut. Berikut merupakan kewajiban warga negara terhadap negara Indonesia yang berdampak pada ketertiban masyarakat adalah ...", "choices": {"A": "Tidak boleh ada pertentangan antara satu pasal dengan pasal lainnya", "B": "Tiap unsur dari UUD harus saling mengisi", "C": "Nilai-nilai yang ada pada pembukaan UUD menjadi asal dari tiap pasal", "D": "Batang tubuh merupakan penjelasan dari semua aspek di Pembukaan", "E": "Pembukaan adalah ringkasan dari Batang Tubuh"}, "correct": "C", "pembahasan": "Nilai-nilai yang ada.pada pembukaan UUD menjadi asal dari tiap pasal Hubungan kausal organis adalah sebuah hubungan yang berkaitan dengan saling memengaruhi dengan kondisi salah satunya adalah akar atau asal dari sesuatu yang lain. Secara ringkas hubungan ini bermakna, sesuatu merupakan akar atau asal atau dasar dari sesuatu yang kemu_dian menjadi penjabaran dari sesuatu ini. Contoh yang bisa dibayangkan· dengan mudah adalah seperti pohon yang memiliki akar atau asal. Pokok batang yang merupakan akar kemudian akan menyebabkan munculnya banyak ranting, buah, dan dedaunan yang· banyak. Dalam menjelaskan hal ini dengan pembukaan dan batang tubuh UUD, maka pembukaan merupakan asal atau akar dari segala sesuatu yang ada di dalam batang tubuh UUD. Dengan demikian, maka semua pasal yang ada harus merupakan sesuatu yang berasal atau berakar dari nilai-nilai yang ada pada pembukaan UUD."}, {"id": 8, "question": "Amendemen adalah istilah yang digunakan untuk menggambarkan perubahan resmi yang dilakukan pada sebuah dokumen atau catatan resmi. Tujuan utamanya adalah untuk memperbaiki dokumen tersebut dengan menambahkan, menghapus, atau mengubah bagian yang tidak sesuai atau sudah tidak relevan lagi. Kondidi ini disebabkan oleh….", "choices": {"A": "Kedaulatan diberikan kepada para pemilih dalam pilpres langsung", "B": "Kedaulatan berada di tangan rakyat", "C": "Anggota legislatif menjadi pemegang kedaulatan, tidak lagi melekat pada institusi", "D": "Mahkamah. Konstitusi memiliki potensi yang lebih dalam memegang wewenang rakyat", "E": "Presiden memiliki kekuasaan tertinggi dalam hal pemerintahan"}, "correct": "B", "pembahasan": "Kedaulatan berada di tangan rakyat Mengenai kedaulatan rakyat di bawah MPR mengalami amandemen karena adanya dugaan terlalu besarnya kewenangan yang dimiliki oleh MPR. Hal ini memang tampak pada saat pemilihan Presiden dan Wakil Presiden. Pada zaman sebelum reformasi, terutama sekali di zaman Orde Baru pemilihan Presiden dilakukan oleh MPR yang berisikan mayoritas anggota dari partai   yang pro p◻merintah. Dengan arti kata lain, kewenangan MPR yang besar tersebut bisa saja menjadi sebuah kesepakatan atau mengalami pengaturan oleh calon Presiden. Atas adanya potensi yang tidak baik ini, maka kedaulatan yang dipegang oleh rakyat dikembalikan kepada rakyat. Salah satunya terimplementasi dalam pengadaan pemilihan umum terbuka dan bersifat langsung untuk memilih Presiden dan Wakil Presiden"}, {"id": 9, "question": "Pokok pikiran pertama pembukaan Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, \"Negara melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia dengan berdasar atas persatuan dengan mewujudkan keadilan sosial bagi seluruh rakyat indonesia\". Contoh perwujudannya adalah ….", "choices": {"A": "Pembangunan nasional di segala bidang", "B": "Pembentukan TNI dan Kepolisian", "C": "Pembentukan kementerian pertahanan", "D": "Adanya pendidikan bela negara", "E": "Adanya konsep wawasan nusantara"}, "correct": "B", "pembahasan": "Pembentukan TNI dan Kepolisian Undang-Undang Dasar 1945 merupakan landasan konstitusi bagi negara Indonesia yang memuat empat pokok pikiran atau alinea pembukaan, yang masing-masing mengandung cita-cita luhur dan filosofis bagi negara ini. Salah satu perwujudan dari pokok pikiran tersebut terdapat dalam frasa, \"Negara melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia dengan berdasar atas persatuan dengan mewujudkan keadilan sosial bagi seluruh rakyat Indonesia.\" Dalam konteks ini, implementasi dari cita-cita luhur tersebut adalah pembentukan Tentara Nasional Indonesia (TNI) dan Kepolisian Republik Indonesia sebagai upaya konkret untuk melindungi dan menjaga keamanan seluruh rakyat Indonesia. TNI dan Kepolisian memiliki peran penting dalam menjaga stabilitas, kedaulatan, dan keamanan negara, serta dalam mewujudkan keadilan sosial bagi seluruh lapisan masyarakat. Melalui peran TNI dan Kepolisian, negara bertindak sebagai pelindung dan penjaga bagi semua warga Indonesia, tanpa memandang perbedaan suku, agama, ras, atau golongan. Mereka bertugas untuk menegakkan hukum, melawan ancaman terhadap keamanan nasional, dan memberikan perlindungan kepada seluruh rakyat Indonesia. Dengan demikian, pembentukan TNI dan Kepolisian sebagai implementasi dari cita-cita luhur dalam Undang-Undang Dasar 1945 menegaskan komitmen negara Indonesia dalam melindungi keutuhan, keselamatan, dan kesejahteraan seluruh bangsa dan tumpah darah Indonesia."}, {"id": 10, "question": "Salah satu hal yang menyatukan bangsa adalah simbol-simbol seperti bendera, bahasa, lambang negara, dan lagu kebangsaan. Pengaturannya melalui undang-undang bertujuan untuk memperkuat kesatuan dan keutuhan Negara Kesatuan Republik Indonesia yaitu ….", "choices": {"A": "Menjaga kehormatan dan kedaulatan Negara Kesatuan Republik Indonesia", "B": "Menjaga kesatuan TNI dalam Negara Kesatuan Republik Indonesia", "C": "Menjaga wilayah perbatasan Negara Kesatuan Republik Indonesia", "D": "Menjaga pulau pulau terpencil dari pengakuan negara lain   E. Memberikan ldentitas bagi Negara Kesatuan Republik Indonesia"}, "correct": "E", "pembahasan": "Memberikan ldentitas bagi Negara Kesatuan Republik Indonesia Pasal 35 Undang-Undang Dasar Negara Republik Indonesia tahun 1945 menegaskan bahwa bendera negara Indonesia adalah Sang Saka Merah Putih. Dalam konteks ini, bendera tidak hanya menjadi lambang atau simbol visual dari negara Indonesia, tetapi juga merupakan salah satu identitas yang membedakan Indonesia dengan negara- negara lain. Bendera Sang Saka Merah Putih memiliki makna yang mendalam bagi bangsa Indonesia. Merah melambangkan keberanian dan semangat juang, sementara putih melambangkan kesucian dan keadilan. Bendera ini juga mengandung makna persatuan dan kesatuan, karena dua warna tersebut digabungkan secara harmonis dalam satu simbol yang kokoh dan berkibar dengan gagah. Sebagai salah satu identitas bangsa, bendera Sang Saka Merah Putih memainkan peran penting dalam memperkuat rasa kebangsaan dan kesatuan di antara seluruh warga Indonesia. Bendera ini tidak hanya berkibar sebagai lambang kebesaran dan kehormatan negara, tetapi juga menjadi pengingat akan sejarah perjuangan bangsa dan semangat persatuan dalam menghadapi tantangan masa depan. Dengan demikian, Pasal 35 UUD NKRI tahun 1945 yang menetapkan bendera Sang Saka Merah Putih sebagai bendera negara Indonesia menegaskan pentingnya bendera sebagai salah satu simbol yang mengikat dan mengidentifikasi bangsa Indonesia, serta sebagai sumber inspirasi bagi seluruh warga negara dalam menjaga persatuan, keberanian, kesucian, dan keadilan.   BHINNEKA TUNGGAL IKA � Pengertian Bhinneka Tunggal Ika Bhinneka Tunggal Ika berasal dari kitab Sutasoma karya Mpu Tantular pada masa Kerajaan Majapahit. Artinya: “Berbeda-beda tetapi tetap satu.” Makna filosofisnya: Bangsa Indonesia dapat terdiri dari banyak suku, agama, bahasa, adat, dan budaya — tetapi tetap satu dalam bingkai negara kesatuan, yaitu NKRI.  � B. Kedudukan Bhinneka Tunggal Ika dalam Sistem Ketatanegaraan Bhinneka Tunggal Ika merupakan salah satu pilar kebangsaan bersama: •  Pancasila  •  UUD 1945  •  NKRI  •  NKRI  •  Wawasan Nusantara  Secara formal, semboyan ini tercantum dalam: � Pasal 36A UUD 1945: “Lambang Negara ialah Garuda Pancasila, dengan semboyan Bhinneka Tunggal Ika.” � Makna Filosofis Bhinneka Tunggal Ika Dimensi  Penjelasan  Identitas Nasional  Menjadi ciri khas bangsa Indonesia yang majemuk  Integrasi Nasional  Menyatukan keberagaman menjadi kekuatan  Toleransi  Menghargai perbedaan tanpa memaksakan kehendak  Persatuan dalam Keberagaman  Perbedaan bukan ancaman, tetapi modal pembangunan bangsa  � Ruang Lingkup Keberagaman yang Diwadahi Konsep Bhinneka Tunggal Ika   Bidang  Contoh  Suku Bangsa  Jawa, Batak, Sunda, Minang, Bugis, Dayak, Papua, dll.  Agama & Kepercayaan  Islam, Kristen, Katolik, Hindu, Buddha, Konghucu, Penghayat Kepercayaan  Bahasa Daerah  Aceh, Jawa, Bali, Minang, Bugis, Madura, dll.  Budaya & Adat Istiadat  Upacara adat, pakaian adat, tarian daerah, seni, tradisi  Kondisi Geografis  Kepulauan: daratan, pegunungan, pesisir, pulau kecil  � E. Implementasi Bhinneka Tunggal Ika dalam Kehidupan � Bidang Pemerintahan •  Kebijakan otonomi daerah  •  Pemilu sebagai sarana integrasi nasional  •  Representasi wilayah melalui DPD  � Bidang Sosial dan Pendidikan •  Pendidikan karakter dan toleransi  •  Penguatan wawasan kebangsaan di sekolah dan ASN  •  Kurikulum multikultural  � Bidang Hukum •  Perlindungan HAM dan anti diskriminasi  •  Penegakan hukum tanpa melihat ras, agama, atau suku  •  Penjaminan kebebasan berpendapat  � Bidang Ekonomi •  Pemerataan pembangunan  •  Dana desa & afirmasi wilayah tertinggal  •  Keadilan sosial berdasarkan sila ke-5 Pancasila  � F. Tantangan Penerapan Bhinneka Tunggal Ika Saat Ini Tantangan  Dampak  Politik Identitas  Polarisasi sosial  EBOOK PERSIAPAN PREMIUM PERSIAPAN EBOOK PREMIUM SELEKSI CPNS 2025SKD CPNS 2026 Intoleransi  @INTENSIFCPNS  Konflik sektarian  Hoaks & ujaran kebencian Perpecahan dan disharmoni Kesenjangan ekonomi  Konflik antardaerah  Globalisasi budaya  Lunturnya identitas nasional  � G. Strategi Penguatan Bhinneka Tunggal Ika Strategi  Implementasi  Pendidikan multikultural  Kurikulum sekolah, diklat ASN  Penegakan hukum anti intoleransi  Mengurangi ujaran kebencian dan diskriminasi  Pemberdayaan masyarakat daerah  Pemerataan pembangunan  Penguatan nilai Pancasila  Melalui BPIP, ASN, dan lembaga pendidikan  Etika digital  Literasi media untuk cegah hoaks  � Peran ASN dalam Mengimplementasikan Bhinneka Tunggal Ika ASN wajib: ✔ Netral dari politisasi SARA  ✔ Memberikan pelayanan publik tanpa diskriminasi  ✔ Menjaga persatuan bangsa dalam setiap tindakan ✔ Menjunjung etika profesi, toleransi, dan integritas  ✔ Menempatkan kepentingan bangsa di atas kepentingan kelompok � Rangkuman Pokok Materi Inti Makna  Perbedaan tetap satu  Sumber  Kitab Sutasoma – Mpu Tantular  Kedudukan  Semboyan resmi negara dalam UUD 1945 Pasal 36A  Fungsi  Alat pemersatu bangsa  Relevansi  Identitas, toleransi, persatuan  Peran ASN  Pelayan publik yang menghormati keberagaman"}]}, "BHINNEKA TUNGGAL IKA": {"category": "TWK", "title": "BHINNEKA TUNGGAL IKA", "questions": []}, "GAGASAN UTAMA": {"category": "TIU", "title": "GAGASAN UTAMA", "questions": [{"id": 1, "question": "(1) Kreativitas merupakan sumber daya yang tidak terbatas dan inklusif. (2) Tidak terbatas karena semakin dimanfaatkan, kreativitas tidak akan habis, justru memantik munculnya kreativitaskreativitas baru. (3) Bersifat inklusif karena kreativitas merupakan hak milik semua orang. (4) Siapapun memiliki daya kreativitas, tak peduli batasan umur jenis kelamin tingkat pendidikan maupun kedudukan sosial. (5) Artinya, setiap orang berpeluang sama sebagai pelaku ekonomi kreatif. (6) Ekonomi kreatif bermula dari gebrakan Tony Blair pada tahun 1997 selaku Perdana Menteri Inggris yang   membentuk Department of Culture, Media and Sports (DCMS) dan melahirkan Creative Industries Task Force (Gugus Tugas Industri Kreatif). Sumber: Kompasiana Kalimat utama teks tersebut terdapat pada kalimat...", "choices": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "correct": "A", "pembahasan": "1 Materi Kalimat utama Secara umum, kalimat utama terbagi dalam tiga jenis, yakni deduktif, induktif, dan campuran."}, {"id": 2, "question": "(1) Kementerian Perhubungan (Kemenhub) mencatat kenaikan arus lalu lintas pada periode libur panjang di Hari Ulang Tahun Kemerdekaan ke-75 Republik Indonesia dan Tahun Baru Islam 1442 H. (2) Salah satu yang terlihat peningkatan arus kendaraan di Gerbang Tol Cikampek Utama. (3) Direktur Jenderal Perhubungan Darat Kemenhub, Budi Setiadi mengatakan, menurut data pihaknya, pada Gerbang Tol Cikampek Utama, tercatat bahwa pada periode normal jumlah kendaraan melintas sebanyak 27.514 kendaraan. (4) Namun, sejak Kamis (13/8/2020) total kendaraan menuju ke arah Trans Jawa sebanyak 30.208 kendaraan sementara pada Jumat (14/8/2020) hingga Sabtu (15/8/2020) sudah tercatat 45.104 kendaraan. (5) \"Artinya pada Jumat lalu ada kenaikan sebesar 64 persen dibandingkan lalu lintas harian normal, ujar Budi dalam keterangan tertulis, Minggu (16/8/2020). (6) Budi menambahkan, sejauh ini berdasarkan prediksi Kemenhub, puncak arus mudik pada periode libur panjang ini ada dua, yaitu Jumat, dan Rabu (19/8/2020) mendatang. Sumber: Okezone.com Gagasan pokok teks tersebut adalah …", "choices": {"A": "Kenaikan arus lalu lintas pada periode libur panjang di Hari Ulang Tahun Kemerdekaan ke-75 Republik Indonesia dan Tahun Baru Islam 1442 H.", "B": "Peningkatan arus kendaraan di Gerbang Tol Cikampek Utama.", "C": "Total kendaraan menuju ke arah Trans Jawa sebanyak 30.208 kendaraan.", "D": "Hari Ulang Tahun Kemerdekaan ke-75 Republik Indonesia dan Tahun Baru Islam 1442 H.", "E": "Puncak arus mudik pada periode libur panjang ini ada dua, yaitu Jumat dan Rabu (19/8/2020) mendatang"}, "correct": "A", "pembahasan": "Kenaikan arus lalu lintas pada periode libur panjang di Hari Ulang Tahun Kemerdekaan ke-75 Republik Indonesia dan Tahun Baru Islam 1442 H   Materi Menentukan gagasan pokok Gagasan pokok adalah ide yang mencerminkan keseluruhan bahasan teks. Pada teks tersebut gagasan pokok terdapat pada awal kalimat yaitu Kenaikan arus lalu lintas pada periode libur panjang di Hari Ulang Tahun Kemerdekaan ke-75 Republik Indonesia dan Tahun Baru Islam 1442 H dan kalimat-kalimat selanjutnya menjelaskan gagasan pokok tersebut."}, {"id": 3, "question": "(1) Perhimpunan Hotel dan Restoran Indonesia (PHRI) Banyuwangi mencatat okupansi kamar hotel di sana mencapai 90 persen, bahkan 100 persen pada libur panjang tahun baru Islam, Agustus 2020. (2) Menurut Ketua PHRI Banyuwangi Zaenal Muttaqin, wisatawan tak hanya menyerbu hotel berbintang, tetapi juga hotel melati dan homestay. (3) Banyuwangi dinilai sudah siap menerapkan pariwisata dengan konsep adaptasi kebiasaan baru (AKB) karena ada sertifikasi new normal di objek wisata hotel hingga tempat kuliner, ujar dia dilansir dari Antara, Sabtu (22/8/2020). (4) Zaenal melanjutkan, itulah yang membuat Banyuwangi diserbu para wisatawan, terutama saat libur panjang. (5) Adapun, imbuh dia, jumlah itu naik secara signifikan dibanding Juli 2020 yang mana okupansi hotel di Banyuwangi hanya 45 persen. (6) Okupansi hotel yang naik juga dibarengi peningkatan kunjungan wisatawan di objek-objek wisata Kabupaten Banyuwangi. Gagasan pokok pada teks tersebut adalah …", "choices": {"A": "Okupansi kamar hotel di Banyuwangi.", "B": "Liburan Tahun Baru Islam.", "C": "Kemacetan di Banyuwangi", "D": "Wisatawan di Banyuwangi", "E": "Peningkatan pengunjung hotel dan tempat wisata di Banyuwangi."}, "correct": "E", "pembahasan": "Peningkatan pengunjung hotel dan tempat wisata di Banyuwangi Materi : ide pokok Gagasan pokok atau yang biasa dikenal ide pokok adalah topik utama yang digunakan pada teks. Teks tersebut membahas peningkatan pengunjung hotel dan tempat wisata di Banyuwangi."}, {"id": 4, "question": "(1) Daun salam adalah tanaman herbal yang sering digunakan sebagai bumbu penyedap masakan karena memiliki aroma yang khas. (2) Ternyata, manfaat daun salam tidak sampai di situ saja. (3) Selain digunakan sebagai penyedap masakan, daun dan minyaknya juga berguna sebagai obat. (4) Berbagai manfaat daun salam untuk kesehatan di antaranya untuk mengatasi reumatik, mag, telat haid, sakit perut, ramuan penyejuk dan pembasmi kecoa. (5) Daun salam juga dapat digunakan sebagai salep rubefacient, yaitu zat penghangat yang berfungsi meningkatkan sirkulasi darah pada kulit. (6) Buah tanaman ini juga dapat digunakan untuk menyembuhkan fibroid rahim, sirosis dan nyeri sendi. (7) Manfaat daun salam lainnya adalah untuk menurunkan gula darah. (8) Kandungan zat polifenol semacam antioksidan dalam ekstrak daun tersebut dipercaya para peneliti dapat menurunkan jumlah gula darah bagi orang yang memiliki diabetes. (9) Zat ini juga mampu meningkatkan kadar kolestrol baik dalam darah, sehingga mencegah komplikasi penyakit jantung yang sering kali menyerang pasien dengan diabetes. Sumber: hallosehat.com   Gagasan utama yang tepat untuk bacaan di atas ialah....", "choices": {"A": "Cara pengolahan daun salam", "B": "Manfaat daun salam", "C": "Dosis daun salam untuk dewasa", "D": "Efek samping penggunaan daun salam", "E": "Terdapat berbagai jenis daun salam"}, "correct": "B", "pembahasan": "Manfaat daun salam Materi Gagasan utama Gagasan utama bacaan di atas secara jelas terlihat bahwa selain dijadikan bumbu penyedap masakan ternyata memiliki manfaat yang baik untuk kesehatan. Terlihat pada kalimat 2 yang menyatakan sebagai gagasan utama."}, {"id": 5, "question": "Naegleria fowleri adalah jenis ameba berbahaya yang bisa mengakibatkan kematian kepada manusia.Melansir WebMD, ameba ini hidup di air tawar yang hangat atau air kotor yang terkontaminasi. Saat masuk ke dalam tubuh manusia, ameba ini akan menyebabkan infeksi dan inflamasi pada otakyang akan menyebabkan jaringan otak rusak. Itu lah kenapa ameba ini disebut dengan ameba pemakanotak. Menurut Centers for Disease Control and Prevention (CDC), kamu tidak akan terinfeksi ameba inidengan cara meminum air yang terkontaminasi, melainkan melalui hidung. Infeksi ameba Naegleria fowleri umumnya terjadi saat seseorang berenang atau menyelam di tempatair tawar yang hangat seperti danau dan sungai. Ameba ini kemudian naik ke otak melalui hidung danakan 'memakan' otak manusia. Sumber : idntimes.com Apa inti dari paragraf kedua?", "choices": {"A": "Potensi infeksi dan inflamasi otak.", "B": "Akibat terinfeksi ameba naegleria fowleri.", "C": "Pengertian ameba naegleria fowleri.", "D": "Penyebab masuknya ameba melalui hidung.", "E": "Nama lain dari naegleria fowleri."}, "correct": "A", "pembahasan": "Potensi infeksi dan inflamasi otak. Berdasarkan teks, paragraf ketiga menyatakan bahwa kamu tidak akan terinfeksiameba ini dengan cara meminum air yang terkontaminasi, melainkan melaluihidung. Oleh karena itu masuknya ameba ini melalui hidup menjadi penyebabterinfeksinya seseorang. Pada paragraf kedua dijelaskan bahwa jika ameba ini masukpada tubuh manusia maka akan menyebabkan infeksi dan inflamasi otak. Sehinggapilihan jawaban yang paling tepat adalah A. Pilihan B salah karena akibat dari terinfeksinya ameba dijelaskan di paragraf kedua. Pilihan C salah karena pengertian ameba naegleria fowleri dijelaskan di paragrafkesatu. Pilihan D salah karena tidak dijelaskan dalam teks. Pilihan E salah karena tidak dijelaskan dalam teks."}, {"id": 6, "question": "Fungsi pendidikan adalah serangkaian tugas ataupun misi yang diemban dan dilaksanakan olehpendidikan. Dari pengertian ini dapat dijelaskan, bahwa sesungguhnya kegiatan atau praktik pendidikandimanapun bukanlah kegiatan tanpa makna dan tujuan yang jelas. Dalam kegiatan pendidikan tersiratsuatu tugas atau misi yang harus diwujudkan. Oleh   karena itu, para pendidik, pengelola pendidikan,dan pihak-pihak yang terlibat dalam kegiatan pendidikan seharusnya selalu menyadari akan tugas ataumisi kegiatan pendidikan yang dilaksanakan atau yang dikelolanya. Dari segi kultural dan sosial, fungsi pendidikan adalah menumbuhkan kreativitas subjek didik;menjaga kelestarian nilai-nilai insaniah dan ilahiah; serta menyiapkan tenaga kerja produktif.Sementara itu, Bock mengatakan bahwa peran pendidikan adalah memasyarakatkan ideologi dan nilainilai sosio-kultural bangsa; mempersiapkan tenaga kerja untuk memerangi kemiskinan, kebodohan,dan mendorong perubahan sosial serta memeratakan kesempatan dan pendapatan. Dari sumbertersebut jelas bahwa kegiatan atau praktik pendidikan memiliki tugas bukan hanya menjadikan pesertadidik tumbuh dan berkembang potensi atau kemampuannya, melainkan juga menjaga danmelestarikan nilai-nilai yang dianggap baik dan benar oleh masyarakat dan bangsa serta menyiapkanpeserta didik menjadi tenaga kerja produktif. Di pihak lain, fungsi pendidikan nasional adalahmengembangkan kemampuan dan membentuk watak serta peradaban bangsa yang bermartabatdalam rangka mencerdaskan bangsa. Gagasan utama paragrap ke 2 teks tersebut adalah ….", "choices": {"A": "Fungsi pendidikan dari segi kultural dan sosial adalah menumbuhkan kreativitas subjek peserta didik serta menyiapkan tenaga kerja produktif.", "B": "Fungsi pendidikan adalah memasyarakatkan ideologi dan nilai sosiokultural, mempersiapkan tenaga kerja", "C": "Fungsi pendidikan adalah menumbuhkan kreativitas, melestarikan nilai-nilai, dan menyiapkan tenaga kerja.", "D": "Fungsi pendidikan adalah melestarikan nillai yang baik dan benar,serta menyiapkan peserta didik menjadi tenaga kerja", "E": "Fungsi pendidikan adalah melestarikan nilai-nilai bangsa dan menyiapkan peserta didik menjadi tenaga kerja produktif."}, "correct": "A", "pembahasan": "Fungsi pendidikan dari segi kultural dan sosial adalah menumbuhkan kreativitas subjek peserta didik serta menyiapkan tenaga kerja produktif. Materi : Ide Pokok Gagasan utama paragraf kedua adalah Fungsi pendidikan dari segi kultural dan sosial adalah menumbuhkan kreativitas subjek didik serta menyiapkan tenaga kerja produktif."}, {"id": 7, "question": "(1) Mahkamah Konstitusi (MK) menolak permohonan pengujian UU Nomor 7/2017 tentangPemilihan Umum yang mensoal pelaksanaan Pemilu serentak menyebabkan banyak petugas menjadikorban. (2) Sebab dengan memisah pemilu serentak malah melanggar konstitusi. Hakim Konstitusi, SaldiIsra mengatakan, Mahkamah Konstitusi (MK) berpendirian pemisahan pemilu presiden-wakil presidendengan pemilihan legislatif pusat bertentangan dengan UUD 1945. (3)\"Mahkamah berpendirian bahwapemilihan umum presiden dan wakil presiden dengan pemilihan umum anggota legislatif yangkonstitusional adalah yang dilaksanakan secara serentak,\" kata Saldi sebagaimana dikutip dari Antara,Kamis   (27/2/2020). (4) Meski pemohon memberikan bentangan empirik yang terjadi dalam PemiluSerentak 2019, Mahkamah Konstitusi (MK) menilai hal itu masih belum cukup dan persoalan pilkadaserentak tidak sesederhana itu. Ide pokok yang tepat untuk bacaan di atas ialah....", "choices": {"A": "Penolakan Pemilu", "B": "Banyak korban dalam Pemilu", "C": "Surat keputusan Pemilu serentak", "D": "Keputusan MK tentang Pemilu serentak", "E": "Pemilu serentak membahayakan"}, "correct": "D", "pembahasan": "Keputusan MK tentang Pemilu serentak Materi : Ide Pokok Ide pokok adalah inti dari bacaan yang tersaji. Opsi D sesuai denganbacaan di atas karena bacaan di atas membahas keputusan MK yang menolakpermohonan pengujian UU tentang Pemilu serentak."}, {"id": 8, "question": "Etnis Sasak, Lombok, Nusa Tenggara Barat, memiliki kekayaan seni budaya yang beragam. Salah satu di antaranya adalah naskah lontar atau takepan yang masih banyak disimpan masyarakat. Naskah lontar antar lain berisi ajaran akhlak, cerita, falsafah, upacara adat, keagamaan, dan solidaritas sosial. Naskah ini beraksara Jawa Kuno, Jawa, Bali, dan Sasak atau Jejawan. Keberadaan naskah ini kemudian melahirkan tradisi membaca naskah lontar. Tradisi membaca naskah lontar biasanya diselenggarakan pada acara tertentu, seperti khitanan, ngurisang atau potong rambut pada anak balita, dan pernikahan. Naskah yang dibacakan pada beragam acara tersebut disesuaikan dengan permintaan si empunya hajat. Ide pokok bacaan tersebut adalah...", "choices": {"A": "Kekayaan budaya Lombok.", "B": "Membaca naskah lontar sebagai tradisi di Lombok.", "C": "Pembaca lontar yang populer di lombok.", "D": "Isi naskah lontar Lombok.", "E": "Perlunya pelestarian naskah lontar Lombok."}, "correct": "B", "pembahasan": "Membaca naskah lntar sebagai tradisi di Lombok Materi Ide Pokok Ide pokok atau topik utama yang dibahas dalam bacaan tersbeut adalah tentang membaca naskah lontar sebagai tradisi di Lombok."}, {"id": 9, "question": "(1) Flu burung adalah s
