daraan online untuk menjemputnya di stasiun, maka opsi B memiliki poin yang paling besar. Sedangkan opsi A hanya menyelesaikan satu permasalahan dan tidak memberilcan solusi di permasalahan yang lain.   JEJARING KERJA Secara sederhana, jejaring kerja (networking) adalah proses membangun dan memelihara hubungan profesional dengan orang lain. Tujuannya adalah untuk saling berbagi informasi, bertukar ide, mencari peluang, dan mendapatkan dukungan. Jejaring kerja bukan sekadar mengumpulkan banyak kenalan, tetapi lebih kepada membangun hubungan yang saling menguntungkan dan bermakna. Dalam dunia profesional, jejaring kerja dapat terjadi secara: Internal: Membangun hubungan dengan rekan kerja, atasan, dan bawahan di dalam satu perusahaan. Eksternal: Membangun hubungan dengan individu dari perusahaan atau industri lain, seperti klien, vendor, dan rekan sejawat. Manfaat Utama Jejaring Kerja Membangun jejaring kerja yang kuat memiliki banyak manfaat, baik untuk karier maupun pengembangan diri. Berikut adalah beberapa manfaat utamanya: Peluang Karier: Banyak lowongan pekerjaan tidak diiklankan secara terbuka. Jejaring kerja bisa menjadi sumber informasi eksklusif tentang peluang kerja, promosi, atau proyek baru. Pengembangan Diri: Dengan terhubung dengan para ahli di bidang Anda, Anda bisa belajar keterampilan baru, mendapatkan wawasan industri, dan mendapatkan bimbingan (mentorship) untuk mengembangkan diri. Mendapatkan Informasi dan Tren: Jejaring kerja memungkinkan Anda untuk tetap terinformasi tentang perkembangan, tren, dan tantangan terbaru di industri Anda. Meningkatkan Kepercayaan Diri: Berinteraksi dengan banyak orang dari berbagai latar belakang bisa meningkatkan kemampuan komunikasi dan kepercayaan diri Anda. Membangun Reputasi Profesional: Ketika Anda aktif dan dikenal di jejaring profesional, Anda akan dianggap sebagai individu yang kredibel dan dapat diandalkan."}]}, "JEJARING KERJA": {"category": "TKP", "title": "JEJARING KERJA", "questions": [{"id": 1, "question": "Suatu ketika, perusahaan menugaskan Anda dan beberapa rekan untuk melakukan survei di suatu daerah. Tim terdiri dari berbagai latar belakang dan keahlian, mencerminkan keragaman dalam menyusun strategi survei yang komprehensif. Salah satu anggota tim adalah seorang ibu hamil yang dengan sukarela ingin terlibat dalam proyek tersebut. Namun, kondisi kehamilannya membuatnya mengalami beberapa keterbatasan fisik yang mempengaruhi kinerja tim secara keseluruhan. Terkait hal tersebut, Anda akan….", "choices": {"A": "Mengapresiasi rekan tersebut karena bersemangat kerja meski sedang hamil, serta memotivasi semua anggota tim tanpa terkecuali.", "B": "Memaklumi hal tersebut sebagai hal yang tidak dapat dihindari dan merupakan bagian dari pekerjaan.", "C": "Memastikan untuk sering-sering mengecek kondisi rekan yang hamil tersebut dengan tidak lupa menyemangati anggota tim lainnya.", "D": "Meminta rekan yang sedang hamil tersebut untuk meningkatkan tempo kerjanya karena sudah merupakan risiko ketika mengambil pekerjaan ini.   E. Menerima hal tersebut sebagai konsekuensi yang tidak dapat dihindari dan berusaha meringankan pekerjaan rekan yang sedang hamil tersebut."}, "correct": "A", "pembahasan": "Mengapresiasi rekan tersebut karena bersemangat kerja meski sedang hamil, serta memotivasi semua anggota tim tanpa terkecuali. Urutan Skor Tertinggi - Rendah = ACEBD Soal tersebut menguji kemampuan Anda dalam membangun dan membina hubungan, bekerja sama, berbagi informasi, dan berkolaborasi dengan orang lain secara efektif, yang merupakan bagian penting dari jejaring kerja. Dalam kerja sama dengan orang lain, penting untuk menghindari diskriminasi dalam bentuk apapun. Rekan yang hamil yang mengikuti kegiatan tersebut atas dasar kesadarannya sendiri layak diapresiasi atas semangatnya dalam bekerja meskipun sedang mengandung. Sebagai anggota tim, penting bagi Anda untuk sesekali memastikan kondisinya, tetapi tidak perlu berlebihan dalam melakukannya. Yang terpenting adalah menjaga komunikasi terbuka dan saling mendukung dalam menyelesaikan tugas tanpa membuat rekan Anda merasa terbebani."}, {"id": 2, "question": "Akan diadakan acara sambutan untuk anggota dewan direksi perusahaanperusahaan yang menjadi relasi bagi perusahaan tempat Anda bekerja. Pada pelaksanaan acara tersebut Anda ditunjuk sebagai ketua panitianya. Dalam rapat kepanitiaan, Anda menyampaikan beberapa ide untuk melakukan siaran langsung acara itu di akun media sosial milik perusahaan demi memperkenalkan perusahaan beserta berbagai afiliasinya kepada masyarakat luas, sehingga akan meningkatkan citra perusahaan. Namun anggota panitia lain menolak dan menganggap bahwa saran Anda itu tidak bisa diterapkan, dikarenakan apabila terjadi kesalahan saat siaran berlangsung maka justru akan berdampak merusak citra perusahaan Anda. Maka Anda akan ...", "choices": {"A": "Menghargai pendapat rekan-rekan panitia, tetapi akan tetap melaksanakan siaran langsung tersebut setelah mempertimbangkan berbagai risikonya.", "B": "Mengurungkan niat untuk melakukan siaran langsung dan mencari ide lain yang sesuai dengan kritik dan saran dari anggota panitia.", "C": "Tetap melaksanakan ide tersebut setelah mendiskusikan solusi bersama rekan panitia untuk mengurangi berbagai risiko yang mungkin dihadapi.", "D": "Tetap melaksanakan ide tersebut, karena menurut Anda ide yang Anda sampaikan merupakan ide terbaik dan sudah melalui pertimbangan matang.", "E": "Berusaha meyakinkan para anggota panitia bahwa ide yang Anda usulkan memiliki lebih banyak dampak positif daripada dampak negatifnya."}, "correct": "C", "pembahasan": "Tetap melaksanakan ide tersebut setelah mendiskusikan solusi bersama rekan panitia untuk mengurangi berbagai risiko yang mungkin dihadapi. Urutan Skor Tertinggi - Rendah = CABED   Soal tersebut menguji aspek jejaring kerja dengan tujuan: menunjukkan kemampuan membangun dan membina hubungan, bekerja sama, berbagi informasi dan berkolaborasi dengan orang lain secara efektif. Tunjukkan bahwa Anda mampu berkolaborasi dan membangun kerja sama kelompok yang baik. Salah satu ciri yang menunjukkan Anda memiliki kemampuan bekerja sama yang baik adalah menghargai serta menerima pendapat rekan-rekan Anda, karena bagaimanapun Anda tidak bekerja sendirian dalam kelompok tersebut. Berkaitan dengan ide Anda tersebut, merupakan hal yang baik memanfaatkan sosial media sebagai media promosi bagi perusahaan Anda karena mengedepankan aspek TIK. Oleh karena itu, tetap gunakan ide tersebut setelah mempertimbangkan berbagai risiko yang mungkin dihadapi dan mencari solusi untuk mengurangi risiko tersebut."}, {"id": 3, "question": "Sebagai seorang pemimpin tentunya Anda harus dapat menjadi role model bagi seluruh karyawan Anda. Sikap Anda dalam mengambil keputusan harus diperhitungkan agar dapat menguntungkan semua yang terlibat dan tidak menjatuhkan satu belah pihak. Khususnya dalam mengatasi konflik, Anda harus menjadi seorang pemimpin yang adil dan membuat siapapun yang bekerja di bawah Anda merasa aman dan nyaman. Suatu hari terdapat dua pegawai Anda yang konflik karena perbedaan pendapat atas suatu hal. Perbedaan pendapat ini mengakibatkan kerugian material yang cukup besar bagi perusahaan. Anda sebenarnya tahu siapa yang menurut Anda salah, dan siapa yang menurut Anda benar. Sebagai seorang pemimpin apa yang akan Anda lakukan?", "choices": {"A": "Melakukan evaluasi untuk menentukan pihak yang salah berdasarkan SOP.", "B": "Menghukum pihak yang salah agar tidak mengulanginya kembali.", "C": "Mengundang petinggi lain untuk ikut serta dalam menentukan sikap.", "D": "Menyarankan pada pihak yang salah agar meminta maaf kepada pihak yang lain.", "E": "Menengahi permasalahan dengan menjadi mediator dan tidak menyudutkan kedua belah pihak."}, "correct": "E", "pembahasan": "Menengahi permasalahan dengan menjadi mediator dan tidak menyudutkan kedua belah pihak Dalam menjawab soal yang menguji aspek jejaring kerja, Anda perlu menunjukkan kemampuan membangun hubungan yang baik dengan orang lain, bekerja sama secara efektif, berbagi informasi, dan berkolaborasi dengan baik. Selain itu, sebagai pemimpin, Anda juga harus menunjukkan sikap profesionalisme. Ini berarti Anda tidak mengambil pihak atau menyalahkan orang lain tanpa alasan yang jelas. Sebaliknya, Anda harus bisa menjadi mediator yang baik, artinya Anda dapat menengahi konflik dengan adil dan bertindak sebagai penengah yang bisa membantu mencapai kesepakatan yang baik untuk semua pihak yang terlibat. Dengan cara ini, Anda menunjukkan kemampuan kepemimpinan yang membangun dan menjaga hubungan yang positif di lingkungan kerja."}, {"id": 4, "question": "Pada rapat yang akan diadakan tanggal 30 Desember di perusahaan tempat Anda bekerja, Anda diminta untuk memberikan kata sambutan untuk investor asing pada acara rapat oleh pimpinan. Sebagian besar dari investor yang akan hadir berasal dari negara China. Pimpinan Anda meminta   untuk mempersiapkan kata sambutan menggunakan bahasa Inggris dan bahasa Mandarin. Karena CV saat melamar pekerjaan di perusahaan Anda menuliskan kemampuan bahasa yang Anda kuasai merupakan bahasa Inggris dan bahasa Mandarin, maka pimpinan memilih Anda sebagai pembuka acara rapat tersebut. Sudah lima tahun Anda bekerja dan hampir tidak memakai bahasa mandarin dalam pekerjaan, Anda sudah mulai lupa bahasa tersebut, sedangkan waktu yang diperlukan untuk mempersiapkan hanya tersisa dua hari saja. Lalu apa yang akan Anda lakukan?", "choices": {"A": "Menolak perintah pimpinan karena saya merasa sangat gugup jika harus berhadapan dengan orang asing.", "B": "Membuka buku-buku mandarin yang ada dan berlatih mulai dari dasar, demi membangun relasi dengan orang asing.", "C": "Berlatih kembali bahasa Mandarin yang dulu pernah saya pelajari, dengan berfokus pada kalimat sambutan saja.", "D": "Menyarankan orang pengganti saya, saya takut mengecewakan pimpinan karena sudah lama tidak menggunakan bahasa itu lagi.", "E": "Meminta bantuan teman saya yang ahli dalam bahasa Mandarin untuk membuat kata sambutan, kemudian saya hanya perlu menghafal"}, "correct": "C", "pembahasan": "Berlatih kembali bahasa Mandarin yang dulu pernah saya pelajari, dengan berfokus pada kalimat sambutan saja. Urutan Skor Tertinggi - Rendah = CBEDA Soal tersebut menguji aspek kemampuan bekerja mandiri sampai tuntas. Kemampuan bekerja mandiri sampai tuntas merupakan bentuk tanggung jawab. Oleh karena itu, di tes TKP CPNS juga diuji aspek tanggung jawabnya dengan tujuan mengukur tingkat kedewasaan seseorang dalam mempertanggungjawabkan dari apa yang telah dilakukannya. Indikasi hal tersebut adalah mampu menanggung risiko dari tindakan yang telah diperbuat, baik selaku tindakan pribadi atau tindakan yang dilakukan oleh anggota tim yang berada di bawah wewenangnya. Tanggung jawab ini merupakan karakter yang harus dimiliki oleh setiap pegawai, terutama pegawai yang bekerja di lingkungan publik, karena setiap tindakannya memiliki dampak bagi orang banyak, misalnya bagi karyawan lainnya, bagi perusahaan/instansi tempat bekerja, atau bagi orang yang membutuhkan jasa/pelayanan Anda. Poin jawaban tertinggi ada pada jawaban yang menunjukkan bahwa Anda memiliki motivasi yang tinggi untuk berkembang serta tidak lupa akan kewajiban Anda dengan tetap mengerjakan pekerjaan Anda sebaik mungkin. Mampu memanajemen waktu dengan baik serta mampu bekerja mandiri merupakan kunci dari persoalan tersebut. Perbedaan dengan jawaban yang memiliki poin 4 adalah dalam mengerjakan tugas tersebut Anda masih memerlukan bantuan dari orang lain serta kurang mampu bekerja secara mandiri. Dan mengabaikan salah satu dari kedua kewajiban Anda merupakan hal yang salah. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda menyerah sebelum mencoba. Dengan menolak perintah dari atasan Anda, sikap kurang memiliki sikap profesionalitas dalam bekerja. Karena Anda merasa kurang yakin dengan kemampuan diri Anda sendiri Anda tidak mau berusaha untuk mencoba mengambil kesempatan yang diberikan untuk mengembangkan kemampuan yang Anda miliki sebelumnya."}, {"id": 7, "question": "Anda baru bergabung dengan perusahaan impian Anda dan langsung dimasukkan ke dalam tim untuk menjalankan proyek yang akan dilaksanakan bulan depan. Namun, Anda merasa kesulitan karena ini adalah pengalaman pertama Anda dalam bekerja. Saat Anda bersiap-siap untuk proyek tersebut, Anda melihat bahwa anggota-anggota tim terlihat kurang antusias dan tampak bermalas-malasan. Bahkan, ketua tim juga terlihat tidak terlalu peduli dengan semangat dan kinerja tim. Maka yang akan Anda lakukan?", "choices": {"A": "Menyarankan pada ketua tim untuk membahas hal ini dengan baikbaik bersama tim dan mengajak mereka ikut berkontribusi bersamasama.   B. Melaporkan hal ini pada atasan agar beliau tahu bagaimana keadaan tim tersebut dan bisa memutuskan tindakan yang benar.", "C": "Membuat laporan pada atasan tentang sikap anggota tim dan ketua tim dan meminta beliau untuk menggantinya.", "D": "Mengajak mereka dan memberi mereka semangat agar mau bekerja keras dalam menjalankan proyek ini.", "E": "Agar waktu persiapan tidak terbuang sia-sia, maka Anda akan mengerjakan pekerjaan itu sebisa mungkin sendirian."}, "correct": "A", "pembahasan": "Menyarankan pada ketua tim untuk membahas hal ini dengan baik-baik bersama tim dan mengajak mereka ikut berkontribusi bersama-sama. Urutan Skor Tertinggi - Rendah = ADBCE Soal tersebut menguji aspek bekerja sama dalam kelompok. Bekerja sebagai PNS adalah bentuk pengabdian kepada negara. Pekerjaan tersebut banyak dilakukan secara bersama-sama, diambil keputusan bersama, dan dibuat kebijakan untuk semua. Kemampuan seorang CPNS bekerja sama dalam kelompok diuji tahap awal pada tes TKP CPNS dalam aspek bekerja sama dalam kelompok. Aspek Jejaring Kerja dengan tujuan: menunjukkan kemampuan membangun dan membina hubungan, bekerja sama, berbagi informasi dan berkolaborasi dengan orang lain secara efektif. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda membangun kerja sama tim yang baik. Poin terendah ada pada jawaban yang menunjukkan bahwa anda tidak mampu membangun kinerja tim dan menyelesaikan seorang diri tugas yang seharusnya dikerjakan bersama tim."}, {"id": 9, "question": "Dian ditunjuk oleh pihak manajemen di sebuah kementerian untuk membentuk kelompok kerja dengan tugas yang sangat rahasia. Sebelum mulai bekerja, setiap anggota menandatangani pakta integritas untuk tidak mengungkapkan informasi kepada siapapun. Masing-masing anggota memiliki tugas yang spesifik dengan cara dan aturan kerja yang sama. Pada   waktu yang telah ditentukan, mereka berkumpul untuk memberikan laporan capaian target. Namun, dalam proses tersebut, ada seorang anggota yang melanggar pakta integritas dengan menceritakan pekerjaannya kepada pasangannya yang kebetulan menelepon dan menanyakan tentang pekerjaan yang sedang dilakukan. Tindakan yang sebaiknya diambil oleh Dian untuk anggota yang melanggar pakta integritas adalah ...", "choices": {"A": "Mengingatkan kembali kepada semua anggota tim yang sudah tergabung dalam proyek rahasia ini untuk tetap komitmen pada pakta integritas dan setiap pelanggaran akan mendapatkan konsekuensi sesuai dengan kesepakatan.", "B": "Memberikan teguran dan mengingatkan kembali kepada anggota tim akan pernyataan yang dibuat bersama dalam pakta kntegritas serta meminta yang bersangkutan konsisten pada kesepakatan tersebut.", "C": "Menegur dan menunjukkan pelanggaran lntegritas yang telah dia lakukan agar dia bisa sadar bahwa kesepakatan itu harus dljaga secara komitmen dan tldak boleh dilanggar pada kondisi apapun.", "D": "Saya yakin orang tersebut sudah dewasa yang semestinya tahu apa yang harus dia lakukan sehingga saya hanya perlu mengingatkan sekedarnya saja kepada anggota yang melanggar tersebut.", "E": "Mengingatkan lagi dan meminta semua anggota untuk membaca kembali pakta lntegritas yang sudah disepakati bersama"}, "correct": "C", "pembahasan": "Menegur dan menunjukkan pelanggaran lntegritas yang telah dia lakukan agar dia bisa sadar bahwa kesepakatan itu harus dljaga secara komitmen dan tldak boleh dilanggar pada kondisi apapun. Urutan Skor Tertinggi - Rendah = CABED Dian bertanggung jawab untuk menjaga integritas dan profesionalisme di dalam timnya. Ketika seorang anggota melanggar pakta integritas dengan menceritakan pekerjaannya kepada pasangannya, Dian harus segera menegur anggota tersebut. Tindakan ini penting untuk menunjukkan bahwa kesepakatan yang telah dibuat harus dipegang dengan komitmen, dan pelanggaran tidak dapat diterima dalam kondisi apa pun. Oleh karena itu, jawaban pada opsi C adalah solusi terbaik. Opsi A dan B juga dapat menjadi solusi, namun kurang tepat karena dalam kasus tersebut Dian menegur dan mengingatkan seluruh anggota tim, sedangkan pelanggaran sebenarnya dilakukan oleh satu anggota tim saja"}, {"id": 10, "question": "Anda baru saja dipindahkan ke kantor cabang baru dari perusahaan Anda dan ditempatkan sebagai atasan di sana. Anda diberikan tanggung jawab yang lebih besar daripada sebelumnya dan diharapkan untuk mencapai tujuan perusahaan di kantor cabang baru tersebut guna mengembangkan perusahaan. Namun, cabang baru tersebut didominasi oleh karyawankaryawan baru dari daerah yang belum memiliki pengalaman sebelumnya, yang Anda lakukan adalah ….", "choices": {"A": "Mendorong pegawai kantor tersebut untuk semangat dalam menjalankan pekerjaan mereka.", "B": "Menguatkan karisma yang saya miliki untuk mendorong mereka lebih bersemangat dalam bekerja.", "C": "Mengadakan pelatihan yang dapat memampukan pegawai kantor meningkatkan kinerja mereka sesuai dengan keahlian.   D. Mengajukan adanya pengadaan diktat untuk karyawan kantor yang mau agar lebih berwawasan.", "E": "Mengajukan adanya pengadaan pelatihan yang berhubungan dengan upaya pencapaian target perusahaan."}, "correct": "C", "pembahasan": "Mengadakan pelatihan yang dapat memampukan pegawai kantor meningkatkan kinerja mereka sesuai dengan keahlian. Urutan Skor Tertinggi - Rendah = CEDAB Soal tersebut menyoroti pentingnya membangun jejaring dan memprioritaskan kepentingan perusahaan sesuai dengan peraturan yang berlaku. Sebagai seorang pemimpin yang ditugaskan di kantor cabang baru, langkah terbaik yang dapat diambil adalah mengadakan pelatihan atau diklat untuk karyawan baru yang belum memiliki pengalaman. Ini bertujuan agar para karyawan dapat memiliki standar kompetensi yang baik sehingga dapat meningkatkan kinerja mereka. Oleh karena itu, solusi yang paling tepat untuk situasi ini adalah opsi C.   TEKNOLOGI INFORMASI DAN KOMUNIKASI Dalam dunia kerja modern, Teknologi Informasi dan Komunikasi (TIK) telah menjadi pilar utama yang tak terpisahkan dari setiap aspek bisnis. TIK bukan lagi sekadar alat pendukung, melainkan inti dari operasional, kolaborasi, dan inovasi. Memahami materi ini secara mendalam sangat penting bagi siapa pun yang ingin sukses di era digital. I. Konsep Dasar TIK dalam Dunia Kerja"}]}, "TEKNOLOGI INFORMASI DAN KOMUNIKASI": {"category": "TKP", "title": "TEKNOLOGI INFORMASI DAN KOMUNIKASI", "questions": [{"id": 1, "question": "Dengan diterapkannya work from home (WFH), maka Anda dan para pekerja mengubah metode rapat atau diskusi tim secara virtual. Awalnya semua berjalan dengan lancar, tetapi akhir-akhir ini Anda sering mendapat keluhan dari pimpinan rapat yang masih buta teknologi bahwa seringkali anggotanya itu ikut bergabung dalam rapat virtual tetapi tidak benar-benar hadir untuk memperhatikan dengan sungguh-sungguh isi rapat tersebut. Banyak yang berbuat curang dalam rapat virtual tersebut tetapi mereka tidak menyadarinya karena tidak tahu apa yang harus mereka lakukan untuk membedakan mana yang sungguh-sungguh dan yang berbuat curang. Sebagai pimpinan, maka yang akan Anda lakukan ....", "choices": {"A": "Menyuruh mereka untuk memberikan peringatan kepada anggota rapat sebelumnya agar mereka tidak melakukan kecurangan atau mereka akan mendapatkan sanksi.", "B": "Anda akan mengikuti setiap rapat atau diskusi untuk mengawasi sendiri jalannya rapat karena Anda tahu mana yang berbuat curang dan mana yang tidak.", "C": "Hal itu adalah hal yang biasa, jadi tidak perlu dipermasalahkan karena di tempat lain juga seperti itu.", "D": "Melakukan kegiatan seminar secara virtual tentang cara penggunakan aplikasi untuk rapat virtual agar para pegawai yang masih kesulitan bisa segera paham dan tahu apa yang harus mereka lakukan.", "E": "Memberikan pelatihan terkait sistem rapat virtual dan aplikasi yang digunakan, serta mengatur sistem rekam layar agar Anda tahu kinerja pegawai saat melakukan rapat virtual."}, "correct": "E", "pembahasan": "Memberikan pelatihan terkait sistem rapat virtual dan aplikasi yang digunakan, serta mengatur sistem rekam layar agar Anda tahu kinerja pegawai saat melakukan rapat virtual. Urutan Skor Tertinggi - Rendah = EDABC Soal tersebut mengevaluasi kemampuan Anda dalam memanfaatkan teknologi informasi dan komunikasi secara efektif untuk meningkatkan kinerja. Poin tertinggi akan diberikan kepada jawaban yang menunjukkan bahwa Anda mencari solusi dengan menggunakan teknologi informasi dan komunikasi untuk menyelesaikan masalah yang dihadapi. Sebaliknya, poin terendah akan diberikan kepada jawaban yang menunjukkan bahwa Anda tidak memperhatikan atau tidak peduli terhadap masalah di sekitar Anda."}, {"id": 2, "question": "Anda pernah secara tidak sengaja menghapus data penting dan tidak tahu cara mengembalikannya sehingga Anda harus bekerja ulang. Selain kejadian itu, Anda juga pernah kehilangan file karena laptop Anda terkena   virus dan tidak bisa digunakan. Karena kejadian itu akhirnya Anda selalu menyimpan data di komputer perusahaan. Tetapi, rekan-rekan Anda sering mengatakan bahwa itu lebih berbahaya karena sedang marak pencurian data di komputer. Maka yang akan Anda lakukan adalah ....", "choices": {"A": "Menanyakan hal ini kepada atasan dan meminta saran tentang apa yang harus Anda lakukan, sehingga ketika terjadi pencurian Anda tidak dipersalahkan.", "B": "Mencetak semua data-data penting dan menghapus data yang ada di komputer agar lebih aman dan pencuri tidak bisa menemukan data yang diinginkan.", "C": "Menyimpan data-data di dalam folder yang sulit untuk dicari, seperti menggunakan nama yang berbeda.", "D": "Membuat kata sandi untuk bisa memasuki folder tempat Anda menyimpan data-data penting.", "E": "Membackup file ke email Anda atau perusahaan dan menggunakan enkripsi (secure data) pada internal folder agar pencuri tidak dapat membaca data yang ada."}, "correct": "E", "pembahasan": "Membackup file ke email Anda atau perusahaan dan menggunakan enkripsi (secure data) pada internal folder agar pencuri tidak dapat membaca data yang ada. Urutan Skor Tertinggi - Rendah = EDCBA Soal tersebut menguji aspek Teknologi Informasi dan Komunikasi dengan tujuan: menunjukkan kemampuan memanfaatkan teknologi informasi secara efektif untuk meningkatkan kinerja. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda mencari solusi dengan memanfaatkan teknologi informasi dan komunikasi untuk menyelesaikan masalah tersebut. Pilih jawaban yang memanfaatkan teknologi terbaik dalam melindungi data-data pekerjaan Anda. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda menghindari tanggung jawab dan tidak mencoba memaksimalkan diri untuk mencari solusi."}, {"id": 3, "question": "Di saat work from home (WFH) seperti ini, mungkin Anda merasa lebih santai dan nyaman dalam bekerja. Namun, terkadang, ada situasi di mana Anda harus berurusan dengan hal-hal penting bersama rekan kerja dan perlu segera berdiskusi. Namun, kendala muncul ketika Anda menggunakan perangkat telepon yang tidak nyaman untuk berdiskusi, sehingga membuat proses berkomunikasi menjadi kurang efisien dan menyulitkan Anda untuk menyelesaikan urusan tersebut dengan baik.Maka yang akan Anda lakukan?", "choices": {"A": "Menggunakan social messenger yang mendukung fitur chat, voice call, maupun video call agar mempermudah diskusi Anda dengan melihat langsung rekan-rekan kerja dalam satu waktu.", "B": "Tentu saja akan menghubungi mereka satu persatu karena hal itu bisa membuat diskusi Anda jelas dan bisa memahami pendapat mereka satu per satu.", "C": "Mengirimkan pesan dengan cara salin dan kirim berulang kali ke orang yang berbeda, hal ini akan sangat membantu Anda untuk menyampaikan maksud yang sama tanpa harus menjelaskan berulang kali.   D. Membuat grup chat dimana Anda bisa mendiskusikan dan menyampaikan maksud Anda kepada banyak orang dalam sekali kerja.", "E": "Menghubungi salah satu dari rekan Anda untuk diberi penjelasan tentang kepentingan Anda lalu memintanya menyampaikan itu kepada yang lain."}, "correct": "A", "pembahasan": "Menggunakan social messenger yang mendukung fitur chat, voice call, maupun video call agar mempermudah diskusi Anda dengan melihat langsung rekan-rekan kerja dalam satu waktu Urutan Skor Tertinggi - Rendah = ADCBE Soal tersebut menguji aspek Teknologi Informasi dan Komunikasi dengan tujuan: menunjukkan kemampuan memanfaatkan teknologi informasi secara efektif untuk meningkatkan kinerja. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda berinisiatif mencari solusi yang tepat untuk menyelesaikan masalah tersebut dengan memanfaatkan teknologi Informasi dan komunikasi. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda menempuh cara-cara yang kurang solutif atau kurang tepat untuk menyelesaikan masalah tersebut."}, {"id": 4, "question": "Sebagai seorang dosen, Anda menghadapi tantangan selama pandemi COVID-19 karena tidak ada kegiatan belajar tatap muka yang diizinkan, menghambat proses belajar mengajar di kampus. Sistem pembelajaran yang biasanya mengandalkan pertemuan tatap muka di kelas juga memerlukan waktu untuk beradaptasi dengan kondisi baru ini. Hal ini berarti Anda harus mencari solusi alternatif dan menyesuaikan metode pengajaran Anda agar tetap efektif dalam situasi pembelajaran jarak jauh. Selama masa awal ditiadakannya kegiatan belajar tatap muka tersebut, yang Anda lakukan adalah .", "choices": {"A": "Meminta ahli IT kampus untuk membuat sistem pembelajaran online berbasis website.", "B": "Membuat dan membagikan audiobook materi perkuliahan", "C": "Mengadakan ujian dengan menggunakan media Google Form.", "D": "Membagikan materi perkuliahan melalui grup media sosial", "E": "Membuat sistem tatap muka daring melalui media live video, seperti Zoom atau Google Meet."}, "correct": "E", "pembahasan": "Membuat sistem tatap muka daring melalui media live video, seperti Zoom atau Google Meet. Urutan Skor Tertinggi - Rendah = EABCD Soal tersebut menguji kemampuan Anda dalam memanfaatkan Teknologi Informasi dan Komunikasi (TIK). Dalam situasi tersebut, langkah terbaik adalah dengan meminta tim IT untuk membuatkan sistem belajar daring, entah itu berbasis web atau aplikasi. Namun, perlu diingat bahwa pembuatan sistem tersebut memerlukan waktu yang tidak sebentar. Oleh karena itu, sementara sistem tersebut belum rampung atau sebelum perkuliahan dimulai, Anda dapat menggunakan media alternatif seperti Zoom atau membuat audiobook untuk mendukung proses belajar jarak jauh."}, {"id": 6, "question": "Di kantor tempat Anda bekerja, sedang dilakukan perawatan dan perbaikan berbagai perangkat berbasis listrik. Salah satu perangkat yang tengah diperbaiki adalah pompa air, namun ditemukan bahwa pompa tersebut mengalami kendala yang memerlukan suatu komponen khusus agar dapat diperbaiki. Namun, komponen tersebut memiliki ciri-ciri yang tidak umum dan sulit ditemukan di pasaran lokal. Oleh karena itu, Anda bertugas untuk meminta bantuan salah satu pegawai yang mungkin memiliki akses atau jaringan untuk mendapatkan komponen tersebut dari tempat yang lebih tersedia atau melalui pemesanan khusus.Yang akan Anda lakukan .", "choices": {"A": "Membelinya sendiri saja agar tidak terjadi kekeliruan.", "B": "Menjelaskan dan memberi pegawai tersebut catatan mengenai detail komponen tersebut.", "C": "Menjelaskan ciri-ciri komponen tersebut dengan detail dan terperinci", "D": "Meminta bantuan teman Anda yang kebetulan memiliki pengetahuan dalam bidang tersebut.", "E": "Menjelaskan dengan detail dan mencarikan gambar beserta ciri-ciri yang sesuai dari internet."}, "correct": "E", "pembahasan": "Menjelaskan dengan detail dan mencarikan gambar beserta ciri-ciri yang sesuai dari internet. Urutan Skor Tertinggi - Rendah = EBCDA   Soal tersebut menekankan pentingnya memastikan bahwa pegawai yang diminta memahami arahan Anda dengan baik dan memahami bentuk barang yang dibutuhkan. Dalam situasi ini, penting untuk menggunakan berbagai media yang memungkinkan untuk mendukung pemahaman mereka, dan salah satu cara terbaik adalah dengan menggunakan gambar dari internet. Penggunaan internet dalam bekerja tidak hanya memfasilitasi komunikasi, tetapi juga memungkinkan akses cepat ke berbagai informasi yang diperlukan. Dengan demikian, penggunaan teknologi informasi dan komunikasi (TIK), seperti internet, dapat memenuhi tujuan dari aspek tersebut dalam pekerjaan Anda."}, {"id": 7, "question": "Penggunaan teknologi informasi, seperti internet, memiliki banyak manfaat yang membuat pengerjaan tugas menjadi lebih mudah dan efisien. Contohnya, dengan menggunakan internet, seseorang dapat dengan cepat mencari informasi apa pun hanya dengan beberapa kata kunci (keyword). Namun, di samping manfaatnya, perlu diingat bahwa harga teknologi tersebut juga cenderung mahal. Di kantor Anda, dimana semua karyawan memanfaatkan internet untuk keperluan pekerjaan, hal ini dapat menyebabkan tagihan internet perusahaan Anda membengkak setiap bulannya.Dalam kondisi tersebut, sikap anda .", "choices": {"A": "Membatasi penggunaan internet harian.", "B": "Hal tersebut tidak dapat dihindari.", "C": "Membuat jadwal penggunaan internet perusahaan setiap harinya.", "D": "Hal tersebut tidak masalah asalkan pekerjaan bisa selesai dengan baik.", "E": "Membuat batasan-batasan pada teknologi tersebut agar tidak memakan banyak kuota."}, "correct": "E", "pembahasan": "Membuat batasan-batasan pada teknologi tersebut agar tidak memakan banyak kuota. Urutan Skor Tertinggi - Rendah= EDBCA Dalam menerapkan suatu teknologi, seperti penggunaan internet di kantor, terdapat beberapa pertimbangan yang harus dipikirkan, dan salah satunya adalah biaya. Penggunaan teknologi tersebut dapat memberikan manfaat yang besar dalam meningkatkan produktivitas dan efisiensi, namun perlu diingat bahwa biaya yang dikeluarkan juga bisa menjadi besar jika tidak dikelola dengan baik. Salah satu cara untuk menghindari pembengkakan biaya adalah dengan membuat batasan-batasan yang jelas terkait penggunaan teknologi tersebut. Misalnya, dapat ditentukan bahwa akses internet hanya digunakan untuk keperluan pekerjaan yang relevan, dan bukan untuk aktivitas pribadi atau hiburan. Selain itu, juga dapat ditetapkan kebijakan terkait penggunaan data atau bandwidth agar tidak terjadi pemborosan yang tidak perlu. Dengan adanya batasan- batasan ini, diharapkan dapat mengontrol dan mengurangi biaya yang dikeluarkan perusahaan akibat penggunaan teknologi."}, {"id": 8, "question": "Pimpinan perusahaan tempat Anda bekerja adalah seseorang yang sudah berumur dan telah menunjukkan kinerja yang sangat baik dalam pekerjaannya selama ini. Namun, karena usianya yang sudah cukup lanjut, dia mungkin kurang memahami atau tidak begitu terbiasa dengan penggunaan sistem IT. Akibatnya, implementasi sistem IT di perusahaan   tersebut belum dapat dilakukan secara optimal. Kondisi ini menyebabkan pekerjaan Anda dan rekan-rekan Anda mengalami beberapa hambatan, karena masih mengandalkan proses manual atau cara kerja yang lebih tradisional dalam menjalankan aktivitas kerja sehari-hari. Yang bisa anda lakukan ….", "choices": {"A": "Membiarkan saja karena bagaimanapun ia memiliki kinerja yang sangat baik, IT bukanlah bidangnya.", "B": "Menawarkan kepada pimpinan untuk membantunya memahami IT.", "C": "Mengajak serta rekan-rekan anda untuk membantunya memahami IT.", "D": "Mendorong dan membantunya memahami IT.", "E": "Mendiskusikan masalah tersebut dalam rapat."}, "correct": "D", "pembahasan": "Mendorong dan membantunya memahami IT. Urutan Skor Tertinggi - Rendah = DBCEA Tidak bisa dipungkiri bahwa perkembangan zaman yang semakin modern menuntut siapa pun, termasuk atasan Anda, untuk memahami IT. Meskipun kinerja atasan Anda bagus, tetapi dalam era digital ini, pemahaman tentang IT menjadi semakin penting. Bahkan, untuk mendukung kemajuan perusahaan dan menghadapi persaingan yang semakin ketat, pemahaman tentang IT menjadi suatu keharusan. Oleh karena itu, meskipun atasan Anda mungkin sudah memiliki kinerja yang baik, namun dia tetap perlu memahami setidaknya hal-hal umum tentang IT secara garis besar. Anda juga dapat memainkan peran penting dalam membantunya memahami IT. Anda bisa memberikan pelatihan atau sesi pembelajaran singkat tentang dasar-dasar IT, menjelaskan terminologi yang umum digunakan, atau bahkan membantu dalam mengoperasikan beberapa aplikasi atau perangkat lunak yang umum digunakan dalam pekerjaan sehari-hari. Dengan cara ini, Anda tidak hanya membantu atasan Anda untuk memperluas pengetahuannya tentang IT, tetapi juga meningkatkan produktivitas dan efisiensi dalam lingkungan kerja."}, {"id": 9, "question": "Tengah malam, Anda menerima pesan dari panitia acara seminar yang memberitahu Anda bahwa ada dresscode yang harus diterapkan untuk acara besok. Namun, karena Anda baru membaca pesan tersebut pagi-pagi sekali, Anda menyadari bahwa bawahan Anda mungkin belum mengetahuinya. Hal ini bisa menjadi masalah karena mereka mungkin tidak memiliki waktu yang cukup untuk menyiapkan pakaian sesuai dengan dresscode yang ditetapkan. Oleh karena itu, Anda perlu segera menginformasikan mereka agar dapat mempersiapkan diri dengan tepat sesuai dengan aturan yang berlaku untuk acara tersebut. Yang Anda lakukan adalah …", "choices": {"A": "Membuat pengumuman di grup media sosial kantor saat itu juga dengan harapan semua bawahan Anda membacanya", "B": "Mengirimkan pesan ke salah satu bawahan anda mengenai dresscode tersebut untuk diteruskan ke pegawai lainnya secara berantai.", "C": "Melaporkan hal tersebut kepada panitia agar diberikan izin memakai pakaian selain dresscode yang ditentukan.", "D": "Meminta acara seminar diundur agar Anda memiliki waktu untuk menyampaikan terkait dresscode yang harus digunakan.", "E": "Membiarkan saja, bagaimanapun hal tersebut dikarenakan panitia yang lambat memberi informasi."}, "correct": "A", "pembahasan": "Membuat pengumuman di grup media sosial kantor saat itu juga dengan harapan semua bawahan Anda membacanya Urutan Skor Tertinggi - Rendah = ABCDE Dengan mengirimkan informasi mengenai dresscode acara melalui grup kantor, Anda memastikan bahwa semua orang yang tergabung dalam grup tersebut akan menerima notifikasi. Ini meningkatkan kemungkinan bahwa semua anggota grup akan membaca pesan tersebut dan mengetahui informasi yang Anda sampaikan. Tindakan ini juga mencerminkan kemampuan Anda dalam memanfaatkan teknologi informasi (TI) dengan baik sesuai dengan tujuan aspek TIK. Dengan menggunakan media komunikasi digital, seperti grup pesan, Anda efektif dalam menyampaikan informasi secara cepat dan efisien kepada rekan-rekan kerja, sehingga membantu memastikan bahwa semua orang dapat terinformasi dengan baik tentang hal-hal yang penting terkait pekerjaan."}, {"id": 10, "question": "Sebagai seorang guru, Anda telah melakukan perencanaan program pembelajaran dan ujian dengan teliti dan cermat dari jauh-jauh hari. Namun, tidak terduga, pandemi COVID- 19 mengubah segalanya. Penyebaran virus ini menyebabkan beberapa fasilitas publik, termasuk sekolah, harus ditutup untuk mencegah penyebaran lebih lanjut. Akibatnya, Anda terpaksa menghadapi situasi di mana rencana Anda untuk melaksanakan ujian semester tidak dapat dilaksanakan sesuai dengan rencana semula. Hal ini tentu menjadi tantangan besar bagi Anda sebagai pendidik, karena Anda harus mencari solusi alternatif untuk melaksanakan evaluasi pembelajaran siswa tanpa mengorbankan kualitas atau integritas dari ujian tersebut.Dalam kondisi tersebut, yang bisa saya lakukan .", "choices": {"A": "Mengadakan ujian di sekolah dengan membagi jadwal menjadi beberapa gelombang dan membatasi jumlah siswa yang hadir.", "B": "Mengadakan ujian daring dengan menggunakan media seperti google form atau lainnya yang sejenis", "C": "Mengganti ujian tertulis dengan ujian praktik yang bisa dikerjakan sendiri di rumah, sementara proses dan hasilnya wajib dilaporkan oleh orang tua ke saya.", "D": "Menunda ujian sampai ada izin dari pemerintah untuk mengadakan kelas tatap muka, demi menghindari penularan pandemi.", "E": "Mengadakan ujian di sekolah dengan menerapkan protokol kesehatan secara ketat."}, "correct": "B", "pembahasan": "Mengadakan ujian daring dengan menggunakan media seperti google form atau lainnya yang sejenis Urutan Skor Tertinggi - Rendah = BCAED Aspek Teknologi Informasi dan Komunikasi (TIK) bertujuan untuk menilai kemampuan seseorang dalam memanfaatkan teknologi informasi secara efektif guna meningkatkan kinerja. Dalam konteks pandemi COVID-19, pemerintah telah melarang aktivitas di beberapa fasilitas publik, termasuk sekolah, untuk mengurangi risiko penularan virus. Oleh karena itu, sebagai seorang guru, Anda perlu mencari solusi kreatif dan inovatif untuk melaksanakan ujian tanpa melibatkan siswa masuk ke dalam kelas. Salah satu metode yang dapat Anda pertimbangkan adalah penggunaan teknologi informasi, seperti platform pembelajaran daring atau aplikasi khusus ujian online. Dengan menggunakan platform tersebut, Anda dapat   membuat soal-soal ujian dan menyebarkannya kepada siswa secara daring. Selain itu, Anda juga dapat memanfaatkan fitur-fitur yang disediakan oleh platform tersebut, seperti pengawasan ujian secara daring, untuk memastikan integritas ujian tetap terjaga. Dengan pendekatan ini, Anda tidak hanya mematuhi aturan pemerintah terkait pembatasan aktivitas di sekolah, tetapi juga dapat menjaga kelancaran proses pembelajaran dan evaluasi siswa. Hal ini juga menunjukkan kemampuan Anda dalam memanfaatkan teknologi informasi dengan efektif untuk mencapai tujuan pendidikan.  SOSIAL BUDAYA  Dunia kerja bukan hanya tentang tugas, gaji, dan promosi. Lebih dari itu, ia adalah sebuah ekosistem sosial yang kompleks, di mana individu dari berbagai latar belakang berinteraksi, berkolaborasi, dan berkompetisi. Memahami aspek sosial budaya dalam dunia kerja adalah kunci untuk membangun karier yang sukses, menciptakan lingkungan kerja yang positif, dan mendorong produktivitas. I. Konsep Dasar Sosial Budaya dalam Dunia Kerja"}]}, "SOSIAL BUDAYA": {"category": "TKP", "title": "SOSIAL BUDAYA", "questions": [{"id": 1, "question": "Sebagai Ketua RT, menerima surat pemberitahuan dari PLN mengenai rencana pemadaman listrik bergilir di lingkungan perumahan adalah tanggung jawab yang perlu segera direspons. Pemadaman listrik yang dijadwalkan untuk esok hari dan diperkirakan akan berlangsung selama 12 jam, dari siang hingga malam hari, dapat berdampak pada aktivitas seharihari dan kenyamanan warga di lingkungan tersebut.yang akan Anda lakukan adalah ....", "choices": {"A": "Menghimbau warga untuk mengungsi dari rumah selama dilakukan pemadaman karena akan sulit melakukan kegiatan yang berhubungan dengan listrik.", "B": "Memberikan pengumuman kepada warga dan meminta PLN untuk mengusahakan agar tidak perlu berlama-lama melakukan pemadaman listrik.", "C": "Membuat pengumuman tertulis terkait pemadaman tersebut dan menempelkannya di poskamling agar dapat dibaca oleh warga yang melaluinya.", "D": "Mengumumkan hal tersebut melalui pengeras suara yang tersebar di lingkungan perumahan agar dapat diketahui oleh seluruh warga RT.", "E": "Memberikan pengumuman dan menghimbau kepada warga untuk mempersiapkan hal-hal yang berhubungan dengan listrik seperti lampu cadangan."}, "correct": "E", "pembahasan": "Memberikan pengumuman dan menghimbau kepada warga untuk mempersiapkan hal-hal yang berhubungan dengan listrik seperti lampu cadangan. Urutan Skor Tertinggi - Rendah = EDCBA   Soal tersebut menguji aspek sosial budaya dengan tujuan: menunjukkan kemampuan beradaptasi dan bekerja secara efektif dalam masyarakat majemuk (terdiri atas beragam agama, suku, budaya, dan sebagainya). Poin tertinggi terdapat pada opsi \"Memberikan pengumuman dan menghimbau kepada warga untuk mempersiapkan hal-hal yang berhubungan dengan listrik seperti lampu cadangan.\" yang menunjukkan bahwa Anda mampu menilai hal-hal penting yang harus diprioritaskan dalam suatu permasalahan. Sebagai ketua RT Anda tentu harus menginformasikan hal tersebut kepada seluruh warga, serta mampu memberikan saran/himbauan yang tepat dalam situasi tersebut."}, {"id": 2, "question": "Peristiwa pengeboman yang terjadi di kota tempat tinggal Anda beberapa waktu lalu tentu menjadi berita yang menggemparkan. Pagi ini, terlihat kerumunan petugas polisi di kompleks perumahan Anda, menambah kekhawatiran dan keresahan di antara warga. Mengetahui bahwa pelaku pengeboman tersebut tinggal di lingkungan tempat tinggal Anda meningkatkan tingkat kecemasan dan kekhawatiran di kalangan warga.Sebagai ketua RT di lingkungan tersebut, maka anda akan ....", "choices": {"A": "Kooperatif dalam memberikan informasi pada pihak berwajib tanpa melebihkan atau mengurangi, serta menghimbau masyarakat agar bijak dalam menyikapi berita tersebut.", "B": "Menghimbau warga sekitar agar bersikap bijak dan tidak panik dalam menyikapi kabar tersebut, serta bersikap kooperatif jika dimintai keterangan oleh polisi.", "C": "Menghindari pertanyaan polisi agar tidak dianggap melindungi pelaku teroris, sementara di sisi lain akan menghimbau warga untuk menghadapi masalah tersebut bersama-sama.", "D": "Menghimbau warga sekitar agar segera menjauh dari lokasi supaya tidak dianggap terlibat dalam tindak terorisme tersebut.", "E": "Memeriksa dan memastikan kebenaran terkait hal tersebut kepada warga sekitar, apabila ditemukan kabar tersebut benar maka akan bekerja sama dengan pihak berwajib untuk menangkap pelaku."}, "correct": "A", "pembahasan": "Kooperatif dalam memberikan informasi pada pihak berwajib tanpa melebihkan atau mengurangi, serta menghimbau masyarakat agar bijak dalam menyikapi berita tersebut Urutan Skor Tertinggi - Rendah = ABECD Soal tersebut menguji aspek anti radikalisme dengan tujuan: menjaring informasi dari individu tentang pengetahuan terhadap anti radikalisme, kecenderungan bersikap, dan bertindak saat menanggapi stimulus dengan beberapa alternatif situasi. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda mampu mengendalikan diri dan mampu bekerja sama dengan memberikan informasi secara benar tanpa mengurangi atau melebihkan, serta mengambil tindakan sesuai peran Anda di masyarakat. Poin terendah ada pada jawaban yang menunjukkan bahwa anda bersikap apatis dan kurang bijak terhadap masalah sekitar Anda."}, {"id": 3, "question": "Dona adalah pemilik toko akuarium. Suatu hari ada seorang pengunjung yang datang dan melihat-lihat akuarium besar yang di pajang di toko miliknya. Saat itu, pengunjung tersebut tidak sengaja menyenggol akuarium berukuran paling besar sehingga menyebabkannya terjatuh sampai rusak   total. Tentu saja Dona meminta ganti rugi atas kerusakan tersebut, tetapi pengunjung tesebut menolak dengan alasan ia tidak sengaja. Ia juga menyalahkan Dona karena menaruh akuarium itu di tempat yang sering dilewati orang sehingga rentan jatuh. Bagaimana sebaiknya sikap Dona dalam situasi ini?", "choices": {"A": "Menjelaskan kesalahannya dan memintanya secara baik-baik untuk mempertanggungjawabkan apa yang sudah ia lakukan.", "B": "Tak mengizinkan pengunjung tersebut pergi dari sana sampai ia mau bertanggung jawab dan mengganti rugi.", "C": "Melaporkannya ke pihak berwajib karena tidak mau bertanggung jawab dan menyalahkannya sebagai pemilik dari tempat itu.", "D": "Jika ia tidak mau mengganti rugi maka Mona hanya bisa pasrah, karena bagaimanapun ia adalah pengunjung toko yang harus dihormati.", "E": "Membiarkannya pergi karena Mona tidak ingin ada keributan di tokonya yang mungkin akan mengganggu para pengujung lainnya."}, "correct": "A", "pembahasan": "Menjelaskan kesalahannya dan memintanya secara baik-baik untuk mempertanggungjawabkan apa yang sudah ia lakukan. Urutan Skor Tertinggi - Rendah = AEBCD Soal tersebut menguji aspek sosial budaya yang berkaitan dengan hubungan terhadap orang lain. Anda diminta untuk memecahkan suatu permasalahan yang dihadapi sehari- hari secara tepat, dengan menunjukkan respons terbaik yang Anda tampilkan saat menghadapi masalah tersebut. Respons terburuk dari menghadapi masalah adalah menghindar atau terbawa emosi. Poin tertinggi ada pada jawaban yang menunjukkan bahwa Anda memiliki kepedulian terhadap orang lain dengan memintanya bertanggung jawab dan tetap mengendalikan diri. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda tidak mampu mengendalikan diri dan bersikap kasar tanpa menyelesaikan masalah."}, {"id": 4, "question": "Hidup di era teknologi dengan segala sesuatunya banyak yang terhubung melalui media sosial, kerap kali kita mencari validasi dari orang lain. Kita ingin selalu disukai semua orang. Kita ingin apa yang kita tampilkan atau tunjukkan bisa membuat orang-orang suka. Namun, kenyataannya ada saja orang yang tak menyukai kita. Ada saja orang yang memandang kita dengan buruk. Begitu halnya dengan Anda, di lingkungan kerja Anda ada yang tidak menyukai prestasi yang telah Anda raih meskipun diperoleh dengan cara yang benar. Menyikapi hal tersebut, sikap Anda ....", "choices": {"A": "Menurut saya hal tersebut sudah biasa terjadi di tempat kerja, saya tidak ingin terlalu memikirkan penyebab dia tidak menyukai prestasi saya yang terpenting saya bisa bekerja seperti biasa tanpa mengganggunya.", "B": "Mencoba berkomunikasi secara baik-baik dengan orang tersebut sambil mengintropeksi diri, mungkin ada hal yang tanpa saya sadari atau tidak disengaja saya lakukan dan menimbulkan salah paham.", "C": "Memahaminya dan sadar bahwa bila saya berada di posisi dia mungkin akan ada rasa cemburu atas prestasi yang diraih oleh orang lain   D. Tetap berteman baik kepadanya tanpa membalas perlakuannya kepada saya. Namun bila dia masih menunjukkan perasaan kurang suka, maka saya akan berusaha menjauhinya.", "E": "Memahami hal tersebut dengan cara berusaha bersikap secara wajar dan tidak melakukan hal yang membuat dia kurang menyukai saya."}, "correct": "B", "pembahasan": "Mencoba berkomunikasi secara baik-baik dengan orang tersebut sambil mengintropeksi diri, mungkin ada hal yang tanpa saya sadari atau tidak disengaja saya lakukan dan menimbulkan salah paham Urutan Skor Tertinggi - Rendah = BEACD Soal tersebut menguji aspek sosial budaya dengan tujuan: menunjukkan kemampuan beradaptasi dan bekerja secara efektif dalam masyarakat majemuk (terdiri atas beragam agama, suku, budaya, dan sebagainya). Aspek sosial budaya menilai kemampuan terkait masalah sosio-kultural, baik yang berkaitan dengan diri sendiri maupun dengan orang lain. Pada soal tersebut, opsi yang memiliki bobot skor tertinggi adalah opsi \"Mencoba berkomunikasi secara baik-baik dengan orang tersebut sambil mengintropeksi diri, mungkin ada hal yang tanpa saya sadari atau tidak disengaja saya lakukan dan menimbulkan salah paham.\" Opsi tersebut mengedepankan introspeksi terlebih dahulu untuk mencari sumber mengapa seseorang tidak menyukai kita dalam hal pekerjaan."}, {"id": 5, "question": "Di malam hari, Anda mendengar suara keributan yang cukup keras dari luar rumah Anda. Merasa penasaran dan ingin memastikan apa yang sedang terjadi, Anda memutuskan untuk mencari sumber suara tersebut. Setelah melihat ke arah rumah tetangga Anda, ternyata keributan tersebut berasal dari situ. Anda menyaksikan seorang suami dan istri sedang terlibat dalam sebuah pertengkaran yang cukup intens. Suasana yang tegang dan suara berisik tersebut membuat Anda merasa khawatir dan berpikir untuk bertindak.", "choices": {"A": "Mencoba menguping untuk mengetahui duduk perkara yang sebenarnya.", "B": "Tidak ikut campur karena tidak mengetahui duduk perkaranya.", "C": "Mengomunikasikannya dengan ketua RT dan mendiskusikan apakah ada yang bisa dilakukan untuk membantu.", "D": "Tidak ikut campur karena permasalahan seperti itu biarlah diselesaikan sendiri oleh pihak yang terlibat.", "E": "Mencoba mengetuk pintu rumah tetangga tersebut dan mengucapkan salam untuk memecah suasana."}, "correct": "C", "pembahasan": "Mengomunikasikannya dengan ketua RT dan mendiskusikan apakah ada yang bisa dilakukan untuk membantu. Urutan Skor Tertinggi - Rendah= CEBAD Pada situasi tersebut, penting untuk mempertimbangkan dua hal yang saling bertentangan. Pertama, jika Anda campur tangan, Anda bisa dianggap mencampuri urusan rumah tangga orang lain, yang bisa dianggap sebagai suatu tindakan yang tidak pantas. Namun, kedua, jika Anda tidak mengambil tindakan apapun, situasi tersebut bisa berpotensi berujung pada kekerasan dalam rumah tangga (KDRT), terutama jika keributan tersebut terus berlanjut dan meresahkan lingkungan sekitar.   Dalam konteks ini, meminta bantuan dari pak RT, yang merupakan sosok yang memiliki kewenangan dan tanggung jawab di lingkungan tersebut, bisa menjadi pilihan yang tepat. Pak RT dapat membantu menengahi situasi tanpa membuat Anda terlibat secara langsung dalam urusan rumah tangga orang lain. Dengan demikian, tindakan Anda lebih terfokus pada upaya menjaga keamanan dan kenyamanan bagi seluruh warga lingkungan tersebut, tanpa mencampuri urusan pribadi orang lain secara langsung."}, {"id": 6, "question": "Dalam upaya meningkatkan kualitas sumber daya manusia, Nadia mendapat tugas dari atasan untuk mengikuti sebuah pendidikan dan pelatihan tertentu. Sebagai bagian dari penyelenggaraan pelatihan tersebut, panitia mengatur kelompok kerja di antara para peserta. Di dalam kelompok tersebut, Nadia menemukan dirinya berada bersama orangorang yang tidak dikenalnya sebelumnya dan memiliki latar belakang budaya yang berbeda dengan dirinya.", "choices": {"A": "Mengikuti training sesuai kelompok yang dibagikan oleh panitia meskipun berkelompok orang yang baru kenal dan berbeda budaya dengannya, justru hal tersebut menjadi momen terbaik untuk saling memahami orang yang berbeda budaya.", "B": "Mengikuti training namun meminta panitia untuk membagikan kelompok dengan yang sudah saling kenal sehingga komunikasi antar anggota kelompok bisa terjalin dengan baik sehingga pelaksanaan kegiatan pendidikan dan pelatihan berjalan dengan lancar.", "C": "Mengikuti kegiatan pendidikan dan pelatihan tersebut sekalipun satu kelompok dengan orang yang baru dan berbeda budaya. Kegiatan tersebut sangat bermanfaat bagi pengembangan kompetensi dalam berkarir, di sisi lain Nadia juga menikmati keberagaman bukan sebagai penghalang untuk meningkat kompetensi dalam karir.", "D": "Mengikuti kegiatan pendidikan dan pelatihan tersebut dengan sungguhsungguh sekalipun berkelompok dengan orang baru yang berbeda budaya, karena merupakan tuntutan dalam karir untuk menlngkatkan kompetensl sehingga mendukung saya sebagal pegawal profeslonal. Selaln itu kegiatan pelatihan tersebut berguna dalam evaluasl klnerja dan pangkat/golongan kerja.", "E": "Mengikuti kegiatan pendidikan dan pelatihan sebaik mungkin karena hal tersebut arahan dari atasan kantor. Kegiatan tersebut akan berguna memberikan pengetahuan dan wawasan baru sesual bidang pekerjaan. Tetap mengikutinya dengan sungguh-sungguh meskipun pernah mengikuti pelatlhan yang sama."}, "correct": "C", "pembahasan": "Mengikuti kegiatan pendidikan dan pelatihan tersebut sekalipun satu kelompok dengan orang yang baru dan berbeda budaya. Kegiatan tersebut sangat bermanfaat bagi pengembangan kompetensi dalam berkarir, di sisi lain Nadia juga menikmati keberagaman bukan sebagai penghalang untuk meningkat kompetensi dalam karir. Urutan Skor Tertinggi - Rendah= CDEAB Soal tersebut menguji kemampuan Anda dalam bersikap toleran dan menghargai budaya serta kesiapan untuk mempelajari budaya baru. Dalam konteks ini, Nadia dihadapkan pada situasi di mana ia ditempatkan dalam kelompok pendidikan dan pelatihan bersama orang yang tidak dikenalnya   dan memiliki latar belakang budaya yang berbeda. Sikap yang terbaik bagi Nadia adalah tetap berpartisipasi dalam kegiatan tersebut meskipun berada dalam kelompok yang berbeda budaya, karena kegiatan tersebut memberikan manfaat yang besar bagi pengembangan keterampilan dan kemampuan dalam karirnya. Melalui pengalaman ini, Nadia memiliki kesempatan untuk mengeksplorasi dan menghargai keberagaman budaya, serta memperluas wawasan dan pemahamannya tentang budaya lain. Dengan tetap terlibat dalam kegiatan tersebut, Nadia juga menunjukkan sikap inklusif dan terbuka terhadap perbedaan, yang merupakan kualitas yang sangat dihargai dalam lingkungan profesional yang multikultural. Oleh karena itu, memilih untuk tetap berpartisipasi dalam kegiatan tersebut adalah langkah yang tepat bagi Nadia untuk terus berkembang dalam karirnya sambil menghargai dan memperkaya pengalaman budayanya."}, {"id": 7, "question": "Suatu hari Anda dihadapkan pada dua nilai yang bertentangan: kepercayaan budaya suku yang menganggap anjing membawa aura negatif dan kampanye pemerintah untuk menyayangi hewan. Kepala suku biasanya memerintahkan untuk membunuh anjing- anjing tersebut karena keyakinan tersebut telah menjadi bagian dari budaya dan tradisi mereka. Namun, di sisi lain, tindakan membunuh hewan dan eksploitasi mereka untuk kepentingan tertentu telah dianggap melanggar hukum dan etika. Sikap Anda adalah …", "choices": {"A": "Mengkomunikasikan hal tersebut dengan kepala suku bahwa pemerintah sedang menggalakkan program untuk menyayangi hewan", "B": "Melaporkan kepada pihak terkait untuk segera diusut", "C": "Memfoto kemudian mengupload ke instagram dan mengadakan petisi", "D": "lkut melakukan adat tersebut sebagai upaya menghormati adat", "E": "Saya akan bertindak pura-pura tidak tahu"}, "correct": "A", "pembahasan": "Mengkomunikasikan hal tersebut dengan kepala suku bahwa pemerintah sedang menggalakkan program untuk menyayangi hewan Urutan Skor Tertinggi - Rendah= ABDCE Soal tersebut bertujuan untuk melihat kepekaan Anda terhadap permasalahan yang terjadi secara sosial dan memberikan penyelesaian atau solusi yang sesuai dengan norma atau peraturan yang berlaku serta tetap sopan agar tidak ada pihak yang merasa tersinggung. Dalam soal dijelaskan bahwa warga di daerah tempat ada bertugas memiliki kebiasaan untuk membunuh hewan anjing karena dianggap menimbulkan aura negatif. Sedangkan di slsi laln pemerintah sedang menggalakkan kampanye menyayangi hewan yang bertentangan dengan sikap yang dilakukan warga di daerah tersebut. Untuk menyelesaikan permasalahan tersebut, terlebih dahulu Anda harus mengkomunikasikan perihal kampanye menyayangi hewan tersebut ke kepala suku agar memberikan pengertian bahwa tindakan yang dilakukan oleh warga di daerah tersebut bertentangan dengan peraturan pemerintah. Karena memberikan informasi atau mengkomunikasikan terlebih dahulu peraturan tersebut akan meminimalkan kesalahpahaman yang dapat menyulut konflik antar pihak-pihak yang   bersangkutan. Setelah itu jika dirasa memang tidak ada titik temu maka langkah selanjutnya baru melaporkan kepada pihak berwenang untuk diusut. Maka opsi jawaban yang paling tepat adalah opsi A."}, {"id": 8, "question": "Dalam situasi tersebut, Anda dihadapkan pada dua pilihan yang penting. Di satu sisi, Anda melihat seorang nenek yang sedang menyeberang jalan dan tampaknya membutuhkan bantuan. Di sisi lain, Anda memiliki keterbatasan waktu karena harus tiba di kantor dalam waktu 10 menit dengan jarak yang ditempuh 15 km untuk menghindari potongan gaji yang signifikan. Keputusan yang Anda ambil bisa memengaruhi keselamatan nenek tersebut dan juga dampak finansial bagi Anda sendiri. Hal yang saya lakukan menanggapi hal ini adalah …", "choices": {"A": "Langsung memberikan pertolongan kepada nenek tersebut.", "B": "Tancap gas membawa kendaraan karena saya tahu masih banyak orang yang berada di jalanan yang mampu menolong.", "C": "Pergi ke kantor karena sudah telat.", "D": "Karena saya sadar bahwa tidak mungkin mengejar 15 km dalam 10 menit, maka saya berhenti sejenak untuk menolong nenek tersebut menyebrang jalan.", "E": "Mencoba berhati-hati terlebih dahulu karena zaman sekarang rawan kejahatan sehingga ketika saya ingin berniat menolong, maka saya berharap bisa mengajak salah seorang warga sekitar untuk menolongnya."}, "correct": "A", "pembahasan": "Langsung memberikan pertolongan kepada nenek tersebut. Urutan Skor Tertinggi - Rendah= ADBCE Dalam situasi ini, Anda dihadapkan pada dua faktor yang saling bertentangan: keterbatasan waktu untuk tiba di kantor dan kebutuhan untuk membantu sesama yang membutuhkan pertolongan. Meskipun waktu yang tersisa mungkin tidak cukup untuk mengejar jarak tempuh yang cukup jauh, memberikan pertolongan kepada nenek yang membutuhkan bantuan merupakan tindakan yang sesuai dengan sikap kepekaan dan empati terhadap sesama. Meskipun opsi untuk mengejar waktu tiba di kantor juga penting untuk mempertahankan stabilitas finansial, kepentingan sesama yang membutuhkan bantuan harus ditempatkan di posisi yang lebih tinggi. Oleh karena itu, opsi A dan D yang menekankan pada memberikan pertolongan kepada nenek tersebut merupakan solusi yang terbaik dalam situasi ini. Sementara opsi B, C, dan E yang tidak memberikan prioritas pada membantu sesama dianggap kurang tepat dalam konteks kepekaan terhadap kebutuhan orang lain."}, {"id": 9, "question": "Anda diamanatkan untuk bekerja di luar pulau oleh atasan Anda. Setelah tiba di lokasi, Anda melihat rekan kerja Anda setiap hari Rabu mayoritas mengenakan kemeja putih dengan ikat kepala yang merupakan ikon daerah tersebut. Meskipun Anda menyadari bahwa ini bukan aturan resmi dari kantor, namun Anda mengetahui bahwa ini adalah inisiatif dari karyawan di perusahaan tersebut. Maka yang Anda lakukan adalah …", "choices": {"A": "Saya akan tampil apa adanya saja.", "B": "Saya akan memakai kemeja putih dengan aksesoris ikat kepala jika diperintah atasan.   C. Saya akan meminta pendapat rekan kerja dan pimpinan terlebih dahulu mengenai aturan tersebut.", "D": "Saya akan memakai kemeja putih dan aksesoris ikat kepala sebagai wujud penghargaan terhadap karyawan lain.", "E": "Saya akan memakai kemeja putih dan ikat kepala dengan penyesuaian secara bertahap."}, "correct": "D", "pembahasan": "Saya akan memakai kemeja putih dan aksesoris ikat kepala sebagai wujud penghargaan terhadap karyawan lain. Urutan Skor Tertinggi - Rendah= ADBCE Soal ini mencoba mengukur sikap Anda terhadap penghargaan dan adaptasi terhadap budaya atau adat di daerah yang berbeda. Diketahui bahwa mayoritas rekan kerja Anda memakai kemeja putih dan ikat kepala yang merupakan ikon daerah setiap hari Rabu. Meskipun ini bukan aturan resmi dari kantor, namun tindakan ini dilakukan untuk menghargai budaya di tempat tersebut. Dalam situasi seperti ini, tidak ada indikasi bahwa tindakan tersebut melanggar atau bertentangan dengan kebiasaan atau kepercayaan Anda. Oleh karena itu, yang terbaik adalah untuk langsung beradaptasi dengan kebiasaan tersebut dan mengenakan kemeja putih dan ikat kepala sebagai tanda penghargaan. Dengan berbuat demikian, Anda tidak hanya menunjukkan rasa hormat terhadap budaya setempat tetapi juga menciptakan hubungan yang baik dengan rekan kerja dan masyarakat sekitar. Sehingga, opsi D merupakan pilihan yang paling sesuai dalam situasi tersebut."}, {"id": 10, "question": "Penting untuk memperhatikan kebutuhan agama dan budaya karyawan di tempat kerja yang beragam. Karyawan Muslim sering menghadapi kesulitan dalam beribadah karena mungkin tidak ada tempat ibadah yang tersedia di tempat kerja, atau jadwal kerja yang padat tidak memberi mereka waktu luang untuk beribadah. Untuk menciptakan lingkungan kerja yang inklusif, perusahaan dapat mempertimbangkan penyediaan fasilitas untuk ibadah dan memberikan fleksibilitas dalam jadwal kerja agar karyawan dapat menjalankan ibadah mereka dengan nyaman. Sikap Anda adalah ….", "choices": {"A": "Akan memfasilitasi tempat untuk beribadah mereka di lingkungan perusahaan", "B": "Mendiskusikan hal ini dengan jajaran pimpinan dan pemilik perusahaan untuk dicari solusinya", "C": "Karena pemilik perusahaan seorang non muslim, maka itu sudah menjadi aturan yang harus dipatuhi karyawan", "D": "Memberikan kebijakan yang bersifat toleran kepada karyawan", "E": "Bersifat toleran dan menyediakan semua fasilitas ibadah karyawan"}, "correct": "B", "pembahasan": "Mendiskusikan hal ini dengan jajaran pimpinan dan pemilik perusahaan untuk dicari solusinya Urutan Skor Tertinggi - Rendah= BEDAC Soal tersebut menguji kemampuan Anda dalam menghadapi perbedaan kepercayaan dan menemukan solusi yang efektif terhadap permasalahan yang timbul akibat keberagaman. Dalam contoh tersebut, banyak karyawan Muslim mengeluhkan sulitnya beribadah karena kurangnya tempat ibadah dan jadwal kerja yang tidak sesuai dengan waktu ibadah. Solusi yang tepat adalah mendiskusikan masalah ini dengan pimpinan dan pemilik perusahaan untuk mencari solusi yang memadai. Karena pentingnya penyediaan tempat   ibadah dan penyesuaian jam kerja, keterlibatan pimpinan dan pemilik perusahaan dalam mencari solusi adalah langkah yang tepat. Sehingga, opsi jawaban yang paling tepat adalah opsi B.   ANTI RADIKALISME Anti-radikalisme adalah segala upaya, tindakan, dan pemikiran yang bertujuan untuk mencegah, menanggulangi, dan mengatasi radikalisme. Radikalisme sendiri adalah paham atau ideologi yang menuntut perubahan drastis dalam tatanan sosial dan politik, seringkali dengan menggunakan cara-cara kekerasan atau ekstremisme. Secara etimologi, kata \"radikal\" berasal dari bahasa Latin radix yang berarti \"akar\". Oleh karena itu, radikalisme dapat diartikan sebagai upaya untuk mengubah sesuatu sampai ke akarnya. Penting untuk membedakan antara radikalisme dan radikal. Radikal bisa berarti orang yang berani mengambil keputusan di luar kelaziman untuk melakukan perubahan positif. Namun, radikalisme dalam konteks ini merujuk pada paham yang berbahaya, yang seringkali mengarah pada ekstremisme dan terorisme. Ciri-Ciri Utama Radikalisme Radikalisme, sebagai sebuah paham, memiliki beberapa karakteristik yang membedakannya dari gerakan atau ideologi lainnya. Memahami ciri-ciri ini sangat penting untuk dapat mengidentifikasi dan mencegah penyebaran paham radikal. Intoleran: Mereka tidak mau menerima perbedaan, baik dalam hal agama, pandangan politik, maupun budaya. Sikap ini seringkali berujung pada diskriminasi atau kebencian terhadap kelompok lain. Fanatik: Mereka memiliki keyakinan yang berlebihan dan tidak mau mendengarkan pendapat orang lain. Sifat ini membuat mereka sulit diajak berdiskusi atau berkompromi. Eksklusif: Mereka merasa kelompoknya adalah yang paling benar dan menganggap kelompok lain salah. Ini menciptakan mentalitas \"kita vs. mereka\" dan seringkali mengarah pada isolasi sosial. Anarkis: Mereka cenderung merusak atau mengacaukan tatanan sosial yang ada untuk mencapai tujuannya. Cara-cara ini bisa berupa kekerasan, perusakan fasilitas publik, atau terorisme. Aspek-Aspek Utama yang Dinilai dalam Tes TKP CPNS Poin Anti-Radikalisme Poin anti-radikalisme dalam Tes Karakteristik Pribadi (TKP) CPNS dirancang untuk mengukur sejauh mana peserta memiliki sikap dan perilaku yang sejalan dengan nilai-nilai Pancasila dan ideologi negara. Penilaiannya tidak didasarkan pada jawaban \"benar\" atau \"salah\" secara mutlak, melainkan pada skor yang diberikan pada setiap pilihan jawaban, mulai dari 1 (terendah) hingga 5 (tertinggi). Aspek-aspek utama yang dinilai dalam subtes anti-radikalisme mencakup: Toleransi dan Keberagaman: Kemampuan untuk menerima dan menghargai perbedaan, baik dari segi suku, agama, ras, dan antargolongan (SARA). Jawaban dengan skor tertinggi biasanya menunjukkan sikap inklusif, menghormati keyakinan orang lain, dan tidak mudah terprovokasi oleh isu-isu sensitif. Kesetiaan pada Pancasila dan NKRI: Sikap yang menunjukkan komitmen kuat terhadap ideologi Pancasila dan kedaulatan Negara Kesatuan Republik Indonesia. Peserta diharapkan mampu menunjukkan tindakan nyata dalam menjaga persatuan dan kesatuan bangsa, serta menolak paham atau gerakan yang bertentangan.   Sikap Terhadap Informasi: Kemampuan untuk bersikap kritis dan tidak mudah percaya pada informasi yang bersifat provokatif atau hoaks, terutama yang disebarkan melalui media sosial. Jawaban dengan skor tinggi akan menunjukkan perilaku verifikasi fakta (tabayyun) dan tidak menyebarkan ujaran kebencian. Peran dalam Masyarakat dan Lingkungan Kerja: Sikap aktif dalam mencegah penyebaran paham radikalisme di lingkungan sekitar, seperti keluarga, teman, atau rekan kerja. Ini bisa diwujudkan dengan cara memberikan edukasi, mengingatkan, atau melaporkan kepada pihak berwenang jika diperlukan. Anti-Radikalisme dan Demokrasi Anti-radikalisme dan demokrasi memiliki hubungan yang saling menguatkan, meskipun terkadang muncul ketegangan di antara keduanya. Secara fundamental, demokrasi adalah sistem yang menjunjung tinggi kebebasan berpendapat, pluralisme, dan hak asasi manusia. Di sisi lain, radikalisme adalah paham yang menolak nilai-nilai tersebut dan seringkali ingin mengganti sistem yang ada dengan kekerasan. Oleh karena itu, gerakan anti-radikalisme memiliki peran krusial dalam melindungi demokrasi. Peran Demokrasi dalam Mengatasi Radikalisme Pluralisme dan Toleransi: Demokrasi mendorong terciptanya masyarakat yang beragam dan toleran. Dalam sistem ini, setiap individu memiliki hak untuk berpendapat, berkeyakinan, dan berorganisasi. Kebebasan ini secara langsung berlawanan dengan sifat radikalisme yang eksklusif dan intoleran. Partisipasi Publik: Demokrasi memberikan ruang bagi masyarakat untuk berpartisipasi dalam proses politik. Dengan adanya saluran-saluran ini (pemilihan umum, demonstrasi damai, petisi), masyarakat memiliki cara untuk menyalurkan aspirasi mereka secara konstitusional, sehingga mengurangi alasan bagi kelompok radikal untuk menggunakan kekerasan sebagai satu-satunya jalan. Supremasi Hukum: Demokrasi berlandaskan pada supremasi hukum. Artinya, semua orang setara di depan hukum. Aturan ini digunakan untuk menindak tegas pelaku radikalisme dan terorisme, tanpa melanggar hak-hak dasar yang dijamin oleh konstitusi. Tantangan Anti-Radikalisme dalam Demokrasi Meskipun saling mendukung, terdapat beberapa tantangan yang muncul. Batas Kebebasan Berpendapat: Demokrasi menjamin kebebasan berpendapat, namun di mana batasnya? Kelompok radikal seringkali memanfaatkan ruang kebebasan ini untuk menyebarkan kebencian dan propaganda. Oleh karena itu, pemerintah harus bijak dalam menentukan kapan suatu ujaran sudah termasuk provokasi atau hasutan. Perlindungan Hak Minoritas: Kelompok radikal seringkali menargetkan kelompok minoritas. Dalam sistem demokrasi, tugas negara adalah melindungi semua warganya tanpa terkecuali, termasuk kelompok minoritas. Namun, hal ini bisa menjadi tantangan jika mayoritas penduduk terpengaruh oleh sentimen radikal. Pengaruh Media Sosial: Kelompok radikal memanfaatkan kebebasan informasi di media sosial untuk menyebarkan paham mereka. Hal ini menjadi tantangan besar bagi negara demokrasi untuk melakukan kontrol tanpa melanggar hak privasi dan kebebasan berekspresi.   Singkatnya, demokrasi adalah alat yang kuat untuk melawan radikalisme, tetapi juga rentan dimanfaatkan oleh kelompok radikal. Oleh karena itu, langkah anti-radikalisme harus dijalankan dengan cerdas dan proporsional, agar tujuan melindungi demokrasi tidak justru mengorbankan nilai-nilai dasar demokrasi itu sendiri."}]}, "ANTI RADIKALISME": {"category": "TKP", "title": "ANTI RADIKALISME", "questions": [{"id": 1, "question": "Suatu hari Anda membaca Buku X yang bercerita tentang kepahlawanan suatu tokoh. Tokoh ini dianggap berjasa terhadap bangsa dan negara. Tokoh ini menurut buku tersebut adalah orang yang telah berjasa dan berkorban karena membela negaranya melawan Belanda dan di masa revolusi. Suatu ketika Anda bertemu dengan rekan Anda yang berprofesi sebagai akademisi di bidang sejarah. Dia bercerita bahwa Tokoh tersebut adalah penghianat nyata bagi bangsa Indonesia karena telah membocorkan rahasia negara. Menanggapi hal ini, sikap Anda ....", "choices": {"A": "Melakukan klarifikasi atas buku yang pernah saya baca dan menanyakan referensi lain yang dia gunakan.", "B": "Berdiskusi terkait buku yang telah Anda baca dan menanyakan argumentasi mengapa Tokoh tersebut dianggap berkhianat.", "C": "Membantah secara keras karena tokoh ini telah berjasa dan berkorban karena membela negara melawan Belanda.", "D": "Tidak mempercayainya karena argumentasinya tidak akademis.", "E": "Mendengarkan dan mempercayainya karena rekan saya ahli dalam bidang tersebut."}, "correct": "B", "pembahasan": "Berdiskusi terkait buku yang telah Anda baca dan menanyakan argumentasi mengapa Tokoh tersebut dianggap berkhianat. Urutan Skor Tertinggi - Rendah = BACED Soal tersebut menguji aspek anti radikalisme. Dalam menanggapi hal ini harus dilakukan secara akademis dan didukung oleh argumentasi yang baik. Tetapi perhatikan kembali konteks mana yang lebih kompleks dan mendalam pada setiap jawaban. Opsi poin 4 hanya melakukan klarifikasi dan bertanya terkiat referensi. Sedangkan pada opsi poin 5, arti berdiskusi tidak hanya melakukan klarifikasi saja, serta arti menanyakan argumentasi dalam kajian akademis tidak hanya menanyakan referensi seperti opsi poin 4, tetapi lebih luas sampai dengan bagaimana argumentasi itu dibangun."}, {"id": 2, "question": "Pesan-pesan yang bermuatan radikalisme mudah diperoleh dari konten di situs online ataupun di media sosial. Anak-anak muda menjadi radikal atau bahkan bergabung dengan kelompok militan melalui ajakan di media sosial. Ketika sedang berselancar di media sosial, Anda menemukan sebuah postingan dengan utas yang berisi artikel terkait menghalalkan darah orang-orang kafir (non-Islam). Postingan tersebut ternyata di-like oleh salah seorang teman Anda yang beragama Islam. Sebagai seorang ASN, maka Anda akan ....", "choices": {"A": "Menegur rekan Anda mengenai postingan tersebut, dan memintanya agar berhati-hati untuk tidak sembarangan me-like postingan serupa.   B. Melaporkan postingan tersebut kepada pihak berwajib agar bisa segera dihentikan penyebarannya dan diselidiki siapa pembuatnya.", "C": "Segera melaporkan teman tersebut ke polisi atau badan penanggulangan terorisme karena sudah terindikasi berpaham radikal.", "D": "Mengabaikannya karena saya sangat mengenal teman saya tersebut, mungkin saja ia tidak sengaja me-like postingan tersebut.", "E": "Mengonfirmasi kepadanya dan menanyakan tujuannya me-like postingan tersebut."}, "correct": "A", "pembahasan": "Menegur rekan Anda mengenai postingan tersebut, dan memintanya agar berhati-hati untuk tidak sembarangan me-like postingan serupa. Urutan Skor Tertinggi - Rendah = ABECD Soal tersebut menguji aspek anti radikalisme dengan tujuan: menjaring informasi dari individu tentang pengetahuan terhadap anti radikalisme, kecenderungan bersikap, dan bertindak saat menanggapi stimulus dengan beberapa alternatif situasi. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda tidak gegabah dan melakukan konfirmasi terlebih dahulu agar tidak terjadi kesalahpahaman. Poin terendah ada pada jawaban yang menunjukkan bahwa anda tidak peduli terhadap bahaya penyebaran paham radikalisme."}, {"id": 3, "question": "Dewasa ini, pesan-pesan yang bermuatan radikalisme mudah diperoleh dari media manapun, baik media cetak maupun media daring. Hal tersebut menyebabkan semakin mudahnya penyebaran paham radikal ke berbagai bidang kehidupan, baik kepada orang tua maupun anak muda. Dalam suatu kesempatan, saat berkunjung ke rumah seorang kerabat Anda, Anda tidak sengaja menemukan sebuah buku tentang anti demokrasi dan tutorial pembuatan bom di sana. Ternyata buku tersebut milik suami dari kerabat Anda.
