uatu jenis penyakit influenza yang ditularkan oleh burung kepada manusia. (2) Dua jenis virus flu burung, yaitu H5N1 dan H7N9, sampai saat ini menyebabkan wabah di Asia, Afrika, Timur Tengah, dan beberapa bagian Eropa. (3) Masa inkubasi virus dari masuk ke tubuh manusia sampai menimbulkan gejala adalah 3-5 hari. (4) Seseorang yang terkena flu burung akan mengalami gejala seperti demam, sakit kepala, pegal-pegal, pilek, batuk, dan sesak. (5) Namun sebelum gejala tersebut muncul, ada juga penderita flu burung yang terlebih dahulu mengalami muntah, sakit perut, diare, gusi berdarah, mimisan, nyeri dada. (6) Pengobatan flu burung harus dilakukan secepat mungkin. (7) Penyakit ini sangat berpotensi menimbulkan komplikasi yang dapat membahayakan nyawa penderitanya, seperti infeksi paru-paru, acute respiratory distress   syndrome, gagal multi organ (misalnya gangguan jantung dan disfungsi ginjal). Gagasan utama yang tepat untuk melanjutkan bacaan di atas ialah …", "choices": {"A": "Hasil penelitian penderita", "B": "Penyebab flu burung", "C": "Cara pencegahan flu burung", "D": "Gejala flu burung", "E": "Risiko flu burung"}, "correct": "B", "pembahasan": "Penyebab flu burung Materi Ide Pokok karena pada paragraf sebelumnya menjelaskan gejala yang akan lebih tepat jika dilanjutkan dengan penyebab gejala tersebut."}, {"id": 10, "question": "(1) Madu dan habbatussauda atau jintan hitam bukan hanya bisa dikonsumsi, tapi juga dikenalmanfaatnya untuk kesehatan. (2) Selain menjaga kesehatan dari dalam tubuh, madu dan habbatussaudajuga bisa sebagai sabun untuk menjaga kesehatan kulit. (3) Praktisi kesehatan Islam Ustadz Febri Sugianto,dia mengatakan bahwa madu memiliki manfaat untuk kulit. (4) Dia mengatakan, dalam sebuah penelitian,terungkap bahwa cairan tersebut bisa menjadi pengawet alami dan anti-bakteri. (5) Selain untukkonsumsi, juga dapat digunakan pada kulit. (6) Soal halal, kedua bahan alam tersebut juga cocok bagimasyarakat Indonesia yang mayoritas beragama Muslim. (7) Menurut Maulani Affandi, Head of SkinCleansing and Baby Unilever Indonesia, keduanya telah digunakan dan dikenal manfaatnya olehmasyarakat Muslim sejak zaman dahulu. (8) Walau begitu, tidak hanya untuk masyarakat Muslim saja,Febri mengatakan bahwa selain di Al Quran, manfaat madu juga terdapat di beberapa kitab agama lain. Diadaptasi dari liputan6.com Kalimat utama pada bacaan di atas adalah nomor....", "choices": {"A": "(8)", "B": "(7)", "C": "(5)", "D": "(3)", "E": "(1)"}, "correct": "E", "pembahasan": "(1) Materi : Ide Pokok Kalimat utama merupakan kalimat yang dapat berdiri sendiri sebelumada pengembang/penjelas, biasanya terletak di awal atau akhir paragraf. Dalambacaan ini, kalimat tersebut ada pada kalimat pertama.   KALIMAT EFEKTIF Penulisan Kata Penulisan kata yang benar sesuai dengan ejaan baku sangat penting untuk komunikasi yang efektif. Kata Dasar Kata dasar ditulis sebagai satu kesatuan. Contoh: pergi, makan, tidur. Kata Turunan Kata turunan adalah kata dasar yang mendapatkan imbuhan. Penulisannya digabung dengan imbuhan. Contoh: pergi menjadi pergian, makan menjadi memakani. Kata Ulang Kata ulang ditulis dengan tanda hubung (-) di antara kata yang diulang. Contoh: anak-anak, buku-buku, hati-hati. Gabungan Kata Gabungan kata yang sudah padu penulisannya digabung menjadi satu. Contoh: Matahari, olahraga, saputangan. Gabungan kata yang belum padu penulisannya dipisah. Contoh: kereta api, rumah sakit. Kata Depan Kata depan, seperti di, ke, dan dari, ditulis terpisah dari kata yang mengikutinya, kecuali pada gabungan kata yang sudah padu. Contoh: di sekolah, ke pasar, dari rumah. Partikel Partikel seperti -lah, -kah, dan -pun ditulis bergabung dengan kata yang mendahuluinya. Contoh: Siapakah dia?, pergilah segera. Namun, partikel pun dapat ditulis terpisah dalam beberapa konteks. Contoh: Jikalau pun dia datang, saya tetap akan pergi. Angka dan Bilangan Angka dalam Teks: Bilangan di bawah sepuluh ditulis dengan huruf, sedangkan bilangan di atas sepuluh bisa ditulis dengan angka. Contoh: Terdapat tiga buku di atas meja. Saya membeli 12 buah apel. Angka dan Nama Bilangan: Angka dan nama bilangan ditulis sebagai satu kesatuan. Contoh: 200, dua ratus. Semua aturan ini dibuat agar bahasa Indonesia menjadi alat komunikasi yang lebih efektif dan terstandar, sehingga kita dapat menyampaikan gagasan dengan lebih jelas dan tepat."}]}, "KALIMAT EFEKTIF": {"category": "TIU", "title": "KALIMAT EFEKTIF", "questions": [{"id": 1, "question": "(1) Berbagai upaya terus dilakukan oleh para ahli untuk menyelamatkan spesies satwa di muka bumi yang terancam punah, salah satunya adalah Badak Putih Utara. (2) Seperti dikutip dari IFL Science, Jumat (21/8/2020) ilmuwan dari The Ol Pejeta Conservancy di kenya mengupayakan penyelamatan spesies tersebut dengan cara mengambil sel telur dari dua badak putih utara betina yang tersisa di planet ini. (3) Sel telur yang telah diambil kemudian akan dibuahi dengan sperma beku yang sebelumnya diambil dari badak putih utara jantan yang telah mati. (4) Sementara embrio akan ditanamkan pada rahim badak betina lain yang sesuai dengan masa kehamilan berlangsung selama 16 hingga 18 bulan. (5) Pandemi yang melanda dunia telah menunda proses pengambilan sel telur ini. (6) Tetapi tim peneliti yang melakukan prosedur itu menyebut jika pengambilan sel telur berjalan lancar dan tanpa komplikasi. Sumber : Kompas Kelemahan teks tersebut adalah...", "choices": {"A": "Tidak terdapat kelemahan.", "B": "Tidak ada paragraf selanjutnya.", "C": "Kalimat penjelas pada kalimat tersebut tidak selaras dengan kalimat utama", "D": "Tujuan penulisan teks tidak dapat diketahui", "E": "Terdapat penulisan yang tidak sesuai PUEBI."}, "correct": "E", "pembahasan": "Terdapat penulisan yang tidak sesuai PUEBI Teks terdapat kesalahan penulisan Badak Putih Utara tidak perlu menggunakan huruf kapital di setiap awal kata dan penulisan kenya yang seharusnya menggunakan huruf kapital pada awal kata karena merupakan nama geografi."}, {"id": 2, "question": "Kemacetan Arus balik akhir pekan (1)Menteri Perhubungan (Menhub) Budi Karya Sumadi berharap tidak ada lonjakan yang signifikan dalam puncak arus balik libur panjang akhir pekan ini. (2) \"Namun untuk mengantisipasi lonjakan kendaraan, Kementrian Perhubuhan (Kemenhub) bersama Korp Lalu Lintas (Korlantas) Kepolisian Republik Indonesia (Polri) dan Jasa Marga tetap siaga, jelas Budi di Cikopo, Jawa Barat, Minggu (23/08/2020). (3) Dalam tinjauannya di sepanjang jalur Tol Jakarta hingga Cikopo, Budi mengatakan, para pihak terkait harus bisa memastikan semua sarana dan prasarana dapat melayani dengan baik. (4) \"Termasuk fasilitas di rest area yang tentunya tetap wajib menerapkan protokol kesehatan,\" sambung Budi. (5) Selain itu, Budi mengimbau masyarakat agar tidak kembali pada waktu bersamaan pada puncak arus balik untuk menghindari kemacetan parah. (6) \"Masyarakat juga harus memastikan kendaraan dan pengendara dalam keadaan prima serta mematuhi protokol kesehatan seperti menggunakan masker, cuci tangan, dan jaga jarak saat berada di tempat istirahat,\" imbaunya. Sumber: Kompas Kesalahan penulisan pada kalimat 4 adalah....", "choices": {"A": "Penulisan fasilitas", "B": "Penulisan protokol", "C": "Penulisan tanda petik (...)", "D": "Penulisan rest area   E. Penulisan tanda baca titik (.)"}, "correct": "D", "pembahasan": "Penulisan rest area Penulisan rest area harusnya dimiringkan karena merupakan bahasa asing."}, {"id": 3, "question": "(1)John Coates, Wakil Presiden International OlympicCommittee (IOC) mengonfirmasi pada AFP bahwa Olimpiade akan dimulai pada 23Juli tahun depan. (2)Sebelumnya, perhelatan akbar ini dijadwalkan mulai padaJuli 2020, namun terpaksa ditunda karena ancaman COVID-19. (3)Olimpiade Tokyoyang ditunda akan dilanjutkan tahun depan \"dengan atau tanpa COVID\",kata Coates di halaman BBC. (4)IOC sebelumnya mengatakan, perhelatan yang akandiselenggarakan di Jepang merupakan permainan rekonstruksi setelah gempa dantsunami yang melanda pada 2011. (5)Namun, kali ini adalah tentang perjuanganmelawan COVID-19. (6)Chief Executive Olimpiade Tokyo 2020, Toshiro Mutomengatakan bahwa penonton akan dibatasi. (7)Mereka juga menyiapkan kemungkinantanpa penonton sama sekali. (8)Muto menambahkan bahwa pihak Olimpiade akan'menyederhanakan' upacara pembukaan dan penutupan serta mengurangi staff dandelegasi dari masing-masing negara. (9)Lebih dari 11.000 atlet dari 200 negaratelah dijadwalkan untuk berpartisipasi pada Olimpiade 2020. (10)Namun belumdijelaskan mengenai kebijakan perjalanan mengingat perbatasan Jepang, sebagianbesar masih ditutup untuk pengunjung asing sampai saat ini (11)Muto juga mengatakan vaksin bukanlah prasyarat untukOlimpiade, meskipun ahli kesehatan meragukan apakah Olimpiade dapat diadakan tanpaadanya vaksin. (12)\"Jika vaksin siap, itu akan menjadi keuntungan, tetapikami tidak mengatakan tidak bisa menyelenggarakan acara tanpanya--ini bukanprasyarat,\" ungkapnya kepada BBC. Sumber: nationalgeographic.grid.id Perbaikan yang tepat untuk kalimat nomor (8) pada teks tersebut adalah", "choices": {"A": "Muto menambahkan bahwa pihak olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi staff dan delegasi dari masing-masing negara.", "B": "Muto menambahkan bahwa pihak olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi staff dan delegasi dari masing-masing Negara.", "C": "muto menambahkan bahwa pihak Olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi staff dan delegasi dari masing-masing negara.", "D": "Muto menambahkan bahwa pihak olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi stuff dan delegasi dari masing-masing Negara.", "E": "Muto menambahkan bahwa pihak Olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi staf dan delegasi dari masing-masing negara."}, "correct": "E", "pembahasan": "Muto menambahkan bahwa pihak Olimpiade akan menyederhanakan upacara pembukaan dan penutupan serta mengurangi staf dan delegasi dari masing-masing negara. Materi : Memperbaiki Kalimat Menyederhanakan tidak perlu tanda petik karena tidak mempunyai arti khusus. Kemudian staff seharusnya staf yang sesuai dengan KBBI"}, {"id": 5, "question": "\"Mbak Ani sedang memasak opor ayam di dapur sebab kedua anaknya sedang tidur di kamarnya.\" Kali mat tersebut dapat menjadl kalimat efektif yaitu ...", "choices": {"A": "Tidak ada yang perlu diperbalki.", "B": "Menghilangkan kata sebab.", "C": "Menghilangkan kata sedang.", "D": "Mengganti kata sebab dengan dan.", "E": "Menambahkan kata agar sebelum sebab."}, "correct": "D", "pembahasan": "Mengganti kata sebab dengan dan Kalimat tersebut tidak efektif dikarenakan kesalahan kbnjungsi (kata hubung) yang digunakan. Kata hubung sebab tidak cocok digunakan pada kalimat tersebut sehingga harus diganti dengan kata lain. Kata yang cocok untuk menggabungkan dua 'kalimat tersebut adalah kata dan."}, {"id": 6, "question": "\"Banyak anak-anak sedang mengantri makanan di ruang makan pagi ini.\" Kalimat diatas tidak efektif dan bisa menjadi efektif dengan cara ...", "choices": {"A": "Menghilangkan kata yang.", "B": "Menghilangkan kata banyak.", "C": "Menambah kata saat sebelum kata di.", "D": "Menghilangkan kata makanan.", "E": "Mengganti kata sedang dengan tengah."}, "correct": "B", "pembahasan": "Menhilangkan kata banyak Dalam soal ini terdapat kata yang mubazir. Kata mubazir adalah penggunaan kata yang berlebih, yang seharusnya tidak perlu ada. Penggunaan kata \"banyak\" memiliki makna jamak yang sama dengan makna pengulangan kata pada \"anak-anak\". Sehingga untuk menjadi kalimat yang efektif harus dihilangkan salah satunya."}, {"id": 7, "question": "\"Sebuah jurnal kesehatan mengatakan·bahwa kandungan purin pada kangkung cukup rendah.\" Kalimat di atas tidak logis dikarenakan kata ...", "choices": {"A": "Sebuah jurnal kesehatan", "B": "Kandungan", "C": "Mengatakan", "D": "Cukup rendah", "E": "Purin"}, "correct": "C", "pembahasan": "Mengatakan   Kalimat tersebut tidak logis dikarenakan kata \"mengatakan\". Sebuah jurnal adalah benda mati yang tidak mungkin bisa berbicara sehingga mustahil untuk mengatakan sesuatu. Akan lebih logis jika \"sebuah jurnal menyatakan ... \"."}, {"id": 8, "question": "Bulatnyatekad Anastasya dalam menjuangkan nasib anak-anaknya akhirnya membuahkan hasil yang Bahagia bagi dirinya. Kesalahan penggunaan kata dalam kalimat di atas ialah ...", "choices": {"A": "Sedikit, seharusnya sesedikit mungkin", "B": "Bulatnya, seharusnya sebulatnya.", "C": "Akhirnya, seharusnya akhiri", "D": "Membuahkan, seharusnya membuahi", "E": "Menjuangkan, seharusnya memperjuangkan"}, "correct": "E", "pembahasan": "Menjuangkan, seharusnya memperjuangkan Di dalam kalimat tersebut terdapat kata yang tidak baku. Kata yang tidak baku adalah kata \"menjuangkan\" yang seharusnya diganti menjadi kata \"memperjuangkan\"."}, {"id": 9, "question": "Manakah kalimat dibawah ini yang tidak efektif, kecuali ...", "choices": {"A": "Baik mahasiswa baru atau mahasiswa lama dikenakan peraturan yang sama.", "B": "Jakarta adalah merupakan salah satu kota tersibuk di Indonesia.", "C": "Demi untuk kehidupan keluarganya, Bu Susi rela bekerja tanpa henti.", "D": "Saran yang dikemukakannya akan kami pertimbangkan.", "E": "Ada banyak macam-macam makanan-makanan yang dljual di restoran itu."}, "correct": "D", "pembahasan": "Saran yang dikemukakan akan kami pertimbangkan Kalimat yang efektif adalah kalimat \"saran yang dikemukakannya akan kami pertimbangkan\". Pada opsi A tidak efektif dikarenakan pengguriaan kata baik seharusnya ditemani dengan maupun bukan atau. Pada opsi B terdapat double predikat yaitu adalah merupakan sehingga harus dihapus salah satunya. Pada opsi Cada kata yang mubazir yaitu demi dan untuk. · Pada opsi Eada kata mubazir yaitu kata banyak dengan kata macammacam."}, {"id": 10, "question": "Manakah dibawah ini yang termasuk kalimat efektif ...", "choices": {"A": "Setelah bekerja seharian, Putri beristirahat.", "B": "Baik Budi atau Susan diberikan hukuman selama tiga tahun penjara.", "C": "Minggu kemarin banyak para pegawai yang melakukan demonstrasi.", "D": "Taufik merupakan salah satu atlit berprestasi.", "E": "Waiau masih pagi, tapi Pak Joko sudah beraktivitas."}, "correct": "A", "pembahasan": "Setelah bekerja seharian, Putri beristirahat. Kalimat yang termasuk kalimat efektif adalah \"setelah bekerja seharian, Putri beristirahat\". Pada opsi B tidak efektif dikarenakan penggunaan baik seharusnya ditemani dengan kata maupun.   Pada opsi C terdapat kata yang mubazir yaitu kata banyak yang bermakna jamak dengan kata para yang memiliki makna jamak juga. Pada opsi D ada kata yang tidak baku yaitu kata atlit yang seharusnya atlet. Pada opsi E ada kata yang tidak baku seharusnya tetapi.    ANALOGI � Pengertian Analogi Analogi adalah bentuk soal yang menguji kemampuan berpikir logis melalui hubungan makna antara dua kata atau lebih. Tujuannya untuk mengukur: ✔ Logika verbal  ✔ Pemahaman hubungan kata  ✔ Penalaran sebab-akibat  ✔ Kemampuan berpikir deduktif dan induktif Format umum soal: A:B=C:D Artinya: hubungan antara A dan B harus sama dengan hubungan C dan D.  � Jenis Hubungan dalam Soal Analogi Penting untuk mengidentifikasi jenis hubungan sebelum menentukan jawaban. Berikut kategori paling umum dalam TIU: � Hubungan Sinonim (Persamaan Kata) Contoh: Indah : Cantik = Besar : ____ Jawaban → Gede � Hubungan Antonim (Lawan Makna) Contoh: Hidup : Mati = Tinggi : ____ Jawaban → Rendah � Hubungan Bagian ke Keseluruhan / Whole-Part Contoh: Jari : Tangan = Bab : Buku Artinya: Jari bagian dari tangan, seperti bab bagian dari buku.  � Hubungan Fungsi Contoh: Pisau : Memotong = Pena : Menulis   � Hubungan Sebab – Akibat Contoh: Hujan : Banjir = Panas : Kekeringan  � Hubungan Alat – Bahan Contoh: Kuas : Cat = Pensil : Grafit  � Hubungan Tempat – Objek Contoh: Buku : Perpustakaan = Hewan : Kebun Binatang  � Hubungan Klasifikasi / Kelompok Contoh: Mangga : Buah = Melati : Bunga � Teknik Cepat Mengerjakan Soal Analogi Gunakan langkah berikut: � Langkah 1: Identifikasi hubungan kata pertama Tentukan apakah kata tersebut bersinonim, fungsi, bagian, atau hubungan lainnya. � Langkah 2: Terapkan hubungan ke pilihan jawaban Jawaban yang benar adalah yang memiliki hubungan paling mirip dan konsisten. � Langkah 3: Eliminasi jawaban tidak logis Beberapa pilihan biasanya mirip, tetapi hanya satu yang paling tepat secara logika. � Tanda-Tanda Jawaban Salah � Tidak memiliki hubungan makna yang jelas � Relasi tidak searah (contoh: objek → alat bukan alat → objek) � Terasa hanya sinonim tanpa relevansi struktur   � Pola Jebakan yang sering digunakan pada CPNS: Pola Jebakan  Contoh  Kenapa Salah  Jawaban hanya sinonim  Besar = Gede  Tidak sesuai pola logika hubungan  Konsep terbalik  Matahari → Panas  Bisa tetapi bukan hubungan yang ditanyakan  Jawaban terlalu umum  Hewan = Mamalia  Tidak sepadan dengan hubungan pola soal  � Tips Menguasai Soal Analogi ✔ Perbanyak kosakata (Sinonim & Antonim)  ✔ Latihan memahami hubungan logika, bukan menghafal kata ✔ Jawab soal mudah dulu untuk menghemat waktu ✔ Gunakan teknik eliminasi cepat  ✔ Hindari overthinking — hubungan harus natural dan logis � Rangkuman Inti •  Analogi menguji logika verbal dan penalaran makna hubungan kata  •  Polanya: A berhubungan dengan B seperti C berhubungan dengan D  •  Jenis hubungan: sinonim, antonim, fungsi, sebab-akibat, bagian-kekeseluruhan, alat-bahan, objek-tempat, klasifikasi  •  Kunci sukses: identifikasi pola → terapkan → eliminasi jawaban"}]}, "ANALOGI": {"category": "TIU", "title": "ANALOGI", "questions": [{"id": 1, "question": "SINGA : RUSA = ANTISEPTIK : .....", "choices": {"A": "Obat", "B": "Hama", "C": "Penyakit", "D": "Kuman", "E": "Kotoran"}, "correct": "D", "pembahasan": "Kuman Singa membunuh rusa. Antiseptik membunuh kuman"}, {"id": 2, "question": "PANGGUNG : AKTOR = .. : .....", "choices": {"A": "Perpustakaan : Dosen", "B": "Keamanan : Polisi", "C": "Ring : Petinju", "D": "Musik : Konduktor", "E": "Uang : Mesin"}, "correct": "C", "pembahasan": "Ring : Petinju Panggung tempat beraksi aktor. Ring tempat beraksi petinju."}, {"id": 3, "question": "MAKAN : LAPAR = LAMPU : .....", "choices": {"A": "Padang", "B": "Pijar", "C": "Terang", "D": "Gelap", "E": "Sinar"}, "correct": "D", "pembahasan": "Gelap Butuh makan karena lapar, butuh lampu karena gelap."}, {"id": 4, "question": "KOMPONIS : SIMPONI = ...... : ......", "choices": {"A": "Aktor : Komedi", "B": "Konduktor : Orkestra", "C": "Sutradara : Film", "D": "Penyair : Soneta", "E": "Penyanyi : Lagu"}, "correct": "C", "pembahasan": "Sutradara : Film Komponis membuat simponi, sutradara membuat film."}, {"id": 5, "question": "RATA : MULUS = .. : .....", "choices": {"A": "Perahu : Tenggelam", "B": "Jari-Jari : Lingkaran", "C": "Kapak : Pengasah", "D": "Bengkok : Liku", "E": "Terjal : Jurang"}, "correct": "D", "pembahasan": "Bengkok : Liku Mulus apabila rata. Liku apabila bengkok."}, {"id": 6, "question": "… : GILA = LEMBAB : …", "choices": {"A": "Otak – Kulit", "B": "Aksi – Basah", "C": "Orang – Udara", "D": "Akal – Kering", "E": "Syaraf – Ruang"}, "correct": "D", "pembahasan": "Akal – Kering GILA karena tidak ada AKAL, sebagaimana LEMBAB karena tidak KERING"}, {"id": 7, "question": "PEMBURU : SENJATA : BURUNG = … : … : …", "choices": {"A": "Dokter : Stetoskop : Suntik", "B": "Sopir : Bus : Darat", "C": "Polisi : Borgol : Penjahat", "D": "Tenda : Kemah : Api Unggun", "E": "Pahlawan : Bambu Runcing : Panah"}, "correct": "C", "pembahasan": "Polisi : Borgol : Penjahat PEMBURU menggunakan SENJATA untuk menangkap BURUNG, sebagaimana POLISI menggunaan BORGOL untuk menangkap Penjahat"}, {"id": 9, "question": "... : SIANG = TITIK : …", "choices": {"A": "Pagi – Huruf Kapital", "B": "Sore – Bacaan", "C": "Panas – Koma", "D": "Matahari – Berhenti", "E": "Malam – Koma"}, "correct": "D", "pembahasan": "Matahari – Berhenti Matahari menandakan kalua siang hari dan titik menandakan harus berhenti.   SILOGISME � Pengertian Silogisme Silogisme adalah bentuk penalaran logis yang terdiri dari dua premis (pernyataan) dan satu kesimpulan. Kesimpulan diperoleh dari relasi logis antara kedua premis tersebut. Formatnya: •  Premis 1 Premis 2 ———— Kesimpulan  Silogisme mengukur: ✔ logika deduktif  ✔ kemampuan menarik kesimpulan ✔ konsistensi pola pikir  ✔ pemahaman relasi konsep � Bentuk Premis dalam Soal Silogisme Premis dalam soal biasanya berbentuk: Bentuk Kalimat  Contoh  Universal Positif (Semua/Setiap)  Semua burung bisa terbang  Universal Negatif (Tidak satu pun)  Tidak ada kucing yang bisa terbang  Partikular Positif (Sebagian)  Sebagian siswa rajin  Partikular Negatif (Sebagian tidak) Sebagian pegawai tidak disiplin  � Pola Silogisme Umum Berikut pola yang sering muncul di CPNS beserta pola kesimpulannya: �"}]}, "SILOGISME": {"category": "TIU", "title": "SILOGISME", "questions": [{"id": 1, "question": "Jika Bianca mengajar piano maka ia juga mengajar musik klasik. Jika Bianca mengajar musik klasik maka Aliya belajar bernyanyi. Aliya belajar Filsafat.", "choices": {"A": "Bianca tidak mengajar piano", "B": "Aliya belajar musik klasik", "C": "Bianca mengajar bernyanyi", "D": "Aliya tidak belajar piano dan Filsafat", "E": "Bianca mengajar piano"}, "correct": "A", "pembahasan": "Bianca tidak mengajar piano p = Bianca mengajar piano q = Bianca mengajar musik klasik r = Aliya belajar Filsafat P1 : p => q P2 : q => r P3 : ~ ~ r Kesimpulan dari premis 1 dan premis 2 menggunakan silogisme yang mana didapat hasilnya p => r. Kemudian kesimpulan dari premis 1 dan premis 2 ditulis menjadi premis"}, {"id": 2, "question": "Jika Inzaghi diterima bekerja bulan ini, ia akan membeli motor dengan cicilan. Jika Inzaghi membeli motor dengan cicilan, ia akan mengikuti tes mengemudi untuk mendapatkan SIM C. Inzaghi tidak mengikuti tes mengemudi.", "choices": {"A": "Inzaghi diterima bekerja bulan depan.", "B": "Inzaghi tidak diterima bekerja bulan ini.", "C": "Inzaghi membeli motor dengan cicilan.", "D": "Inzaghi membeli motor secara tunai.", "E": "Inzaghi mendapatkan SIM C."}, "correct": "B", "pembahasan": "Inzaghi tidak diterima bekerja bulan ini. p = Inzaghi diterima bekerja bulan ini q = Inzaghi akan membeli motor dengan cicilan   r = Inzaghi akan mengikuti tes mengemudi untuk mendapatkan SIM C P1 : p => q P2 : q => r P3 : ~r Kesimpulan dari premis 1 dan premis 2 menggunakan silogisme yang mana didapat hasilnya p => r Kemudian kesimpulan dari premis 1 dan premis 2 ditulis menjadi premis"}, {"id": 3, "question": "Jika Tono lulus Kurang dari atau sama dengan empat tahun, maka ia akan diterima berkerja sebagai karyawan di perusahaan A. Jika Tono sudah bekerja di perusahaan A, maka ayahnya akan membelikan Tono sebuah sepeda motor. Tono tidak mendapat sepeda motor dari ayahnya. Kesimpulan?", "choices": {"A": "Tono menyelesaikan studinya kurang dari 4 tahun", "B": "Tono tidak bekerja di perusahaan", "C": "Tono menyelesaikan studinya tepat 4 tahun", "D": "Tono bekerja dengan sepeda motor", "E": "Tono menyelesaikan studinya lebih dari 4 tahun"}, "correct": "E", "pembahasan": "Tono menyelesaikan studinya lebih dari 4 tahun Premis 1 = p => q (Jika Tono lulus kurang dari satu atau sama dengan 4 tahun, maka ia akan diterima berkerja sebagai karyawan di perusahaan A). Premsi 2 = q => r (Jika Tono sudah bekerja di perusahaan A, maka ayahnya akan membelikan Tono sebuah sepeda motor). Premis 3 = ~r (Tono tidak mendapat sepeda motor dari ayahnya). Dengan menggunakan rumus modus Silogisme, kita bisa mendapat kesimpulan premis 1 dan premis 2 berupa p => r (Jika Tono lulus kurang dari satu atau sama dengan 4 tahun, maka ayahnya akan membelikan Tono sebuah sepeda motor). Kesimpulan : Tono menyelesaikan studinya lebih dari 4 tahun"}, {"id": 4, "question": "Wawan rajin belajar maka naik kelas Wawan dapat hadiah atau tidak naik kelas Wawan rajin belajar Kesimpulan yang sah adalah", "choices": {"A": "Wawan dapat Hadiah", "B": "Wawan naik kelas dan dapat hadiah", "C": "Wawan naik kelas", "D": "Wawan tidak dapat hadiah", "E": "Wawan tidak dapat hadiah dan naik kelas"}, "correct": "A", "pembahasan": "Wawan dapat Hadiah Kita misalkan dulu beberapa pernyataan soal dengan simbol berikut: p = Wawan rajin belajar, q = Wawan naik kelas r = Wawan dapat hadiah Setelah disimbolkan dengan p, q, dan r, maka ketiga premis di soal dapat ditulis: Premis 1 = p => q Premis 2 = r v ~q Premis 3 = p   Perhatikan bahwa premis 2 memiliki bentuk ekuivalen r v ~q = ~q v r = q => r. Sehingga, ketiga premis di atas dapat ditulis: Premis 1 = p => q Premis 2 = q => r Premis 3 = p Dengan menggunakan rumus Modus Silogisme, maka kesimpulan dari Premis 1 dan 2 adalah p => r. Kemudian dengan menggunakan rumus Modus Ponens, kesimpulan dari pernyataan p => r dan pernyataan p, akan menghasilkan kesimpulan akhir berupa r. Sehingga, kesimpulannya yaitu \"Wawan dapat hadiah\""}, {"id": 5, "question": "Jika cuaca cerah, maka lapangan akan kering. Hari ini cuaca cerah.", "choices": {"A": "Cuaca tidak cerah", "B": "Lapangan basah karena cuaca hujan", "C": "Lapangan akan kering hari ini", "D": "Cuaca tidak cerah, maka lapangan akan kering", "E": "Lapangan kering karena cuaca cerah"}, "correct": "C", "pembahasan": "Lapangan akan kering hari ini Premis 1: Jika cuaca cerah, maka lapangan akan kering. Premis 2: Hari ini cuaca cerah. Kesimpulan: Lapangan akan kering hari ini"}, {"id": 6, "question": "Jika Lisa rajin belajar maka dia akan memperoleh Indeks Prestasi yang baik. Lisa tidak rajin belajar. Maka kesimpualnnya …", "choices": {"A": "Lisa memperoleh Indeks Prestasi yang baik", "B": "Lisa memperoleh Indeks Prestasi yang baik walaupun tidak rajin belajar", "C": "Lisa adalah anak yang pandai", "D": "Lisa tidak mendapat Indeks Prestasi yang baik", "E": "Tidak dapat disimpulkan"}, "correct": "E", "pembahasan": "tidak dapat disimpulkan Premis 1: 𝑝𝑝 → 𝑞𝑞 Premis 2: ~ 𝑝𝑝 Kesimpulan : TDDS Premis 1: Jika Lisa rajin belajar maka dia akan memperoleh Indeks Prestasi yang baik 𝑝𝑝 = Lisa rajin belajar 𝑞𝑞 = dia akan memperoleh Indeks Prestasi yang baik Premis 2: Lisa tidak rajin belajar ~ 𝑝𝑝 = Lisa tidak rajin belajar Kesimpulan : TDDS"}, {"id": 7, "question": "Tempat makan bakso dan soto ramai saat hujan deras. Saat ini tidak hujan deras", "choices": {"A": "Tempat makan bakso dan soto ramai", "B": "Semua tempat makan bakso dan soto ramai", "C": "Jika tidak hujan deras maka tempat makan bakso dan soto tidak ramai", "D": "Jika hujan deras maka tempat makan bakso dan soto tidak ramai", "E": "Tempat makan bakso dan soto tidak ramai"}, "correct": "E", "pembahasan": "Tempat makan bakso dan soto tidak ramai Modus Tallens Premis 1: 𝑝𝑝 → 𝑞𝑞 Premis 2: ~ 𝑞𝑞 Kesimpulan : ~ 𝑝𝑝 Premis 1: Tempat makan bakso dan soto ramai saat hujan deras.   𝑝𝑝 = Tempat makan bakso dan soto ramai 𝑞𝑞 = hujan deras. Premis 2: Saat ini tidak hujan deras ~ 𝑞𝑞 = Saat ini tidak hujan deras Kesimpulan: ~ 𝑝𝑝 = Tempat makan bakso dan soto tidak ramai"}, {"id": 8, "question": "Semua sepeda motor dilengkapi speedometer. Sebagain sepeda motor berwarna biru.", "choices": {"A": "Sebagian sepeda motor tidak dilengkapi speedometer dan tidak berwarna biru", "B": "Sebagian sepeda motor berwarna biru dan tidak dilengkapi speedometer", "C": "Semua sepeda motor berwarna biru dan dilengkapi speedometer", "D": "Semua sepeda motor yang berwarna biru dilengkapi speedometer", "E": "Semua sepeda motor tidak berwarna biru dan dilengkapi speedometer"}, "correct": "D", "pembahasan": "Semua sepeda motor yang berwarna biru dilengkapi speedometer Premis 1: 𝐴𝐴 → 𝐵𝐵 Premis 2: 𝐴𝐴 → 𝐶𝐶 Kesimpulan : 𝑆𝑆𝑆𝑆𝑆𝑆𝑆𝑆𝑆𝑆 𝐴𝐴 𝑦𝑦𝑦𝑦𝑦𝑦𝑦𝑦 𝐶𝐶 → 𝐵𝐵 Premis 1 = Semua sepeda motor dilengkapi speedometer 𝐴𝐴 = sepeda motor 𝐵𝐵 = dilengkapi speedometer Premis 2: Sebagain sepeda motor berwarna biru 𝐴𝐴 = sepeda motor 𝐶𝐶 = berwarna biru Sehingga, P1 = Semua 𝐴𝐴 → 𝐵𝐵 P2 = Sebagian 𝐴𝐴 → 𝐶𝐶 ∴ Semua 𝐴𝐴 𝑦𝑦𝑦𝑦𝑦𝑦𝑦𝑦 𝐶𝐶 → 𝐵𝐵 Kesimpulan yang tepat adalah semua sepeda motor yang berwarna biru dilengkapi speedometer."}, {"id": 9, "question": "Ayah selalu bepergian dengan ibu. Ibu selalu beergian dengan adik.", "choices": {"A": "Jika ayah bepergian, maka adik tidak bepergian", "B": "Jika ibu bepergian, maka ayah tak bepergian", "C": "Jika adik tak bepergian, maka ayah tak bepergian", "D": "Jika adik bepergian, maka ayah tak bepergian", "E": "Jika adik tak bepergian, maka ayah bepergian"}, "correct": "C", "pembahasan": "Jika adik tak bepergian, maka ayah tak bepergian Silogisme Premis 1: 𝑝𝑝 → 𝑞𝑞 Premis 2: 𝑞𝑞 → 𝑟𝑟 Kesimpulan : 𝑝𝑝 → 𝑟𝑟 Premis 1 = Ayah selalu bepergian dengan ibu 𝑝𝑝 = Ayah selalu bepergian 𝑞𝑞 = ibu Premis 2 = Ibu selalu beergian dengan adik   𝑞𝑞 = Ibu selalu bepergian 𝑟𝑟 = adik Sehingga, P1 = 𝑝𝑝 → 𝑞𝑞 P2 = 𝑞𝑞 → 𝑟𝑟 ∴ 𝑝𝑝 → 𝑟𝑟 ≡ ~ 𝑟𝑟 → ~ 𝑝𝑝 Kesimpulan yang tepat adalah jika adik tak bepergian, maka ayah tak bepergian"}, {"id": 10, "question": "Premis 1: Jika harga BBM naik, maka harga bahan pokok naik Premis 2: Jika harga bahan pokok naik maka semua orang tidak senang Kesimpulan yang sah adaah …", "choices": {"A": "Jika harga BBM tidak naik, maka semua orang tidak senang", "B": "Jika harga BBM naik, maka semua orang tidak senang", "C": "Jika harga BBM naik, maka semua orang senang", "D": "Jika harga BBM tidak naik, maka semua orang senang", "E": "Jika harga BBM naik, maka harga bahan pokok naik"}, "correct": "B", "pembahasan": "Jika harga BBM naik, maka semua orang tidak senang Silogisme Premis 1: 𝑝𝑝 → 𝑞𝑞 Premis 2: 𝑞𝑞 → 𝑟𝑟 Kesimpulan : 𝑝𝑝 → 𝑟𝑟 Premis 1 = Jika harga BBM naik, maka harga bahan pokok naik 𝑝𝑝 = harga BBM naik 𝑞𝑞 = harga bahan pokok naik Premis 2 = Jika harga bahan pokok naik maka semua orang tidak senang   PENALARAN ANALITIS �"}]}, "PENALARAN ANALITIS": {"category": "TIU", "title": "PENALARAN ANALITIS", "questions": [{"id": 1, "question": "Dalam mata pelajaran matematika Fari selalu kalah apabila dibandingkan dengan Tamam, tetapi untuk mata pelajaran lainnya, ia selalu unggul bila dibandingkan dengan Tamam. Kiki selalu unggul dalam mata pelajaran bahasa Inggris dibanding Tamam, tetapi dalam pelajaran matematika ia kalah bila dibandingkan dengan Fari. Jeje adalah siswa terbaik dalam pelajaran matematika, tetapi ia kalah dari Tamam dalam pelajaran bahasa   Inggris. Rara lebih baik daripada Fari dalam bahasa inggris sedangkan dalam pelajaran matematika ia menempati urutan di bawah Jeje. Fari lebih baik dalam pelajaran bahasa inggris daripada Kiki. Siapakah yang menjadi siswa terbaik dalam pelajaran bahasa Inggris?", "choices": {"A": "Fari", "B": "Tamam", "C": "Kiki", "D": "Jeje", "E": "Rara"}, "correct": "E", "pembahasan": "Rara Dari informasi dalam teks, dapat disusun pola seperti dibawah ini: Matemtika Bahasa Inggris T>FF>KJ>FJ>TJ>KJ>R F>TK>TT>J Siswa terbaik dalam pelaharan bahasa inggris adalah Rara"}, {"id": 2, "question": "Para orang calon penumpang duduk sesuai urutan. Rina tidak bersebelahan dengan Rino atau Rosa. Rosi duduk di dekat Rosa. Rina duduk di dekat Roy dan Roy duduk di sebelah Rosi. Rino tidak ingin didahului Rio dan Rio bersebelahan dengan Rina. Rosa duduk di urutan terakhir. Siapakah calon penumpang di urutan kedua?", "choices": {"A": "Rina", "B": "Roni", "C": "Rosa", "D": "Rosi", "E": "Rio"}, "correct": "E", "pembahasan": "Rio Posisi urutan duduk: Karena Rosa duduk di urutan terakhir dan Rosi duduk di sebelah Rosa maka - - - - Rosi Rosa Karena Rina duduk di dekat Roy dan Roy duduk di sebelah Rosi maka - - Rina Roy Rosi Rosa Karena Rino tidak ingin didahului Rio dan Rio bersebelahan dengan Rina maka Rino Rio Rina Roy Rosi Rosa"}, {"id": 3, "question": "Pemain catur yang akan dipasangkan terdiri dari Wiwi, Sisi, Riri, Puput, Alim, Baba, Mario, dan Adil. Pemain catur laki-laki harus melawan pemain perempuan oleh karena itu mereka duduk berhadapan dengan lawannya di empat bidak papan catur yang berderet secara berurutan. Semua pemain catur perempuan duduk di deretan yang sama. Papan catur nomor 3 terletak paling kiri. Papan catur nomor 2 terletak di antara papan catur nomor 1 dan 4. (a) Mario berhadapan dengan lawannya di papan catur nomor 4 yang letaknya 2 papan catur di kanan papan catur nomor 1. (b) Sisi ada di papan catur nomor 3. (c) Wiwi duduk di papan catur beda dua sebelah kanan Puput. (d) Baba melawan Sisi dan Alim tidak bermain catur di sebelah papan catur Mario. Pemain catur perempuan yang duduk di papan catur nomor 1, 2, 3, dan 4 adalah ....", "choices": {"A": "Puput, Riri, Sisi, Wiwi.   B. Puput, Wiwi, Sisi, Riri.", "C": "Wiwi, Riri, Sisi, Puput.", "D": "Riri, Puput, Sisi, Wiwi.", "E": "Wiwi, Puput, Sisi, Riri."}, "correct": "A", "pembahasan": "Puput, Riri, Sisi, Wiwi. Karena papan catur nomor 3 terletak paling kiri, papan catur nomor 2 terletak diantara papan catur nomor 1 dan"}, {"id": 4, "question": "Lembaga pelatihan buka tiap hari dengan 6 pelatihan utama, yaitu latihan vokal, melukis, beladiri, senam, piano, dan teater. Setiap hari hanya ada 1 pelatihan utama tetapi tiap 2 hari sekali ada tambahan pelatihan bahasa   asing. Awal minggu dimulai dengan hari Senin. Pada hari Rabu diberikan pelatihan melukis dan bahasa asing. (a) Bela diri ada di antara melukis dan teater. (b) melukis diberikan 2 hari setelah senam. (c) Piano ditawarkan 2 kali seminggu, tetapi tidak boleh berurutan. Urutan pelatihan utama dari hari Senin-Jumat adalah ...", "choices": {"A": "Senam, Piano, melukis, Bela diri, Teater", "B": "Senam, Piano, melukis, Teater, Bela diri.", "C": "Senam, Latihan Vokal, melukis, Bela diri, Teater.", "D": "Senam, Teater, melukis, Bela diri, Teater.", "E": "Senam, melukis, Bela diri, Teater, Piano."}, "correct": "A", "pembahasan": "Senam, Piano, melukis, Bela diri, Teater Keterangan: Vokal = V Melukis = M Bela diri = B Senam = S Piano = P Teater = T Bahasa Asing = Ba Karena pelatiahan melukis dan bahasa asing hari rabu dan tiap 2 hari sekali ada tambahan pelatihan bahasa asing maka:  Karena Bela diri ada di antara melukis dan teater dan melukis diberikan 2 hari setelah senam  Karena Piano ditawarkan 2 kali seminggu, tetapi tidak boleh berurutan maka:  Jadi urutan pelatihan dari senin – jumat adalah Senam, Piano, Melukis, Bela diri,Teater"}, {"id": 5, "question": "Amar siswa terpandai bermain catur. Amin kalah pandai daripada Amir, tapi Amir sama pandainya dengan Amal,", "choices": {"A": "Amir lebih pintar daripada Amar", "B": "Amal lebih pandai daripada Amin", "C": "Amar sama pandainya dengan Amin", "D": "Amir yang paling pandai bersama Amin", "E": "Tidak ada pilihan jawaban yang benar"}, "correct": "B", "pembahasan": "Amal lebih pandai daripada Amin Dari informasi pada soal: Amar paling pandai Amir > Amin Amir = Amal Sehingga, urutan dari yang terpandai adalah: Amar Amal/ Amir Amin. Sehingga, pernyataan yang sesuai adalah: Amal lebih pandai daripada Amin."}, {"id": 7, "question": "Keluarga Wawan sedang duduk mengobrol, Azzam dan Fatih adalah kedua anak Pak Wawan. Keempat anggota keluarga duudk di empat kursi yang disusun belajar. Di ujung kanan duduk Bu Lili dan di ujung kiri duduk Fatih. Azzam dan pak Wawan duduk di antara keduanya. Jika Fatih bertukar tempat dengan Azzam yang duduk paling dekat dengannya dan sejenak kemudian Azzam bertukar posisi dengan Bu Lili, manakah pernyataan yang paling tepat untuk menggambarkan keadaan setelah bertukar posisi?", "choices": {"A": "Fatih duduk di paling ujung kanan", "B": "Pak Wawan berada di antara Bu Lili dan Fatih", "C": "Bu Lili duduk bersebelahan dengan suaminya", "D": "Azzam duduk berjauhan dengan ayahnya", "E": "Azzam akhirnya duduk di paling ujung menggantikan posisi ibunya"}, "correct": "E", "pembahasan": "Azzam akhirnya duduk di paling ujung menggantikan posisi ibunya Pertama, siapkan empat tempat untuk mengisi nama – nama. Selanjutnya, susun pernyataan yang diketahui dari petunjuk yang paling jelas: 1) Keempat anggota keluarga duduk di empat kursi yang disusun berjajar. Di ujung kanan duduk Bu Lili dan diujung kiri duduk Fatih   2) Azzam dan Pak Wawan duduk diantara keduanya. Terdapat kalimat “Jika Fatih bertukar tempat duduk dengan Azzam yang duduk paling dekat dengannya …”, sehingga karena Shalza memiliki alergi asap rokok. Sehingga ruang yang mungkin untuk tiga orang perokok tersebut adalah K, L, M."}, {"id": 10, "question": "Panitia survei akan mengunjungi delapan rumah secara bergantian. 1) Rumah Aqbil dikunjungi tepat setelah mengunjungi rumah Bethardo 2) Rumah yang dikunjungi pertama adalah rumah Happy 3) Rumah Chofifah dikunjungi sebelum Aqbil 4) Rumah Damar dan rumah Gladys dipisahkan tepat dua rumah lain Urutan kunjungan yang benar adalah …", "choices": {"A": "Happy, Berthado, Aqbil, Chofifah, Damar, Elsa, Fatah, Gladys", "B": "Happy, Gladys, Elsa, Fatah, Damar, Berthado, , Aqbil, Chofifah", "C": "Happy, Gladys, Chofifah, Fatah, Damar, Berthado, Aqbil, Elsa", "D": "Happy, Berthado, Aqbil, Damar, Chofifah, Elsa, Gladys, Fatah", "E": "Happy, Chofifah, Damar, Berthado, Aqbil, Fatah, Gladys, Elsa"}, "correct": "C", "pembahasan": "Happy, Gladys, Chofifah, Fatah, Damar, Berthado, Aqbil, Elsa Kita bisa mencari jawaban dengan menggunakan eliminasi beradsarkan pernyataan yang ada. Opsi A bertentangan dengan pernyataan ke 3) yaitu rumah Chofifah dikunjungi sebelum rumah Aqbil Opsi B bertentangan dengan pernyataan ke 3) yaitu rumah Chofifah dikunjungi sebelum rumah Aqbil Opsi D bertentangan dengan pernyataan ke 3) yaitu rumah Chofifah dikunjungi sebelum rumah Aqbil Opsi E bertentangan dengan pernyataan ke 4) yaitu rumah Damar dan rumah Gladys dipisahkan tepat dua rumah lain   NUMERIK - BERHITUNG SEDERHANA ARITMATIKA DASAR Aritmetika dasar adalah cabang matematika yang mempelajari operasi-operasi dasar pada bilangan, yaitu penjumlahan, pengurangan, perkalian, dan pembagian. ➕➖✖➗ Operasioperasi ini membentuk fondasi dari semua perhitungan matematika yang lebih kompleks dan merupakan keterampilan penting yang digunakan dalam kehidupan sehari-hari, dari menghitung uang kembalian hingga memecahkan masalah ilmiah. Penjumlahan Penjumlahan adalah proses menggabungkan dua atau lebih bilangan untuk mendapatkan jumlah totalnya. Simbol yang digunakan untuk pe "P - Q = Rp 4.000", "E": "Hubungan P dan Q tidak dapat ditentukan"}, "correct": "C", "pembahasan": "P = Q Misalkan harga satu kelerang adalah 𝑥𝑥 dan uang Darius adalah 𝑦𝑦, maka: 26𝑥𝑥 = 𝑦𝑦 + 3000 16𝑥𝑥 = 𝑦𝑦 – 2000 Lakukan eliminasi variable 𝑦𝑦 dengan mengurangkan persamaan maka: 10𝑥𝑥 = 5000"}, {"id": 9, "question": "Bayu menempuh jarak 120 km dengan mengendarai motor berkecepatan 36 km/jam. Dimas menempuh jarak yang sama dengan waktu 40 menit lebih lambat dari Bayu. Manakah hubungan yang benar antara kuantitas P dan Q berikut berdasarkan informasi yang diberikan?", "choices": {"A": "P > Q", "B": "P < Q", "C": "P = Q", "D": "P - Q = 1 km/jam", "E": "Hubungan P dan Q tidak dapat ditentukan"}, "correct": "C", "pembahasan": "P = Q Waktu tempuh Bayu adalah:"}]}, "PELAYANAN PUBLIK": {"category": "TKP", "title": "PELAYANAN PUBLIK", "questions": [{"id": 1, "question": "Saat Anda ditugaskan di bagian koperasi untuk menyiapkan atribut sekolah, Anda bertanggung jawab untuk memastikan bahwa semua peserta didik baru memiliki perlengkapan sekolah yang cukup saat mereka mendaftar ulang. Namun, ketika Anda sedang bekerja di koperasi, Anda menyadari bahwa stok atribut sekolah hampir habis. Anda segera bergerak untuk mengambil stok baru di gudang sehingga Anda dapat memastikan kelancaran proses pendaftaran ulang. Namun, di tengah perjalanan Anda menuju gudang, Anda bertemu dengan seorang murid difabel yang tampak kesulitan berjalan. Dia meminta bantuan Anda untuk mengantarkannya ke ruang daftar ulang. Maka yang akan Anda lakukan?", "choices": {"A": "Meminta bantuan pada orang lain yang kebetulan lewat dan sedang menuju ke tempat daftar ulang untuk mengantarkannya.", "B": "Memanggilkan rekan panitia daftar ulang yang sedang senggang untuk membantu murid tersebut ke tempat tujuannya.", "C": "Menasihatinya agar lain waktu membawa kerabat yang bisa membantunya dalam kegiatan seperti daftar ulang saat itu.", "D": "Menyampaikan padanya untuk meminta bantuan pada panitia yang bertugas mengarahkan para peserta didik baru.", "E": "Mencari pengganti untuk mengambil stok di gudang dan mengantarkan murid tersebut ke tempat tujuannya."}, "correct": "B", "pembahasan": "Memanggilkan rekan panitia daftar ulang yang sedang senggang untuk membantu murid tersebut ke tempat tujuannya. Urutan Skor Tertinggi - Rendah = BEADC Soal tersebut menguji aspek orientasi pada pelayanan. Aspek orientasi pada pelayanan yang diujikan di tes TKP CPNS, bertujuan untuk mengukur kesiapan dan kesigapan pada tugas pelayanan yang diberikan. Seseorang yang berorientasi pada pelayanan akan terindikasi dari: selalu   mendahulukan kepentingan umum daripada kepentingan pribadi; senang melayani terutama untuk kepentingan orang banyak. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda memiliki kepedulian dan menunjukkan keramahtamaan dalam membantu orang lain. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda tidak menunjukkan keramahtamaan pada orang yang memerlukan bantuan Anda."}, {"id": 2, "question": "Di sebuah kota besar, terdapat beberapa rumah sakit yang berkompetisi untuk menyediakan layanan kesehatan terbaik bagi masyarakat. Setiap rumah sakit berusaha keras untuk memberikan pelayanan yang berkualitas agar pasien merasa nyaman dan puas dengan perawatan yang mereka terima. Tetapi dalam beberapa tahun terakhir, semakin banyak masyarakat yang memilih untuk berobat ke luar negeri, khususnya ke Singapura. Faktor penyebabnya adalah persepsi pelayanan rumah sakit, kualitas tenaga medis, maupun kualitas pelayanan rumah sakit. Hasil sebuah penelitian menunjukkan bahwa persepsi pelayanan rumah sakit bukan penyebab seseorang pergi berobat ke Singapura, tetapi faktor yang menentukan adalah kualitas tenaga medis dan kualitas pelayanan rumah sakit. Anda sebagai pimpinan sebuah Rumah Sakit, langkah apa yang akan Anda lakukan untuk menanggulangi permasalahan tersebut?", "choices": {"A": "Memberikan fasilitas khusus bagi kelompok rentan dan mengadakan pelatihan untuk tenaga kesehatan.", "B": "Mengidentifkasi masalah di Rumah Sakit tempat Anda bekerja dan merancang kegiatan untuk peningkatan pelayanan dan kompetensi tenaga kesehatan.", "C": "Meningkatkan kualitas pelayanan untuk pasien kelompok lansia.", "D": "Membuat seminar untuk meningkatkan pelayanan rumah sakit untuk para tenaga kesehatan.", "E": "Memberikan fasilitas tambahan bagi Ibu Hamil dan Ibu menyusui sebagai salah satu pasien yang istimewa."}, "correct": "B", "pembahasan": "Mengidentifkasi masalah di Rumah Sakit tempat Anda bekerja dan merancang kegiatan untuk peningkatan pelayanan dan kompetensi tenaga kesehatan. Urutan Skor Tertinggi - Rendah = BACED Soal ini menguji aspek pelayanan publik, khususunya terkait profesionalisme dalam menjalankan Rumah Sakit. Opsi dengan skor tertinggi adalah opsi \"Mengidentifkasi masalah di Rumah Sakit tempat Anda bekerja dan merancang kegiatan untuk peningkatan pelayanan dan kompetensi tenaga kesehatan.\" . Hal ini beralasan bahwa terdapat usaha untuk menyelesaikan masalah yang ada di rumah sakit terlebih dahulu, baru selanjutnya menyelesaikan masalah global yang tercantum dalam sebuah hasil penelitian sebelumnya yaitu kualitas tenaga medis dan kualitas pelayanan rumah sakit. Berbagai solusi yang tersebut dalam opsi jawaban merupakan solusi yang baik dengan mempertimbangkan asas-asas pelayanan publik, tetapi opsi E sudah mencakup opsi lainnya pula."}, {"id": 3, "question": "Anda adalah seorang frontliner di suatu perusahaan ternama. Tugas anda melayani setiap tamu yang datang ke perusahaan tempat anda bekerja. Suatu hari datang seorang klien yang mendesak ingin bertemu dengan   pimpinan perusahaan anda. Namun, pimpinan pada saat itu sedang dinas ke luar kota, dan klien tersebut belum membuat janji untuk bertemu sebelumnya. Klien tersebut mengatakan bahwa ia membutuhkan keputusan dari atasan saat itu juga terkait program kerja sama antara perusahaan dan klien tersebut. Anda sudah mencoba menghubungi pimpinan beberapa kali namun telepon tersebut tidak tersambung. Sikap anda …", "choices": {"A": "Meminta tamu tersebut datang kembali besok setelah pimpinan pulang dari perjalanan dinas.", "B": "Mengambil keputusan tanpa petunjuk pimpinan selama tidak bertentangan dengan aturan perusahaan.", "C": "Mengambil keputusan tanpa petunjuk pimpinan karena sangat mendesak.", "D": "Mengirim pesan singkat kepada pimpinan dan meminta klien tersebut menunggu.", "E": "Tidak berani membuat keputusan tanpa pertimbangan pimpinan."}, "correct": "A", "pembahasan": "Meminta tamu tersebut datang kembali besok setelah pimpinan pulang dari perjalanan dinas. Urutan Skor Tertinggi - Rendah = ADBCE Dalam pelayanan publik, tidak hanya harus mengutamakan keramahtamahan dalam melayani, tetapi juga harus sesuai dengan fungsi jabatan yang dimiliki. Disebutkan bahwa anda adalah seorang frontliner. Meski tamu tersebut kelihatannya sedang terburu-buru, anda tidak boleh melangkahi wewenang anda sebagai karyawan. Pengambilan keputusan terutama untuk hal-hal penting seperti pada soal tetap harus mempertimbangkan keputusan pimpinan. Berhubung pimpinan tidak bisa dihubungi, tamu tersebut terpaksa harus kembali lagi ketika pimpinan pulang dari perjalanan dinas."}, {"id": 4, "question": "Anda bekerja di bagian front office dan hari ini Anda mendapatkan jadwal shift siang, rekan Anda baru saja pulang ketika ada seorang ibu-ibu yang datang dan marah-marah kepada Anda. Ia meminta pertanggungjawaban Anda karena telah membatalkan jadwal tanpa sepengetahuan beliau. Padahal Anda tidak tahu menahu tentang hal tersebut karena rekan Anda tidak mengatakan apapun tadi. Maka yang akan Anda lakukan?", "choices": {"A": "Meminta bantuan rekan yang lain untuk menenangkan orang tersebut agar tidak membuat kegaduhan disana.", "B": "Meminta ibu-ibu itu untuk memarahi rekan Anda saja besok saat jadwal shiftnya", "C": "Mencoba menanyainya dengan sabar tentang kronologi kejadiannya, walau beliau saat ini sedang marah.", "D": "Mengatakan bahwa itu adalah kesalahannya sendiri, Anda dan juga rekan Anda tidak mungkin melakukan sesuatu tanpa sebab.", "E": "Tetap bersikap tenang dan ramah, sambil berusaha mencari tahu letak permasalahan dan tahu apa yang harus Anda lakukan."}, "correct": "E", "pembahasan": "Tetap bersikap tenang dan ramah, sambil berusaha mencari tahu letak permasalahan dan tahu apa yang harus Anda lakukan. Urutan Skor Tertinggi - Rendah = ECABD Soal tersebut menguji aspek orientasi pada pelayanan. PNS sudah tentu harus siap dengan pekerjaan yang bersifat pelayanan. Hal itu merupakan suatu bentuk pengabdian bagi negara karena melayani masyarakat. Aspek   orientasi pada pelayanan yang diujikan di tes TKP CPNS, bertujuan untuk mengukur kesiapan dan kesigapan pada tugas pelayanan yang diberikan. Seseorang yang berorientasi pada pelayanan akan terindikasi dari: selalu mendahulukan kepentingan umum daripada kepentingan pribadi; senang melayani terutama untuk kepentingan orang banyak. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda memilki keramahtamaan dan kepedulian terhadap orang lain. Poin terendah ada pada jawaban yang menunjukkan bahwa anda tidak melakukan aksi nyata untuk menolong."}, {"id": 5, "question": "Anda bekerja di bagian loket pengaduan konsumen, saat ini loket yang sedang Anda jaga itu sangat ramai apalagi hari ini Anda bekerja hanya berdua. Tetapi, di tengah-tengah keadaan yang masih ramai seperti ini, seorang lansia meminta bantuan Anda untuk diantarkan ke loket kepengurusan. Pada saat itu juga satpam sedang tidak berada di ruangan karena mengurus kerumunan antrian yang mulai rusuh di luar. Maka sikap Anda adalah ....", "choices": {"A": "Meminta beliau untuk menunggu satpam kembali agar bisa mengantarkannya ke loket yang dituju.", "B": "Mengarahkan beliau kepada sesama konsumen yang mungkin akan ke tempat yang sama.", "C": "Memintanya agar lain waktu membawa seseorang yang bisa membantu beliau saat akan berpergian kemana-mana.", "D": "Mengarahkannya ke loket lain yang terlihat lebih senggang dan meminta bantuan kepada rekan Anda yang berada di loket itu untuk mengantarkannya.", "E": "Meminta seorang rekan untuk menggantikan Anda terlebih dahulu karena Anda akan mengantarkan konsumen tersebut ke loket seharusnya."}, "correct": "E", "pembahasan": "Meminta seorang rekan untuk menggantikan Anda terlebih dahulu karena Anda akan mengantarkan konsumen tersebut ke loket seharusnya. Urutan Skor Tertinggi - Rendah = EDABC Soal tersebut menguji aspek pelayanan publik dengan tujuan: menunjukkan kemampuan menampilkan perilaku keramahtamahan dalam bekerja yang efektif agar bisa memenuhi kebutuhan dan kepuasan orang lain sesuai dengan tugas dan wewenang yang dimiliki. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda memiliki kepedulian terhadap orang lain dengan menunjukkan keramahtamaan dan pelayanan yang baik. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda kurang ramah pada orang yang membutuhkan bantuan."}, {"id": 6, "question": "Anda bertugas sebagai penjaga loket di sebuah taman hiburan yang terkenal ramai pengunjungnya. Setiap hari, terutama saat akhir pekan atau musim liburan, loket pembelian tiket menjadi sangat sibuk dan padat dengan orang-orang yang antusias ingin menikmati wahana dan atraksi yang ditawarkan. Pada suatu hari, ketika Anda sedang berjaga di loket, Anda melihat pemandangan yang agak mengkhawatirkan. Orang-orang yang ingin membeli tiket sudah tidak lagi mengantri secara tertib seperti   biasanya. Mereka berdesak-desakan dan bahkan berebutan mendekati loket, mencoba untuk mendapatkan posisi terdepan agar bisa segera membeli tiket. Di tengah kondisi tersebut, makan yang akan Anda lakukan adalah …", "choices": {"A": "Meminta petugas keamanan untuk menertibkan dan tidak segansegan memberi sanksi bagi yang tidak mengindahkan arahan petugas.", "B": "Meminta teman saya berjaga dan melayani di loket sementara saya mengatur antrian pengunjung di depan.", "C": "Meminta seluruh pengunjung untuk mengantri dengan tertib dan menegaskan bahwa loket tidak akan dibuka apabila tidak tertib antrian.", "D": "Keadaan tersebut sudah terlalu sulit dikendalikan sehingga anda akan melayani saja siapa yang lebih dulu mendatangi loket.", "E": "Melaporkan kondisi yang sulit terkendali tersebut kepada atasan agar ia bisa mengambil langkah yang tepat untuk menertibkannya."}, "correct": "C", "pembahasan": "Meminta seluruh pengunjung untuk mengantri dengan tertib dan menegaskan bahwa loket tidak akan dibuka apabila tidak tertib antrian. Urutan Skor Tertinggi - Rendah = CABED Soal tersebut menguji aspek pelayanan publik dengan tujuan: menunjukkan kemampuan menampilkan perilaku keramahtamahan dalam bekerja yang efektif agar bisa memenuhi kebutuhan dan kepuasan orang lain sesuai dengan tugas dan wewenang yang dimiliki. Dalam permasalahan ini anda dituntut untuk mampu mengarahkan kerumunan yang sudah tidak teratur agar tertib kembali. Anda juga diminta untuk dapat bersikap tegas agar ketertiban dapat tercapai."}, {"id": 7, "question": "Anda adalah seorang karyawan yang bekerja pada sebuah perusahaan yang berfokus pada pelayanan masyarakat, khususnya dalam bidang layanan publik. Sebagai bagian dari tim tersebut, Anda menyadari bahwa setiap individu memiliki kemampuan yang berbeda dalam memahami regulasi dan kebijakan pelayanan yang perusahaan Anda tetapkan. Hal ini seringkali menyebabkan terjadinya miskomunikasi antara petugas perusahaan dan masyarakat pengguna layanan. Tidak hanya itu, masalah teknis seperti gangguan sistem dan proses yang lambat juga sering dikeluhkan oleh masyarakat. Oleh karena itu untuk lebih meningkatkan pelayanan maka …", "choices": {"A": "Perlu dibuatkan sebuah call center yang siap 24 jam untuk menerima semua pengaduan masyarakat.", "B": "Email koresponden dibutuhkan agar operator bisa melayani seluruh pertanyaan yang masuk dari masyarakat seputar pelayanan.", "C": "Menempatkan kotak saran di loket pelayanan untuk mengakomodir semua keluhan masyarakat.", "D": "Mendirikan loket customer service sebagai tempat masyarakat memperoleh informasi secara langsung.", "E": "Membangun sistem FAQ di web perusahaan untuk menjawab pertanyaan-pertanyaan yang sering ditanyakan terkait regulasi dan kebijakan pelayanan."}, "correct": "D", "pembahasan": "Mendirikan loket customer service sebagai tempat masyarakat memperoleh informasi secara langsung. Urutan Skor Tertinggi - Rendah = DEBAC Soal tersebut bertujuan untuk menjadikan Anda pelayan publik yang dapat memberikan solusi terbaik terutama terkait dengan proses pelayanan. Dalam soal tersebut banyak masyarakat mengeluhkan terjadinya miskomunikasi dan permasalahan teknis, untuk mengatasi masalah tersebut solusi terbaik adalah mendirikan loket customer service agar masyarakat memperoleh informasl secara langsung untuk meminimalisir miskomunlkasi. Jawaban paling tepat terdapat pada opsi D."}, {"id": 8, "question": "Anda bekerja di sebuah kantor pelayanan di mana Anda bertanggung jawab di loket pengaduan konsumen. Loket ini terletak di lantai pertama. Setiap hari, Anda menerima banyak sekali pengaduan dari masyarakat terkait dengan masalah penggunaan aplikasi untuk pembuatan kartu kesehatan secara online. Banyak orang mengeluhkan bahwa aplikasi tersebut tidak berfungsi dengan baik. Suatu hari, ketika sedang bertugas di loket, datang seorang konsumen yang menggunakan kursi roda. Dia adalah seorang difabel dan ingin menanyakan tentang proses perpanjangan administrasi kartu kesehatan yang sudah habis masa anggotanya. Anda tahu bahwa loket untuk perpanjangan administrasi kartu kesehatan berada di lantai dua. Bagaimana Anda akan menangani situasi ini?", "choices": {"A": "Mengarahkan konsumen menuju satpam dan meminta bantuan satpam untuk menanggapi keperluan konsumen tersebut di loket perpanjangan administrasi.", "B": "Memberitahu letak ruangan perpanjangan administrasi kartu kesehatan yaitu ada dilantai dua.", "C": "Membantu konsumen tersebut untuk pengurusan administrasi di lantai dua,", "D": "Memberikan saran ke konsumen sebaiknya dia membawa rekan atau saudara untuk membantu mengurus keperluannya.", "E": "Memberitahu letak loket perpanjangan administrasi dan membantu konsumen tersebut untuk kepengurusan di lantai dua."}, "correct": "A", "pembahasan": "Mengarahkan konsumen menuju satpam dan meminta bantuan satpam untuk menanggapi keperluan konsumen tersebut di loket perpanjangan administrasi. Urutan Skor Tertinggi - Rendah = ABDEC Saal ini bertujuan- untuk menjadikan Anda orang yang sigap dalam mengambil keputusan secara tepat dan cepat namun serta tldak merugikan pihak manapun dan tetap berorientasi pada pelayanan. Dalam soal dijelaskan bahwa anda sedang menangani banyak pengaduan dari konsumen, dalam waktu yang bersamaan datang konsumen memakai kursi roda menanyakan proses perpanjangan adminlstrasi kartu kesehatan yang berada di lantai 2 sedangkan anda berada di lantai"}, {"id": 10, "question": "Rizal adalah seorang pramusaji yang bekerja dengan penuh semangat di sebuah restoran yang cukup ramai di kota. Hari itu, restoran sedang dipenuhi oleh pengunjung yang antusias. Saat sedang melayani seorang pelanggan dengan penuh perhatian, Rizal tiba- tiba merasa tergelincir dan tanpa sengaja menumpahkan minuman yang dihidangkan ke pakaian pelanggan tersebut. Pelanggan itu langsung bereaksi dengan kesal dan marah, mengancam akan melaporkan kelalaian Andi pada atasan di restoran tersebut, sementara mata sekitar ikut memperhatikan kejadian itu. Sikap Anda …", "choices": {"A": "Mencegahnya dan menutupi kesalahan Anda pada atasan.", "B": "Memberikan penggantian pada pelanggan tersebut.", "C": "Meminta maaf dan mengkomunikasikan pada atasan.", "D": "Meminta maaf sebagai bentuk penyesalan.", "E": "Langsung mengundurkan diri."}, "correct": "C", "pembahasan": "Meminta maaf dan mengkomunikasikan pada atasan. Urutan Skor Tertinggi - Rendah = CEADB   Pesan dari situasi ini adalah bahwa sebagai profesional di bidang layanan, penting untuk tetap menjaga profesionalisme dan fokus pada penyelesaian yang efektif dan prima. Jika kita melakukan kesalahan dalam proses pelayanan kepada pelanggan, langkah pertama yang harus kita ambil adalah meminta maaf dengan tulus. Setelah itu, penting untuk segera berkoordinasi dengan atasan atau pimpinan karena tindakan kita dapat memengaruhi citra lembaga atau instansi tempat kita bekerja. Dengan mengambil langkah-langkah tersebut, kita dapat menunjukkan bahwa kita bertanggung jawab atas kesalahan kita, dan kita siap untuk melakukan perbaikan serta menjaga kepercayaan pelanggan dan reputasi lembaga.   PROFESIONALISME  Profesionalisme dalam konteks CPNS bukanlah sekadar tentang memiliki keahlian teknis, tetapi lebih pada sikap dan perilaku yang mencerminkan komitmen, integritas, dan tanggung jawab dalam menjalankan tugas sebagai abdi negara. Bagian ini biasanya diuji dalam soal-soal TKP yang mengukur sejauh mana Anda memiliki karakter profesional yang diperlukan oleh seorang ASN. Secara umum, profesionalisme bagi ASN berlandaskan pada prinsip-prinsip yang tercantum dalam Undang-Undang Nomor 5 Tahun 2014 tentang Aparatur Sipil Negara dan Kode Etik PNS. Dijelaskan pada Undang-Undang Nomor 5 Tahun 2014 tentang Aparatur Sipil Negara : BAB II ASAS, PRINSIP, NILAI DASAR, SERTA KODE ETIK DAN KODE PERILAKU Pasal 2 Penyelenggaraan kebijakan dan Manajemen ASN berdasarkan pada asas: a. kepastian hukum; b. profesionalitas; c. proporsionalitas; d. keterpaduan; e. delegasi; f. netralitas; g. akuntabilitas; h. efektif dan efisien; i. keterbukaan; j. nondiskriminatif; k. persatuan dan kesatuan; l. keadilan dan kesetaraan; dan m. kesejahteraan.   Poin Profesionalisme dalam Kode Etik PNS Secara umum, profesionalisme dalam kode etik PNS tercermin dalam beberapa poin utama, yang sering diuji dalam soal TKP CPNS."}]}, "PROFESIONALISME": {"category": "TKP", "title": "PROFESIONALISME", "questions": [{"id": 1, "question": "Seorang petugas gizi di Rumah Sakit tempat Anda bekerja dengan sengaja memberikan jumlah diet 1.700 Kkal kepada pasien, padahal sebenarnya secara teori pasien harus mendapatkan 2.100 KKal. Anda sudah menegur pegawai tersebut tetapi responsnya malah tidak kooperatif dan mencoba untuk membenarkan tindakannya. Kebetulan seminggu kemudian pasien tersebut datang kembali ke Rumah Sakit tempat Anda bekerja dan mengeluh berat badannya turun drastis. Saat itu pegawai yang sebelumnya menangani pasien tersebut tidak hadir. Sebagai petugas laboratorium Anda tidak sengaja bertemu dengan pasien tersebut, apa yang akan Anda sampaikan?", "choices": {"A": "Memanggil ahli gizi lain untuk melakukan analisis mendalam dan menceritakan riwayat sebelumnya.", "B": "Memberikan analisis dan argumentasi mengapa jumlah tersebut membuatnya kurus dan memberikan saran agar kembali normal.", "C": "Memberikan arahan yang tepat agar berat badannya dapat kembali normal", "D": "Menyarankan agar si pasien menghentikan program tersebut dan berkonsultasi kembali.", "E": "Meminta maaf dan menyatakan bahwa diet yang dirancang oleh rekan Anda salah."}, "correct": "A", "pembahasan": "Memanggil ahli gizi lain untuk melakukan analisis mendalam dan menceritakan riwayat sebelumnya. Urutan Skor Tertinggi - Rendah = CDBAE Soal di atas mengujikan terkait profesionalisme. Salah satu aspek yang diuji adalah kemampuan dalam melaksanakan tugas dan fungsi sesuai dengan tuntutan Jabatan. Dalam narasi di atas, Anda dimisalkan sebagai petugas laboratorium, sedangkan program diet tersebut dirancang oleh ahli gizi. Sehingga opsi yang tepat hanya opsi \"Memanggil ahli gizi lain untuk melakukan analisis mendalam dan menceritakan riwayat sebelumnya."}, {"id": 3, "question": "Di tengah kompetisi IT yang diadakan di kantor Anda, tim IT Anda menemui tantangan yang cukup besar karena skor mereka jauh lebih rendah dibandingkan dengan tim IT lainnya. Salah satu anggota tim mengusulkan untuk menyerah, dengan alasan bahwa selisih skor yang signifikan membuat peluang untuk mengejar tim lain menjadi sangat kecil. Meskipun terlihat sulit, saat seperti ini sebenarnya adalah momen penting untuk menunjukkan ketangguhan dan semangat pantang menyerah. Meskipun peluang untuk menang mungkin tampak tipis, tetapi dengan tetap berjuang, tim masih memiliki kesempatan untuk memperbaiki skor mereka. Pada situasi yang seperti ini bagaimana sikap Anda?", "choices": {"A": "Memberi semangat pada anggota tim dan tetap melakukan yang terbaik dalam kompetisi, apapun hasilnya nanti.", "B": "Tetap melakukan yang terbaik karena saya yakin kemampuan anggota tim saya mampu mengejar skor tim lainnya.", "C": "Berusaha memberi semangat kepada tim saya, walaupun tidak banyak yang bisa saya lakukan untuk mengejar selisih skor.", "D": "Mengikuti saran anggota lainnya dan cukup berfokus pada proses saya bersama tim, kalah pun tidak masalah.   E. Berpasrah karena setelah melihat kondisi tim yang pesimis, saya pun menjadi ikut pesimis terhadap kompetisi ini."}, "correct": "A", "pembahasan": "Memberi semangat pada anggota tim dan tetap melakukan yang terbaik dalam kompetisi, apapun hasilnya nanti. Urutan Skor Tertinggi - Rendah = ABCDE Soal tersebut menguji aspek semangat berprestasi. Tidak setiap pegawai memiliki semangat untuk terus berprestasi. Sebagian besar hanya berkeinginan bekerja sesuai standar. Menjadi seorang CPNS diperlukan sifat yang haus akan prestasi sehingga dalam tes TKP CPNS terdapat soal yang mengujikan tentang aspek semangat berprestasi. Hal ini bertujuan untuk mengukur tingkat motivasi serta kekuatan tekad seseorang dalam melaksanakan tugasnya dengan baik dan meraih target-target tertentu. Poin tertinggi ada pada jawaban yang menunjukkan bahwa Anda melakukan yang terbaik pada kondisi yang tidak terduga. Pada pilihan jawaban ini Anda mempunyai keyakinan pada anggota Anda sebagai tim, sikap tersebut menunjukkan sikap profesionalitas terhadap kewenangan Anda sebagai ketua dari tim."}, {"id": 4, "question": "Saat hendak membayar makan siang di kantin bersama dengan rekan Anda, dompet Anda tertinggal di dalam tas yang tersimpan di loker kerja. Lalu rekan Anda menawarkan untuk membayar tagihan makan Anda. Anda berjanji untuk mengganti uang tersebut setelah sampai di kantor nantinya. Tetapi rekan Anda mengatakan bahwa tidak perlu mengembalikan uang tersebut. Tidak sengaja Anda melihat isi dompet rekan Anda yang hendak membayar makanan, hanya tersisa 100.000-rupiah yang cukup untuk membayar makanan Anda dan rekan Anda. Sedangkan waktu untuk menerima gaji masih beberapa hari lagi. Melihat situasi seperti ini bagaimanakah sikap yang seharusnya Anda lakukan?", "choices": {"A": "Saya berkata akan menggantinya jika saya ingat nanti, jika dia tetap mengatakan untuk tidak mengganti uangnya saya akan simpan uang itu.", "B": "Sesampainya di kantor nanti saya akan mengganti uang milik teman saya, tidak peduli bagaimana kondisi dia saat ini bagi saya hutang tetaplah hutang.", "C": "Saya membiarkan rekan saya membayar makanan saya, hitunghitung rekan saya belajar tidak pelit dan perhitungan terhadap rekan sendiri.", "D": "Saya akan mengatakan tidak pada rekan saya untuk membayar makanan saya dan lari menuju loker kantor untuk mengambil dompet saya.", "E": "Tetap akan saya kembalikan uang yang telah rekan saya pinjamkan, melihat kondisi dia yang mungkin saja itu merupakan uang terakhir yang dia miliki."}, "correct": "B", "pembahasan": "Sesampainya di kantor nanti saya akan mengganti uang milik teman saya, tidak peduli bagaimana kondisi dia saat ini bagi saya hutang tetaplah hutang. Urutan Skor Tertinggi - Rendah = BEADC Soal tersebut menguji aspek integritas diri. Aspek integritas diri bertujuan untuk mengukur tingkat kebaikan atau ketulusan hati seseorang dalam   kehidupan sehari-hari. Tes bagian ini dapat dijadikan acuan kesesuaian antara tingkah laku peserta terhadap perkataan dan perbuatan yang dilakukan. Biasanya kualitas kepribadian seseorang sebanding dengan integritas dirinya. indikasinya adalah: seseorang yang baik atau tulus maka memiliki keberanian dalam mengatakan kebenaran, dapat membedakan dengan pasti hal yang benar dan salah, berani memperjuangkan kebaikan dan kebenaran, tidak takut terhadap risiko apa pun yang menimpa atas tindakan membela atau mempertahankan kebenaran, meskipun risiko yang ditanggung bisa saja dapat mengancam kelangsungan kariernya. Poin tertinggi ada pada jawaban yang menunjukkan bahwa Anda bersikap jujur dan bertanggung jawab. Saat meminjam sesuatu kepada orang lain baiknya kita tidak perlu mempertimbangkan akan mengembalikannya atau tidak dengan melihat dahulu bagaimana kondisi keuangannya. Jika Anda meminjam berarti Anda berkewajiban untuk mengembalikannya. Perbedaan dengan jawaban yang memiliki poin 4 adalah Anda bersikap bertanggung jawab dengan cara mengembalikan pinjaman teman Anda, tetapi Anda melakukan hal tersebut dengan mempertimbangkan kondisi keuangan rekan Anda. Poin jawaban terendah ada pada jawaban yang menunjukkan bahwa Anda berbuat semena-mena dan kurang memiliki rasa tanggung jawab. Dengan adanya bantuan dari orang lain harusnya Anda berterima kasih bukannya memanfaatkan keadaan untuk mencari keuntungan sendiri."}, {"id": 5, "question": "Beberapa bulan lagi adik Anda lulus dan mendapat gelar sarjana pendidikan. Anda sudah mengajar di sekolah dasar selama delapan tahun dan menjabat sebagai kepala sekolah. Adik Anda meminta kepada Anda untuk mengajar di sekolah tempat Anda bekerja. Alasan ingin mengajar di sekolah karena adik Anda belum menemukan pekerjaan yang cocok dengan dirinya. Dengan jabatan yang Anda miliki, memenuhi permintaan adik Anda bukanlah hal yang sulit. Maka sikap Anda?", "choices": {"A": "Meminta adik saya mengajar atas rekomendasi saya. Apapun alasan dia mengajar yang penting adik saya tidak terlihat menganggur.", "B": "Membiarkan dia melakukan apa yang dia mau, saya sebagai kakaknya akan bertanggung jawab jika ada hal buruk terjadi di sekolah karenanya.", "C": "Meminta adik saya untuk mencari pekerjaan yang lain terlebih dahulu, agar pengetahuan pendidikannya semakin luas.", "D": "Memberikan dia jabatan yang tinggi di sekolah karena dia adalah adik saya.", "E": "Saya tidak dapat memenuhi permintaan adik saya untuk mengajar di sekolah tempat saya bekerja jika alasannya supaya tidak terlihat menganggur."}, "correct": "E", "pembahasan": "Saya tidak dapat memenuhi permintaan adik saya untuk mengajar di sekolah tempat saya bekerja jika alasannya supaya tidak terlihat menganggur. Urutan Skor Tertinggi - Rendah = ECABD Soal tersebut menguji aspek integritas diri. Aspek integritas diri bertujuan untuk mengukur tingkat kebaikan atau ketulusan hati seseorang dalam kehidupan sehari-hari. Tes bagian ini dapat dijadikan acuan kesesuaian antara tingkah laku peserta terhadap perkataan dan perbuatan yang   dilakukan. Biasanya kualitas kepribadian seseorang sebanding dengan integritas dirinya. indikasinya adalah: seseorang yang baik atau tulus maka memiliki keberanian dalam mengatakan kebenaran, dapat membedakan dengan pasti hal yang benar dan salah, berani memperjuangkan kebaikan dan kebenaran, tidak takut terhadap risiko apa pun yang menimpa atas tindakan membela atau mempertahankan kebenaran, meskipun risiko yang ditanggung bisa saja dapat mengancam kelangsungan kariernya. Poin tertinggi ada pada jawaban yang menunjukkan bahwa Anda mampu bersikap tegas akan situasi seperti ini. dengan memberikan pekerjaan kepada adik Anda yang memiliki alasan demi kepentingan pribadi merupakan hal yang salah, menunjukkan sikap jujur dan bertanggung jawab untuk tidak menyelewengkan kewenangan Anda sebagai kepala sekolah. Perbedaan dengan jawaban yang memiliki poin 4 adalah bersikap lunak walaupun itu adalah adik Anda tetapi ketegasan untuk meminta pekerjaan dengan cara yang salah merupakan hal yang salah. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda bersikap semena-mena serta tidak melaksanakan pekerjaan dengan semestinya. Dengan menyelewengkan wewenang Anda, Anda tidak memiliki sikap integritas."}, {"id": 6, "question": "Karena kenaikan jabatan saya, atasan memberikan saya fasilitas kantor berupa mobil pribadi. Dengan adanya inventaris yang disediakan oleh kantor saya bisa datang ke tempat reuni keluarga besar. Sebelum mendapatkan jabatan saya saat ini, saya sering diejek karena tidak memiliki mobil maupun rumah tinggal sendiri. Selama 28 tahun saya tinggal bersama kedua orang tua saya beserta adik, kakak, dan kakak ipar saya. Saya sering di cemooh tidak bisa hidup mandiri. Pada saat acara besar itu dimulai semua orang mulai membanggakan saya kepada saudara-saudara yang lain. Saya sangat bersyukur dengan apa yang saya miliki saat ini. Atas capaian yang berhasil saya raih ini, sikap saya …", "choices": {"A": "Ini sesuatu yang pantas saya banggakan kepada semua orang, karena saya telah bekerja keras untuk mencapai kedudukan saya saat ini.", "B": "Saya akan memanfaatkan barang pemberian perusahaan seperti barang milik saya sendiri.", "C": "Semua yang saya miliki belum seberapa dengan semua kerja keras yang saya lakukan, saya yakin mampu mendapat lebih banyak lagi.", "D": "Saya akan bekerja lebih keras lagi agar dapat mempertahankan apa yang saya dapatkan saat ini.", "E": "Ini adalah reward atas kerja keras saya. Segala yang saya miliki saat ini berupa titipan, tetapi suatu saat nanti saya akan membeli dengan uang sendiri."}, "correct": "D", "pembahasan": "Saya akan bekerja lebih keras lagi agar dapat mempertahankan apa yang saya dapatkan saat ini. Urutan Skor Tertinggi - Rendah = DEABC Soal tersebut menguji aspek integritas diri. Aspek integritas diri bertujuan untuk mengukur tingkat kebaikan atau ketulusan hati seseorang dalam kehidupan sehari-hari. Tes bagian ini dapat dijadikan acuan kesesuaian antara tingkah laku peserta terhadap perkataan dan perbuatan yang   dilakukan. Biasanya kualitas kepribadian seseorang sebanding dengan integritas dirinya. indikasinya adalah: seseorang yang baik atau tulus maka memiliki keberanian dalam mengatakan kebenaran, dapat membedakan dengan pasti hal yang benar dan salah, berani memperjuangkan kebaikan dan kebenaran, tidak takut terhadap risiko apa pun yang menimpa atas tindakan membela atau mempertahankan kebenaran, meskipun risiko yang ditanggung bisa saja dapat mengancam kelangsungan kariernya. Poin tertinggi ada pada jawaban yang menunjukkan bersikap penuh syukur serta mampu menjaga amanah yang telah diberikan. Perbedaan dengan pilihan jawaban poin 4 adalah Anda memandang bahwa apa yang berikan perusahaan merupakan suatu kebanggaan bukan memandang bahwa pemberian ini merupakan suatu fasilitas penunjang pekerjaan Anda. Poin terendah ada pada jawaban yang menunjukkan bahwa Anda memandang fasilitas perusahaan merupakan hak milik Anda pribadi. Apalagi berharap akan mendapatkan lebih dari perusahaan."}, {"id": 7, "question": "Belakangan ini Anda melihat salah satu rekan Anda berperilaku mencurigakan sehingga Anda sering mengawasinya diam-diam. Suatu hari rekan Anda yang biasanya datang dengan penampilan formal biasa, sekarang datang dengan barang-barang branded dan tentunya tidak sebanding dengan gaji bulanan yang kalian dapat selama di divisi itu. Hal ini semakin membuat Anda curiga apalagi saat atasan mengatakan bahwa dari hasil laporan keuangan yang dibuat rekan Anda itu menyatakan bahwa pengeluaran perusahaan lebih besar dari bulan-bulan sebelumnya. Padahal yang Anda tahu selama ini pengeluaran masih stabil dan tidak berbeda jauh dari bulan-bulan sebelumnya. Maka dari itu Anda akan..", "choices": {"A": "Menjauhi rekan tersebut agar tidak terlibat, dan sesekali mengingatkan rekan Anda agar tidak melakukan tindakan yang akan merugikan dirinya.", "B": "Marah dan menentang apa yang dilakukan rekan Anda, tetapi hanya bisa bicara dalam hati karena tidak ingin membuat masalah dengan rekan kerja.", "C": "Bertanya bagaimana cara ia mendapatkan barang-barang branded tersebut. Apabila dengan cara yang salah maka Anda akan menegur dan melaporkannya.", "D": "Hal seperti ini merupakan masalah yang sudah biasa terjadi di kantor manapun, jadi tidak perlu menjadikan ini sebagai hal besar.", "E": "Segera melaporkannya kepada atasan atau pihak berwajib karena tindakannya tersebut termasuk tindak pidana korupsi dan tidak bisa dibenarkan."}, "correct": "C", "pembahasan": "Bertanya bagaimana cara ia mendapatkan barangbarang branded tersebut. Apabila dengan cara yang salah maka Anda akan menegur dan melaporkannya. Urutan Skor Tertinggi - Rendah = CEABD Soal tersebut menguji aspek integritas diri. Aspek integritas diri bertujuan untuk mengukur tingkat kebaikan atau ketulusan hati seseorang dalam kehidupan sehari-hari. Tes bagian ini dapat dijadikan acuan kesesuaian antara tingkah laku peserta terhadap perkataan dan perbuatan yang dilakukan. Biasanya kualitas kepribadian seseorang sebanding dengan integritas dirinya. Indikasinya adalah: seseorang yang baik atau tulus maka   memiliki keberanian dalam mengatakan kebenaran, dapat membedakan dengan pasti hal yang benar dan salah, berani memperjuangkan kebaikan dan kebenaran, tidak takut terhadap risiko apa pun yang menimpa atas tindakan membela atau mempertahankan kebenaran, meskipun risiko yang ditanggung bisa saja dapat mengancam kelangsungan kariernya. Poin tertinggi ada pada pilihan jawaban yang menunjukkan bahwa Anda memiliki integritas dan profesionalisme dalam bekerja. Poin terendah ada pada jawaban yang menunjukkan bahwa anda memakhlumi pelanggaran/ kecurangan yang ada di lingkungan kerja anda."}, {"id": 8, "question": "Ali adalah seorang pegawai bagian program dan keuangan di Kantor. Salah satu aset kantor adalah mobil dinas yang ia pakai setiap hari untuk berangkat ke kantor. Ada peraturan kantor yang melarang menggunakan mobil dinas untuk kepentingan pribadi baik saat maupun di luar jam kerja. Pada suatu hari, anggota keluarga Ali sakit secara mendadak dan harus segera dibawa ke rumah sakit untuk mendapatkan perawatan intensif karena kondisinya cukup serius. Namun, kondisi lalu lintas jalan kota sangat macet, dan tidak ada kendaraan lain selain mobil dinas yang tersedia di rumah. Hal yang sebaiknya dilakukan Ali adalah …", "choices": {"A": "Menggunakan mobil dinas untuk segera membawa anggota keluarga ke rumah sakit karena kondisinya mendesak. Belum tentu ada rekan kerja atau atasan yang melihat Ali menggunakan mobil dinas.", "B": "Menggunakan mobil dinas untuk segera membawa anggota keluarga ke rumah sakit karena kondisinya mendesak. Tentu hal inl bisa dimaklumi karena sedang dalam kondisi darurat dan bukan untuk kegiatan berfoya-foya.", "C": "Menelpon ambulance untuk menjemput anggota keluarga yang saklt untuk segera dibawa ke rumah sakit guna mendapatkan perawatan lntensif.", "D": "Menelpon keluarga yang memillki kendaraan untuk meminta tolong mengantarkan anggota keluarga saya yang sedang kritis ke rumah sakit.", "E": "Mencarikan taksi terdekat atau mencarter angkutan umum untuk membawa anggota keluarga ke rumah sakit dengan segera."}, "correct": "C", "pembahasan": "Menelpon ambulance untuk menjemput anggota keluarga yang saklt untuk segera dibawa ke rumah sakit guna mendapatkan perawatan lntensif. Urutan Skor Tertinggi - Rendah = CDEBA Soal ini bertujuan untuk menguji sikap profesionalitas dan integritas seseorang terhadap profesinya, yang tercermin dari kepatuhan terhadap peraturan yang berlaku. Dalam kasus ini, peraturan kantor yang melarang penggunaan mobil dinas untuk kepentingan pribadi telah dijelaskan dengan jelas. Karena itu, opsi A dan B yang mengarah pada penggunaan mobil dinas untuk kepentingan pribadi saat situasi darurat tidak diperkenankan. Meskipun situasi darurat memang memerlukan tindakan cepat, kepatuhan terhadap peraturan tetap penting untuk menjaga profesionalitas dan integritas seorang pegawai. Opsi C, D, dan E adalah solusi alternatif yang bisa dipertimbangkan. Namun, opsi yang paling tepat adalah opsi C, yaitu menelpon ambulans.   Menghubungi layanan ambulans adalah langkah yang tepat dalam situasi darurat ketika anggota keluarga membutuhkan perawatan medis yang mendesak. Dengan demikian, seseorang tetap mematuhi peraturan kantor dan memberikan pertolongan yang sesuai dengan keadaan tanpa melanggar aturan yang berlaku."}, {"id": 9, "question": "Awai tahun ini anda baru saja lulus dari sebuah universitas ternama dengan predikat cumlaude. Anda pun mencoba peruntungan untuk melamar di beberapa perusahaan. Setelah mengikuti beberapa kali proses seleksi di beberapa perusahaan akhirnya anda diterima di sebuah perusahaan yang terletak di pinggiran kota. Kemudian Anda memutuskan untuk mencari kontrakan di sekitar lokasi perusahaan anda bekerja. Namun anda merasa tinggal di pinggiran kota memang sangat tidak mengenakkan. Mulai dari susahnya transportasi umum untuk ke kota, jauhnya fasilitas kesehatan, sampai jarangnya tempat hiburan sebagai pelepas stress jika pulang bekerja, tapi dengan tinggal di pinggiran kota membuat anda sering tiba tepat waktu di kantor, bagaimana sikap anda ..", "choices": {"A": "Saya akan mencoba untuk bertahan semampunya untuk tetap tinggal di plnggiran kota karena akan membuat saya leblh dekat dengan lokasi perusahaan", "B": "Mencari tempat tinggal lain yang leblh nyaman, mesipun sedikit jauh darl lokasi perusahaan tempat anda bekerja", "C": "Mencari cara agar dapat menikmati kehidupan di daerah pinggiran kota yang lokasinya dekat dengan pekerjaan anda", "D": "Berusaha untuk bekerja lebih giat dengan harapan blsa mendapatkan fasiltas rumah dari kantor.", "E": "Menerima hal lni sebagai resiko dari pekerjaan yang anda ambil dan berusaha untuk tetap bisa merasa nyaman tinggal di daerah pinggiran"}, "correct": "E", "pembahasan": "Menerima hal lni sebagai resiko dari pekerjaan yang anda ambil dan berusaha untuk tetap bisa merasa nyaman tinggal di daerah pinggiran Urutan Skor Tertinggi - Rendah = ECDAB Soal ini bertujuan untuk mengukur sikap profesionalitas Anda terhadap tantangan yang muncul dalam pekerjaan atau profesi Anda. Tantangan yang muncul seharusnya tidak dianggap sebagai hambatan, tetapi sebagai motivasi untuk mencari solusi dan jalan keluar yang tepat. Dalam situasi di mana tinggal di daerah pinggiran kota memberikan dampak baik terhadap pekerjaan Anda, maka memilih tinggal di tempat tersebut adalah pilihan yang tepat. Anda dapat mencari hobi atau kegiatan lain yang membuat Anda tetap merasa nyaman tinggal di tempat tersebut, meskipun mungkin terletak di pinggiran kota. Oleh karena itu, pilihan E adalah pilihan yang paling maksimal, karena menunjukkan sikap yang positif dan fleksibel dalam menghadapi tantangan serta mampu mencari solusi yang menguntungkan bagi pekerjaan Anda."}, {"id": 10, "question": "Ketika menjadi panitia sebuah acara di kampus Anda, mendapatkan telepon dari pacar Anda yang meminta bantuan untuk menjemputnya ke stasiun kota. Pacar Anda mengatakan bahwa dia telah mencoba menghubungi jasa   angkutan online, tetapi tidak ada yang merespons pesanannya. Sementara itu, Anda memiliki banyak tugas yang harus diselesaikan hari ini, terutama karena acara tersebut akan dilaksanakan besok. Sikap anda ...", "choices": {"A": "Minta maaf dan mengatakan bahwa anda tidak bisa datang untuk menjemputnya.", "B": "Memintanya untuk mencoba lagi untuk memesan jasa kendaraan online.", "C": "Menjemputnya terlebih dahulu dan melanjutkan pekerjaan yang tertunda selama anda pergi.", "D": "Memlnta rekan anda yang lain untuk menyelesaikan tugas anda dan pergi menjemput pacar anda.", "E": "Tidak datang menjemput dan resiko diputusin pacar oleh pacar anda."}, "correct": "B", "pembahasan": "Memintanya untuk mencoba lagi untuk memesan jasa kendaraan online. Urutan Skor Tertinggi - Rendah = BAECD Soal ini bertujuan untuk mengetahui sikap profesionalitas Anda terkait penyelesaian tanggung jawab dan berorientasi pada kepentingan instansi atau organisasi di atas kepentingan pribadi. Dalam soal dijelaskan bahwa Anda masih memiliki banyak tugas yang harus diselesaikan hari ini, tentu saja Anda harus mengutamakan tugas tersebut sebagai bentuk profesionalitas. Di sisi lain Anda dapat memberikan usul kepada pacar anda untuk mencoba lagi memesan jasa ken
